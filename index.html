<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0c0d0f">
<title>Mayhem Ink — Press Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* =====================================================================================
   PRESS BOARD v4 — "Press Display" (dark) with Industrial-Signal info blocks.
   Landscape: art | info | up-next.   Portrait: art on top, info, up-next strip.
   ===================================================================================== */
:root{
  --bg:#0c0d0f; --bg2:#0f1113; --panel:#16191c; --panel2:#1a1d21; --line:#23272c; --hard:#353b42;
  --txt:#f2f2f2; --sub:#aab1b7; --mut:#8a9096; --dim:#5d646b;
  --lime:#c6ff3d; --limeD:#1a2210; --red:#ff5a36; --redD:#2a1511; --amber:#ffb020; --blue:#5fb4ff; --green:#3ddc84;
  --bc:'Barlow Condensed','Avenir Next Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --in:Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);overflow:hidden}
body{font-family:var(--in);-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;-webkit-user-select:text;user-select:text}
img{display:block}
.hide{display:none!important}

/* ---------- app frame ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#top{height:62px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.pbadge{font:800 28px/1 var(--bc);letter-spacing:.03em;background:var(--lime);color:var(--bg);padding:5px 12px 4px;border-radius:8px;white-space:nowrap}
.pbadge.float{background:#fff}
.opchip{font:700 15px var(--in);padding:8px 13px;border-radius:99px;background:var(--panel2);display:flex;gap:7px;align-items:center;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.opchip i{width:9px;height:9px;border-radius:50%;background:var(--lime);flex:none}
.opchip.none{color:var(--mut)} .opchip.none i{background:var(--dim)}
.navtabs{display:flex;gap:4px;margin-left:6px}
.navtab{font:800 19px var(--bc);letter-spacing:.07em;color:var(--mut);padding:7px 13px;border-radius:8px}
.navtab.on{background:#1f2327;color:#fff}
.navtab .ct{display:inline-block;min-width:20px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--amber);color:#111;font-size:14px;letter-spacing:0;text-align:center}
.tclock{margin-left:auto;font:700 25px var(--mono);white-space:nowrap}
.tclock small{font:600 13px var(--in);color:var(--mut);margin-right:10px;letter-spacing:.02em}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--dim);margin-left:10px;flex:none}
.syncdot.ok{background:var(--green)} .syncdot.bad{background:var(--red)}
.edpill{font:800 13px var(--bc);letter-spacing:.12em;background:var(--amber);color:#111;padding:4px 8px;border-radius:5px}
#main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:flex}

/* ---------- banners ---------- */
#banner{flex:none}
.lunchbar{display:flex;align-items:center;gap:14px;background:var(--amber);color:#111;padding:12px 18px;font:800 26px/1 var(--bc);letter-spacing:.04em;cursor:pointer;animation:pulse 2.4s ease-in-out infinite}
.lunchbar small{font:700 15px var(--in);letter-spacing:0;margin-left:auto;opacity:.75}
.lunchbar .x{font:800 16px var(--bc);background:#0002;padding:8px 12px;border-radius:8px;letter-spacing:.08em}
@keyframes pulse{0%,100%{filter:none}50%{filter:brightness(1.12)}}
.infobar{display:flex;align-items:center;gap:12px;background:var(--redD);color:#ffd4c8;border-bottom:2px solid var(--red);padding:10px 18px;font:700 16px var(--in)}
.infobar b{font:800 18px var(--bc);letter-spacing:.1em;color:var(--red)}

/* ---------- MY PRESS ---------- */
#v-press{display:none;min-height:0}
#v-press.on{display:grid;grid-template-columns:minmax(0,1fr) 290px}
.pane{display:grid;grid-template-columns:44% minmax(0,1fr);min-height:0;min-width:0}
.art{position:relative;background:#fff;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-right:4px solid var(--bg)}
.art>img.main{max-width:100%;max-height:100%;object-fit:contain}
.art .artlbl{position:absolute;left:0;right:0;top:0;background:var(--bg);color:var(--lime);font:800 19px var(--bc);letter-spacing:.12em;padding:8px 14px;display:flex;gap:10px;white-space:nowrap;overflow:hidden}
.art .artlbl.setup{color:var(--amber)} .art .artlbl.pause{color:var(--red)} .art .artlbl.idle{color:var(--sub)} .art .artlbl.done{color:var(--green)}
.art .artlbl .tm{margin-left:auto;font-family:var(--mono);letter-spacing:0;font-size:17px}
.art .zoom{position:absolute;right:10px;top:46px;background:#0c0d0fd9;color:#fff;font:700 13px var(--in);padding:9px 12px;border-radius:8px;pointer-events:none}
.art .thumbs{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
.art .thumbs img{width:58px;height:58px;object-fit:cover;border-radius:8px;border:3px solid #fff;box-shadow:0 1px 6px #0006;background:#fff}
.art .thumbs img.on{border-color:var(--lime)}
.noart{color:#555;font:800 30px/1.1 var(--bc);text-align:center;letter-spacing:.04em;padding:30px}
.noart small{display:block;font:600 16px var(--in);color:#888;margin-top:10px;letter-spacing:0}
.info{display:flex;flex-direction:column;gap:9px;padding:12px 16px 14px;min-width:0;min-height:0;overflow:hidden}
.jobline,.loc,.tiles,.inks,.tags,.minirow{flex:none}
.warn{flex:none}
.note{flex:0 1 auto;min-height:0;overflow:hidden}
.jobline{display:flex;align-items:baseline;gap:10px;min-width:0}
.jobline .jn{font:800 58px/.9 var(--bc);white-space:nowrap}
.jobline .jn a{color:inherit;text-decoration:none}
.jobline .jc{font:700 20px/1.1 var(--bc);color:var(--mut);letter-spacing:.04em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.loc{font:800 29px/1.02 var(--bc);text-transform:uppercase;letter-spacing:.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:3px solid var(--hard);border-radius:4px;overflow:hidden;background:var(--hard);gap:3px}
.tile{background:var(--panel);padding:6px 10px 5px;min-width:0}
.tile b{display:block;font:800 34px/1 var(--bc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font:700 13px var(--bc);letter-spacing:.12em;color:var(--mut);white-space:nowrap}
.tile b.sm{font-size:26px;line-height:34px}
.tile.hot{background:var(--red)} .tile.hot span{color:#ffe1d8}
.tile.ok{background:#12301f} .tile.ok b{color:var(--green)}
.inks{display:flex;flex-direction:column;gap:6px}
.ink{display:flex;border:3px solid var(--hard);border-radius:4px;overflow:hidden;background:var(--panel);min-height:44px}
.ink i{width:66px;flex:none;border-right:3px solid var(--hard)}
.ink b{font:800 24px/1 var(--bc);padding:9px 12px;letter-spacing:.04em;align-self:center}
.ink small{margin-left:auto;align-self:center;padding-right:12px;font:700 14px var(--bc);color:var(--mut);letter-spacing:.1em}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:800 16px var(--bc);letter-spacing:.06em;padding:4px 9px;border:2px solid var(--hard);border-radius:4px;color:#dfe3e6;white-space:nowrap}
.tag.hot{background:var(--amber);border-color:var(--amber);color:#111}
.tag.lime{border-color:var(--lime);color:var(--lime)}
.tag.red{background:var(--red);border-color:var(--red);color:#fff}
.note{border-left:5px solid var(--lime);background:var(--limeD);color:#e6f7c9;border-radius:4px;padding:8px 12px;font:700 19px/1.15 var(--bc);letter-spacing:.02em;text-transform:uppercase}
.warn{background:var(--amber);color:#111;border-radius:4px;padding:8px 12px;font:800 20px/1.12 var(--bc);letter-spacing:.02em;text-transform:uppercase}
.go{margin-top:auto;display:flex;gap:10px;height:92px;flex:none}
.big{flex:1;min-width:0;border-radius:12px;background:var(--lime);color:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;font:800 42px/1 var(--bc);letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.big small{font:700 24px var(--mono);opacity:.72;letter-spacing:0}
.big.setup{background:var(--amber)} .big.resume{background:var(--red);color:#fff} .big.done{background:#12301f;color:var(--green);font-size:30px}
.big.off{background:var(--panel2);color:var(--mut)}
.big:active,.side:active,.q:active{transform:scale(.985)}
.side{width:82px;flex:none;border-radius:12px;background:var(--panel2);border:2px solid var(--line);color:#c4c9cd;font:800 14px var(--bc);letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.side em{font-style:normal;font-size:24px;line-height:1}
.minirow{display:flex;gap:8px;flex:none}
.mini{flex:1;height:44px;border-radius:10px;background:var(--panel2);border:2px solid var(--line);font:800 16px var(--bc);letter-spacing:.08em;color:#c4c9cd;display:flex;align-items:center;justify-content:center;gap:6px}
.mini.lime{color:var(--lime);border-color:#c6ff3d55}

/* up-next column */
.queue{border-left:1px solid var(--line);background:var(--bg2);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.qh{display:flex;justify-content:space-between;align-items:center;font:800 15px var(--bc);letter-spacing:.14em;color:var(--mut);padding:2px 2px 0}
.qh button{color:var(--lime);font:800 15px var(--bc);letter-spacing:.1em}
.q{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px;text-align:left;width:100%}
.q .qi{width:58px;height:58px;border-radius:6px;background:#fff;object-fit:cover}
.q .qi.none{background:var(--panel2);display:flex;align-items:center;justify-content:center;font:800 12px var(--bc);color:var(--dim)}
.q b{display:block;font:800 21px/1.02 var(--bc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q p{font:600 13px/1.25 var(--in);color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .m{font:800 13px var(--bc);letter-spacing:.07em;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .m .r{color:var(--red)} .q .m .g{color:var(--green)} .q .m .a{color:var(--amber)}
.q.next{border-color:var(--lime)} .q.next b{color:var(--lime)}
.q.sel{border-color:#fff}
.q.act{border-color:var(--amber)} .q.act b{color:var(--amber)}
.q.dn{opacity:.5}
.qsec{font:800 13px var(--bc);letter-spacing:.16em;color:var(--dim);margin:6px 2px 0}
.qempty{font:700 15px var(--in);color:var(--mut);padding:16px 6px;text-align:center;line-height:1.5}

/* empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px}
.empty h2{font:800 64px/.95 var(--bc)}
.empty h2 span{color:var(--lime)}
.empty p{font:600 18px/1.5 var(--in);color:var(--sub);max-width:640px}
.btn{font:800 22px var(--bc);letter-spacing:.08em;padding:14px 22px;border-radius:10px;background:var(--panel2);border:2px solid var(--hard);color:#fff}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--bg)}
.btn.sm{font-size:17px;padding:9px 14px}

/* ---------- BOTH PRESSES (float) ---------- */
#v-float{flex-direction:column;min-height:0}
.lanes{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.lane{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line);min-height:0;overflow-y:auto}
.lane:last-child{border-right:0}
.lh{display:flex;align-items:center;gap:10px}
.lh .pbadge{font-size:23px}
.lh span{font:800 17px var(--bc);letter-spacing:.1em;color:var(--mut)}
.lnow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;background:var(--panel);border:3px solid var(--lime);border-radius:12px;padding:10px;text-align:left;width:100%}
.lnow.setup{border-color:var(--amber)} .lnow.pause{border-color:var(--red)} .lnow.idle{border-color:var(--hard)}
.lnow .li{width:150px;height:150px;object-fit:contain;background:#fff;border-radius:8px}
.lnow .li.none{background:var(--panel2)}
.lnow .k{font:800 15px var(--bc);letter-spacing:.14em;color:var(--lime)}
.lnow.setup .k{color:var(--amber)} .lnow.pause .k{color:var(--red)} .lnow.idle .k{color:var(--mut)}
.lnow b{font:800 42px/1 var(--bc);display:block}
.lnow p{font:800 20px/1.05 var(--bc);text-transform:uppercase;margin:3px 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips div{border:2px solid var(--hard);border-radius:4px;padding:2px 8px;font:800 18px var(--bc)}
.chips div span{font-size:12px;letter-spacing:.1em;color:var(--mut);margin-left:3px}
.chips .hot{background:var(--red);border-color:var(--red)}
.pull{flex:none;border-top:1px solid var(--line);padding:10px 14px 12px;background:var(--bg2)}
.pull h4{font:800 16px var(--bc);letter-spacing:.14em;color:var(--lime);margin-bottom:8px}
.pull .pl{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.pitem{flex:none;width:250px;display:grid;grid-template-columns:48px minmax(0,1fr) 42px;gap:8px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px;text-align:left}
.pitem img,.pitem .qi{width:48px;height:48px;border-radius:6px;object-fit:cover;background:#fff}
.pitem .qi.none{background:var(--panel2)}
.pitem b{display:block;font:800 18px/1 var(--bc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem p{font:700 12px var(--in);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .ck{width:40px;height:40px;border-radius:8px;border:3px solid var(--hard);display:flex;align-items:center;justify-content:center;font:800 24px var(--bc);color:var(--bg)}
.pitem.on{border-color:var(--green)} .pitem.on .ck{background:var(--green);border-color:var(--green)}

/* ---------- WEEK ---------- */
#v-week{flex-direction:column;min-height:0}
.wtop{flex:none;padding:12px 16px 8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.days{display:flex;gap:6px;overflow-x:auto}
.day{flex:1;min-width:92px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:7px 6px;text-align:center}
.day b{display:block;font:800 21px/1 var(--bc);letter-spacing:.05em}
.day small{font:700 12px var(--in);color:var(--mut)}
.day.on{border-color:#fff;background:#1f2327}
.day.today b{color:var(--lime)}
.day.alldone{opacity:.5}
.wsearch{display:flex;gap:8px}
.wsearch input{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:10px;color:#fff;padding:11px 14px;font:600 17px var(--in)}
.wsearch input::placeholder{color:var(--dim)}
.wbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 30px}
.wcols{max-width:1100px;margin:0 auto}
.flag{display:flex;border-radius:8px;overflow:hidden;margin-bottom:6px;border:2px solid var(--line)}
.flag .ft{flex:0 0 118px;background:var(--panel2);color:var(--lime);font:800 15px var(--bc);letter-spacing:.1em;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px}
.flag .fx{flex:1;padding:9px 12px;font:600 15px/1.45 var(--in);color:#dfe3e6;background:var(--panel)}
.jg{background:var(--panel);border:2px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}
.jgh{display:flex;gap:12px;padding:10px 12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.jgh .ths{display:flex;gap:6px;flex:none}
.jgh .ths img{width:72px;height:72px;border-radius:8px;object-fit:cover;background:#fff}
.jgh .t1{font:800 32px/1 var(--bc)}
.jgh .t1 a{color:inherit;text-decoration:none}
.jgh .t1 span{font:700 18px var(--bc);color:var(--mut);letter-spacing:.04em;margin-left:8px;text-transform:uppercase}
.jgh .hn{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.jgh .note,.jgh .warn{font-size:17px;padding:6px 10px}
.edrow{display:flex;gap:6px;flex-wrap:wrap}
.edb{font:800 14px var(--bc);letter-spacing:.08em;color:var(--amber);border:1.5px dashed #ffb02088;border-radius:6px;padding:5px 9px}
.run{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);border-left:6px solid transparent;width:100%;text-align:left}
.run:first-of-type{border-top:0}
.run.setup{border-left-color:var(--amber)} .run.print{border-left-color:var(--lime)} .run.pause{border-left-color:var(--red)} .run.done{border-left-color:var(--green);opacity:.6}
.run .rl{flex:1;min-width:0}
.run .rl b{display:block;font:800 22px/1.05 var(--bc);text-transform:uppercase}
.run .rl p{font:700 13px var(--in);color:var(--mut);margin-top:3px}
.stbadge{font:800 14px var(--bc);letter-spacing:.1em;padding:5px 10px;border-radius:5px;background:var(--panel2);color:var(--mut);white-space:nowrap}
.stbadge.setup{background:var(--amber);color:#111} .stbadge.print{background:var(--lime);color:#111} .stbadge.pause{background:var(--red);color:#fff} .stbadge.done{background:#12301f;color:var(--green)}
.rundd{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.runed{display:flex;gap:4px}
.runed button{font:800 14px var(--bc);color:var(--amber);border:1.5px solid #ffb02066;border-radius:6px;min-width:34px;height:30px;padding:0 7px}
.wfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0 10px}

/* ---------- job (opened from week) ---------- */
#v-job{flex-direction:column;min-height:0}
.jobbar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.jobbar .back{font:800 20px var(--bc);letter-spacing:.08em;color:var(--lime);padding:6px 4px}
.jobbar .daynote{font:700 15px var(--in);color:var(--amber)}
#v-job .pane{flex:1}

/* ---------- export ---------- */
#v-export{flex-direction:column;min-height:0}
#v-export pre{flex:1;overflow:auto;margin:0 16px 16px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px;font:500 13px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text;color:#dfe3e6}

/* ---------- overlays / modals ---------- */
.ov{position:fixed;inset:0;z-index:50;display:none;background:#050607f2}
.ov.on{display:flex}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;background:radial-gradient(circle at 50% 30%,#1a1f14,transparent 60%)}
.center h2{font:800 104px/.88 var(--bc);margin:14px 0 6px}
.center h2 span{color:var(--lime)}
.center .sub{font:800 21px var(--bc);letter-spacing:.08em;color:var(--mut)}
.names{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:30px 0 22px;max-width:1000px}
.nm{width:180px;height:132px;border-radius:14px;background:var(--panel);border:3px solid var(--hard);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:800 38px var(--bc)}
.nm small{font:800 14px var(--bc);letter-spacing:.12em;color:var(--mut)}
.nm.in{border-color:var(--lime);background:var(--limeD)} .nm.in small{color:var(--lime)}
.nm.else{opacity:.45}
.firstup{display:flex;align-items:center;gap:14px;background:var(--panel);border:3px solid var(--hard);border-radius:10px;padding:8px 18px 8px 8px;max-width:900px}
.firstup img,.firstup .qi{width:56px;height:56px;border-radius:6px;object-fit:cover;background:#fff;flex:none}
.firstup div{text-align:left;font:800 23px/1.1 var(--bc)}

<script>
// ======== [v3 engine] estFor/fmtDur/todayStr ========
// ---------- run-time estimate (v3.1) ----------
// This is INFORMATION, not a target: what a run like this usually takes, so a printer can
// tell a quick job from an all-afternoon one. Never scored, never colored red. Rows built
// with "noest":true (puff, heavy ink changes, color counts with no logged runs) show
// nothing — a visibly wrong estimate teaches the crew to ignore all of them.
function estFor(row, r){
  if(row.noest) return null;
  var c = (r && r.colors != null) ? r.colors : row.colors;
  var s = (r && r.screens != null) ? r.screens : row.screens;
  var pph = STATS.pph[c], sm = STATS.setup[c];
  if(!pph || !sm || !row.qty) return null;
  return {setup: Math.round(s*sm), print: Math.round(row.qty/pph*60)};
}
function fmtDur(m){
  if(m == null) return "";
  if(m < 60) return m + "m";
  var h = Math.floor(m/60), mm = m%60;
  return h + "h" + (mm ? " " + mm + "m" : "");
}

function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

// ======== [v3 engine] persistence+findRow ========
// ---------- persistence (same per-day keys as v2, so nothing already logged is lost) ----------
function loadState(day){
  try{ return JSON.parse(localStorage.getItem("mayhem_timing_" + day)) || {}; }catch(e){ return {}; }
}
function saveStateFor(day){
  try{ localStorage.setItem("mayhem_timing_" + day, JSON.stringify(STATES[day])); }catch(e){}
}
function loadClock(day){
  try{ return JSON.parse(localStorage.getItem("mayhem_clock_" + day)) || {}; }catch(e){ return {}; }
}
function saveClock(day){
  try{ localStorage.setItem("mayhem_clock_" + day, JSON.stringify(CLOCKS[day])); }catch(e){}
  try{ SYNC.clockDirty[day] = 1; }catch(e){}
}
function findRow(id){
  for(var i = 0; i < ALLROWS.length; i++) if(ALLROWS[i].id === id) return ALLROWS[i];
  // Virtual "jobnote_<job>_<day>" records carry editor overrides for the green/red bands.
  // They ride the same per-row sync (LWW on `notes`) so both iPads converge on them.
  if(String(id).indexOf("jobnote_") === 0){
    var p = String(id).split("_");
    if(p.length >= 3 && DAYSARR.indexOf(p.slice(2).join("_")) > -1){
      return {id:id, job:p[1], _day:p.slice(2).join("_"), customer:"", location:"", _virtual:true};
    }
  }
  // Virtual "jobday_<rowId>" records carry editor day-moves (2026-09-14). Same trick:
  // the target day is packed into `notes` (LWW on the worker), keyed on the run's own id,
  // stored under the run's HOME day so its taps and sync id never change.
  if(String(id).indexOf("jobday_") === 0){
    var base = findRow(String(id).slice(7));
    if(base && !base._virtual){
      return {id:id, job:base.job, _day:base._day, customer:"", location:"", _virtual:true, _base:base.id};
    }
  }
  return null;
}
// ======== [v3 engine] day moves core ========
// ---------- day moves (editor) ----------
// A card keeps living on its week.json day (that's where its state is stored and synced);
// the override only changes which TAB it renders under. A repush of week.json doesn't
// clear moves — Reset does. Nothing about timing or stats depends on the tab.
function jobDayId(rowId){ return "jobday_" + rowId; }
function dayOverride(row){
  if(!row || row._virtual) return null;
  var st = STATES[row._day]; var r = st && st[jobDayId(row.id)];
  if(!r || !r.notes) return null;
  try{
    var o = JSON.parse(r.notes);
    return (o && o.d && DAYSARR.indexOf(o.d) > -1 && o.d !== row._day) ? o.d : null;
  }catch(e){ return null; }
}
function showDay(row){ return dayOverride(row) || row._day; }
function writeJobDay(row, day){
  var id = jobDayId(row.id);
  var st = STATES[row._day] || (STATES[row._day] = {});
  var r = st[id] || (st[id] = {id:id, printer:null, pauses:[], handoffs:[], _mt:{}});
  r.notes = day ? JSON.stringify({d:day, at:now()}) : "";
  if(!r._mt) r._mt = {};
  r._mt.notes = now();
  try{ SYNC.snap[id] = {notes:r.notes}; SYNC.dirty[id] = 1; }catch(e){}
  saveStateFor(row._day);
}
// ======== [v3 engine] jobnote core ========
function jobNoteId(day, job){ return "jobnote_" + job + "_" + day; }
function jobNoteOverride(day, job){
  var st = STATES[day]; var r = st && st[jobNoteId(day, job)];
  if(!r || !r.notes) return null;
  try{ var o = JSON.parse(r.notes); return (o && typeof o === "object") ? o : null; }catch(e){ return null; }
}
// ======== [v3 engine] writeJobNotes ========
function writeJobNotes(day, job, val){
  var id = jobNoteId(day, job);
  var st = STATES[day] || (STATES[day] = {});
  var r = st[id] || (st[id] = {id:id, printer:null, pauses:[], handoffs:[], _mt:{}});
  r.notes = val;
  if(!r._mt) r._mt = {};
  r._mt.notes = now();
  try{ SYNC.snap[id] = {notes:val}; SYNC.dirty[id] = 1; }catch(e){}
  saveStateFor(day);
  closeJobNotes();
  if(!currentRow) renderList();
  try{ syncPush(); }catch(e){}
}
// ======== [v3 engine] state/time/pauses/handoffs/status ========
function stateFor(row){ return STATES[row._day] || (STATES[row._day] = {}); }
function save(){
  if(!currentRow) return;
  try{ syncTouch(currentRow.id); }catch(e){}   // never let sync break a tap
  saveStateFor(currentRow._day);
}
function rec(id){
  var row = findRow(id);
  var st = stateFor(row);
  if(!st[id]) st[id] = {printer:null, press:null, setupBy:null, printBy:null, colors:row.colors, screens:row.screens, setupStart:null, setupDone:null, jobDone:null, emailedAt:null, emailConfirmed:false, pauses:[], handoffs:[], notes:""};
  if(!st[id].pauses) st[id].pauses = [];
  if(!st[id].handoffs) st[id].handoffs = [];
  if(st[id].colors == null) st[id].colors = row.colors;
  if(st[id].screens == null) st[id].screens = row.screens;
  return st[id];
}

// ---------- time helpers ----------
function now(){ return Date.now(); }
function fmt(ts){
  if(!ts) return "";
  var d = new Date(ts);
  var h = d.getHours(), m = d.getMinutes();
  var ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return h + ":" + String(m).padStart(2,"0") + " " + ap;
}
function toHM(ts){
  var d = new Date(ts);
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function fromHM(hm, refTs){
  var d = new Date(refTs || now());
  var p = hm.split(":");
  d.setHours(Number(p[0]), Number(p[1]), 0, 0);
  return d.getTime();
}
function mins(ms){ return Math.round(ms/60000); }
// ---------- stops: base entries + patches (2026-09-14) ----------
// The worker (and unionLog below) keep the FIRST copy of a pause they ever see, keyed on
// its start — so a resume, an edit or a delete never reached the other iPad, and a deleted
// stop came straight back on the next pull (Spencer's "stop that cannot be deleted").
// Every change to an existing stop is therefore appended as a PATCH entry
//   {at:<unique ts>, k:<start of the stop it changes>, end?, start?, reason?, deleted?}
// which the union keeps (keyed on `at`), and pausesOf() folds patches over the base
// entries, latest patch winning. Everything that reads stops goes through pausesOf().
function isPatch(x){ return !!(x && x.k != null && x.at); }
function pausesOf(r){
  var raw = (r && r.pauses) || [], out = [], patches = [], i, j;
  for(i = 0; i < raw.length; i++){
    var x = raw[i];
    if(!x) continue;
    if(isPatch(x)) patches.push(x);
    else out.push({start:x.start, end:(x.end == null ? null : x.end), reason:x.reason || "", added:!!x.added, edited:!!x.edited, _k:x.start, _del:false});
  }
  patches.sort(function(a, b){ return a.at - b.at; });
  for(i = 0; i < patches.length; i++){
    var p = patches[i];
    for(j = 0; j < out.length; j++){
      if(out[j]._k !== p.k) continue;
      if(p.deleted){ out[j]._del = true; }
      else {
        out[j]._del = false;
        if(p.start != null) out[j].start = p.start;
        if(p.end !== undefined) out[j].end = p.end;
        if(p.reason != null) out[j].reason = p.reason;
        if(p.edited) out[j].edited = true;
      }
      break;
    }
  }
  out = out.filter(function(x){ return !x._del; });
  out.sort(function(a, b){ return a.start - b.start; });
  return out;
}
var _lastPatchAt = 0;
function patchPause(r, k, changes){
  var at = now();
  if(at <= _lastPatchAt) at = _lastPatchAt + 1;
  _lastPatchAt = at;
  var p = {at:at, k:k};
  for(var f in changes){ if(changes.hasOwnProperty(f)) p[f] = changes[f]; }
  r.pauses = r.pauses || [];
  r.pauses.push(p);
  // also close/patch the base copy locally so a device that never synced still reads right
  for(var i = 0; i < r.pauses.length; i++){
    var b = r.pauses[i];
    if(isPatch(b) || b.start !== k) continue;
    if(changes.deleted) break;
    if(changes.end !== undefined) b.end = changes.end;
    if(changes.reason != null) b.reason = changes.reason;
    if(changes.edited) b.edited = true;
    break;
  }
}
function openPause(r){
  var ps = pausesOf(r), op = null;
  for(var i = 0; i < ps.length; i++) if(!ps[i].end) op = ps[i];   // an open stop is open wherever it sorts
  return op;
}
function isPaused(r){ return !!openPause(r); }
function pausedMsBetween(r, a, b){
  var t = 0, ps = pausesOf(r);
  for(var i = 0; i < ps.length; i++){
    var p = ps[i];
    var s = Math.max(p.start, a), e = Math.min(p.end || now(), b);
    if(e > s) t += e - s;
  }
  return t;
}
// ---------- handoffs (v3) ----------
// A run can change hands mid-job. Each handoff stamps the time, who took over, and the
// CUMULATIVE piece count at that moment — that's what lets each printer get an honest
// pcs/hr instead of one guy eating the whole run. Skipping the count is allowed; the run
// still totals correctly, it just can't be split per printer.
function printHandoffs(r){
  return (r.handoffs || []).filter(function(h){ return h.phase === "print"; });
}
function setupHandoffs(r){
  return (r.handoffs || []).filter(function(h){ return h.phase === "setup"; });
}
function priorCum(r){
  var hs = printHandoffs(r);
  for(var i = hs.length-1; i >= 0; i--){ if(hs[i].pieces != null) return hs[i].pieces; }
  return 0;
}
function crewStr(r){
  if(!r) return "?";
  var names = [];
  if(r.printBy) names.push(r.printBy);
  else if(r.printer) names.push(r.printer);
  var hs = printHandoffs(r);
  for(var i = 0; i < hs.length; i++){ if(names.indexOf(hs[i].to) === -1 || names[names.length-1] !== hs[i].to) names.push(hs[i].to); }
  return names.length ? names.join(" → ") : (r.printer || "?");
}
// Split the print phase into per-printer segments, pauses removed from each.
function printSegments(row){
  var r = STATES[row._day][row.id] || {};
  if(!r.setupDone) return [];
  var hs = printHandoffs(r);
  var endTs = r.jobDone || now();
  var pts = [];
  var who = r.printBy || r.printer || "?";
  var t0 = r.setupDone, cum0 = 0;
  for(var i = 0; i < hs.length; i++){
    pts.push({printer: who, start: t0, end: hs[i].at, cumFrom: cum0, cumTo: hs[i].pieces});
    who = hs[i].to; t0 = hs[i].at; cum0 = hs[i].pieces;
  }
  pts.push({printer: who, start: t0, end: endTs, cumFrom: cum0, cumTo: r.jobDone ? row.qty : null});
  var out = [];
  for(var j = 0; j < pts.length; j++){
    var p = pts[j];
    var ms = (p.end - p.start) - pausedMsBetween(r, p.start, p.end);
    var pieces = (p.cumTo != null && p.cumFrom != null) ? (p.cumTo - p.cumFrom) : null;
    out.push({
      printer: p.printer, start: p.start, end: p.end, min: mins(ms), pieces: pieces,
      pph: (pieces != null && ms > 0) ? Math.round(pieces / (ms/3600000)) : null,
      open: !r.jobDone && j === pts.length - 1
    });
  }
  return out;
}

function status(r){
  if(!r) return "idle";
  if(r.jobDone) return "done";
  if(isPaused(r)) return "pause";
  if(r.setupDone) return "print";
  if(r.setupStart) return "setup";
  return "idle";
}
// ======== [v3 engine] clock+gaps ========
// ---------- CREW CLOCK (v3) ----------
// One tap per event: IN when you hit the floor, LUNCH out/in, OUT when you leave.
// This is the denominator for utilization — press time ÷ floor time.
function clockFor(day, p){
  var c = CLOCKS[day] || (CLOCKS[day] = {});
  if(!c[p]) c[p] = {in:null, out:null, lunches:[], gaps:[]};
  if(!c[p].lunches) c[p].lunches = [];
  if(!c[p].gaps) c[p].gaps = [];
  return c[p];
}
function lunchOpen(k){ var l = k.lunches[k.lunches.length-1]; return l && !l.end; }

// ---------- between-jobs time (v3.1) ----------
// The clock starts when a job is finished and stops when the next setup starts. Teardown,
// reclaiming, staging and a breather are all real work-day time — the point isn't to
// eliminate the gap, it's to know WHY it happened. A 40-minute wait on screens is a process
// problem; a 40-minute gap with no reason is worth a conversation. Lunch is subtracted, not
// counted. Nothing here is scored on the iPad.
var GAP_REASONS = ["Teardown","Reclaiming screens","Staging next job","Waiting on screens","Waiting on art/approval","Cleanup","Break","Other"];
var GAP_ASK_MIN = 15;   // under this it's just teardown; don't nag
function gapOpen(k){ var g = k.gaps[k.gaps.length-1]; return g && !g.end; }
function lunchMsBetween(k, a, b){
  var t = 0;
  for(var i = 0; i < k.lunches.length; i++){
    var l = k.lunches[i];
    var s = Math.max(l.start, a), e = Math.min(l.end || now(), b);
    if(e > s) t += e - s;
  }
  return t;
}
function gapMins(k, g){
  var end = g.end || now();
  return mins((end - g.start) - lunchMsBetween(k, g.start, end));
}
function startGap(printer, day){
  if(!printer) return;
  var k = clockFor(day, printer);
  if(gapOpen(k)) return;
  k.gaps.push({start: now(), end: null, reason: null});
  saveClock(day);
}
function endGap(printer, day){
  if(!printer) return;
  var k = clockFor(day, printer);
  var g = k.gaps[k.gaps.length-1];
  if(g && !g.end){ g.end = now(); saveClock(day); }
}
// ======== [v3 engine] export ts ========
function dayHasTaps(day){
  var st = STATES[day] || {};
  for(var id in st){ if(st[id].setupStart) return true; }
  var c = CLOCKS[day] || {};

var SYNC_URL   = "https://mayhem-press-state.autumn-mountain-14c6.workers.dev";

// ---------- mtime stamping so last-write-wins can settle corrections ----------
function syncTouch(id){
  var r = recRO(id);
  if(!r) return;
  var snap = {}, i, f;
  for(i = 0; i < LWW_FIELDS.length; i++){ f = LWW_FIELDS[i]; snap[f] = r[f]; }
  var prev = SYNC.snap[id];
  if(prev){
    if(!r._mt) r._mt = {};
    for(i = 0; i < LWW_FIELDS.length; i++){
      f = LWW_FIELDS[i];
      if(prev[f] !== snap[f]) r._mt[f] = now();
    }
  }
  SYNC.snap[id] = snap;
  SYNC.dirty[id] = 1;
}

// ---------- merge (identical rules to the worker) ----------
function earliestTs(a, b){
  if(!a) return b || null;
  if(!b) return a;
  return Math.min(a, b);
}
function unionLog(a, b){
  var out = [], seen = {}, all = (a || []).concat(b || []);
  for(var i = 0; i < all.length; i++){
    var x = all[i];
    if(!x) continue;
    var k = String(x.at || x.start || i);
    if(seen[k]) continue;
    seen[k] = 1; out.push(x);
  }
  out.sort(function(p,q){ return (p.at||p.start||0) - (q.at||q.start||0); });
  return out;
}
// Fold a server record into the local one. Returns true if anything changed.
function mergeIntoLocal(id, remote){
  var row = findRow(id);
  if(!row || !remote) return false;
  var st = STATES[row._day] || (STATES[row._day] = {});
  var r = st[id];
  if(!r){ st[id] = remote; return true; }

  var before = JSON.stringify(r);
  var i, f;
  var stamps = ["setupStart","setupDone","jobDone"];
  for(i = 0; i < stamps.length; i++){
    f = stamps[i];
    r[f] = earliestTs(r[f], remote[f]);
  }
  r.pauses   = unionLog(r.pauses,   remote.pauses);
  r.handoffs = unionLog(r.handoffs, remote.handoffs);

  if(!r._mt) r._mt = {};
  for(i = 0; i < LWW_FIELDS.length; i++){
    f = LWW_FIELDS[i];
    var mine  = r._mt[f] || 0;
    var yours = (remote._mt || {})[f] || 0;
    if(remote[f] !== undefined && yours > mine){ r[f] = remote[f]; r._mt[f] = yours; }
  }
  r.emailedAt = r.emailedAt || remote.emailedAt || null;
  r.emailConfirmed = !!(r.emailConfirmed || remote.emailConfirmed);

  return JSON.stringify(r) !== before;
}

function syncFetch(path, opts){

  o.headers = o.headers || {};
  o.headers["Content-Type"] = "application/json";
  o.headers["X-Press-Key"] = SYNC_KEY;
  return fetch(SYNC_URL + path, o).then(function(res){ return res.json(); });
}

function syncTick(){

  SYNC.busy = true;
  syncPull()["catch"](function(){})
    .then(function(){ return syncPush(); })["catch"](function(){})
    .then(function(){ SYNC.busy = false; })["catch"](function(){ SYNC.busy = false; });
}

function syncPull(){
  return syncFetch("/state?week=" + encodeURIComponent(WEEKID) + "&k=" + SYNC_KEY, {method:"GET"})
    .then(function(j){
      if(!j || !j.ok || !j.state) return;
      var s = j.state, changed = false, days = {};
      // v4: added cards first (other records may point at them), then everything else
      for(var aid in s.rows){ if(s.rows.hasOwnProperty(aid) && aid.indexOf("add_") === 0 && mergeIntoLocal(aid, s.rows[aid])){ changed = true; var ar = findRow(aid); if(ar) days[ar._day] = 1; } }
      refreshOverrides();
      for(var id in s.rows){
        if(!s.rows.hasOwnProperty(id)) continue;
        if(mergeIntoLocal(id, s.rows[id])){
          changed = true;
          var row = findRow(id);
          if(row) days[row._day] = 1;
        }
      }
      for(var d in days){ if(days.hasOwnProperty(d)) saveStateFor(d); }
      SYNC.jobs = s.jobs || {};
      SYNC.presence = s.presence || {};
      SYNC.lastOk = now();
      if(mergeClocks(s.clocks)) changed = true;
      if(changed) refreshOverrides();
      if(changed){
        if(currentRow) renderDetail();
        else if(typeof renderList === "function") renderList();
      }
      renderPressStrip();
    });
}

function syncPush(){
  var ids = Object.keys(SYNC.dirty);
  var chain = Promise.resolve();
  ids.forEach(function(id){
    chain = chain.then(function(){
      var r = recRO(id);
      if(!r){ delete SYNC.dirty[id]; return; }
      var payload = JSON.parse(JSON.stringify(r));
      payload.id = id;
      return syncFetch("/tap", {
        method: "POST",
        body: JSON.stringify({
          week: WEEKID, deviceId: deviceId(), press: myPress(), row: payload
        })
      }).then(function(j){
        if(j && j.ok){
          delete SYNC.dirty[id];              // only clear on a real success
          if(j.row) mergeIntoLocal(id, j.row);
          var row = findRow(id);
          if(row) saveStateFor(row._day);
          if(j.emailedJob){
            SYNC.jobs[j.emailedJob] = {emailedAt: now()};
            if(currentRow) renderDetail();
          }
        }
      })["catch"](function(){ /* stays dirty, retried next tick */ });
    });
  });

  var cdays = Object.keys(SYNC.clockDirty);
  cdays.forEach(function(day){
    var pl = CLOCKS[day] || {};
    Object.keys(pl).forEach(function(p){
      chain = chain.then(function(){
        return syncFetch("/clock", {
          method: "POST",
          body: JSON.stringify({week: WEEKID, deviceId: deviceId(), day: day, printer: p, clock: pl[p]})
        }).then(function(){ delete SYNC.clockDirty[day]; })["catch"](function(){});
      });
    });
  });

  return chain;
}

function stamp(field){
  var r = rec(currentRow.id);
  if(field === "setupDone" && r.setupStart && (now() - r.setupStart) < 120000){
    if(!confirm("Setup was under 2 minutes — mis-tap? Press OK only if setup really is done.")) return;
  }
  if(field === "jobDone" && r.setupDone && (now() - r.setupDone) < 120000){
    if(!confirm("Print ran under 2 minutes — is the job really done?")) return;
  }
  r[field] = now();
  var op = openPause(r);
  if(op) patchPause(r, op._k, {end: now()});   // a step tap always ends an open stop
  // whoever finishes setup owns the setup minutes; whoever starts printing owns the print
  // minutes from here until a handoff says otherwise
  if(field === "setupDone"){
    if(!r.setupBy) r.setupBy = r.printer;
    if(!r.printBy) r.printBy = r.printer;
  }
  // between-jobs clock: stops when work starts again, starts when a job finishes
  if(field === "setupStart") endGap(r.printer, currentRow._day);
  if(field === "jobDone") startGap(r.printer, currentRow._day);
  save(); renderDetail();
  toast(field === "jobDone" ? "Job done — nice." : "Time logged " + fmt(now()));
}

// ---------- math ----------
function calcRow(row){
  var r = STATES[row._day][row.id] || {};
  var out = {setupMin:null, printMin:null, pph:null, pauseMin:0};
  if(r.setupStart && r.setupDone){
    out.setupMin = mins((r.setupDone - r.setupStart) - pausedMsBetween(r, r.setupStart, r.setupDone));
  }
  if(r.setupDone && r.jobDone){
    var printMs = (r.jobDone - r.setupDone) - pausedMsBetween(r, r.setupDone, r.jobDone);
    out.printMin = mins(printMs);
    if(printMs > 0) out.pph = Math.round(row.qty / (printMs/3600000));
  }
  out.pauseMin = mins(pausesOf(r).reduce(function(a,p){ return a + ((p.end||now()) - p.start); }, 0));
  return out;
}

          " · done " + (r.jobDone?fmt(r.jobDone)+mk("jobDone"):"NOT FINISHED") +

        for(var shi = 0; shi < sHand.length; shi++){

        }
        var psegs = printHandoffs(r).length ? printSegments(row2) : [];
        if(psegs.length > 1){

          for(var pi2 = 0; pi2 < psegs.length; pi2++){
            var sg = psegs[pi2];
            t += "      " + sg.printer + " " + fmt(sg.start) + "–" + (sg.open ? "still running" : fmt(sg.end)) +
              " (" + sg.min + "m" +
              (sg.pieces != null ? ", " + sg.pieces + " pcs, " + sg.pph + " pcs/hr" : ", PIECES NOT COUNTED — don't split this one") + ")\n";
          }
        }

        var pz = pausesOf(r);

        if((r.audit||[]).length){

              " -> " + (typeof a.new === "number" ? fmt(a.new) : (a.new==null?"—":a.new)) + " (changed at " + fmt(a.at) + ")\n";

  for(var di2 = 0; di2 < exportDays.length; di2++){
    var d2 = exportDays[di2];

  }

}

// ---------- clocks from the server (Ready to Print on one iPad shows on the other) ----------
function mergeLog(a, b, key){
  var m = {}, out = [];
  (a || []).concat(b || []).forEach(function(x){
    if(!x) return; var k = String(x[key]);
    if(!m[k]){ m[k] = JSON.parse(JSON.stringify(x)); out.push(m[k]); }
    else { if(x.end && (!m[k].end || x.end > m[k].end)) m[k].end = x.end; if(x.reason && !m[k].reason) m[k].reason = x.reason; }
  });
  out.sort(function(p, q){ return p[key] - q[key]; });
  return out;
}
function mergeClocks(remote){
  if(!remote) return false;
  var changed = false;
  for(var day in remote){
    if(!remote.hasOwnProperty(day) || DAYSARR.indexOf(day) === -1) continue;
    var loc = CLOCKS[day] || (CLOCKS[day] = {});
    var before = JSON.stringify(loc);
    for(var p in remote[day]){
      if(!remote[day].hasOwnProperty(p)) continue;
      var R = remote[day][p] || {}, L = loc[p];
      if(!L){ loc[p] = JSON.parse(JSON.stringify(R)); continue; }
      L["in"] = earliestTs(L["in"], R["in"]);
      if(R.out && (!L.out || R.out > L.out) && (!L._outAt || (R._outAt || 0) >= L._outAt)) L.out = R.out;
      if(R.press && (!L.press || (R.pressAt || 0) > (L.pressAt || 0))){ L.press = R.press; L.pressAt = R.pressAt || 0; }
      L.lunches = mergeLog(L.lunches, R.lunches, "start");
      L.gaps = mergeLog(L.gaps, R.gaps, "start");
    }
    if(JSON.stringify(loc) !== before){ changed = true; lsSet("mayhem_clock_" + day, JSON.stringify(loc)); }
  }
  return changed;
}

function dayOrder(day){ var o = vget("ord_" + day); return (o && o.o) || []; }

    if(ia === -1) ia = 10000 + ALLROWS.indexOf(a);

}
function isDateDay(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d); }
function pressData(P){
  var t = todayStr();

  for(var i = 0; i < ALLROWS.length; i++){
    var row = ALLROWS[i]; if(!visible(row)) continue;
    var s = st(row), a = assigned(row), sd = showDay(row);
    if(isActive(s)){ if(a === P || !a) active.push(row); continue; }
    if(s === "done"){
      var r = recRO(row.id);
      if(r && r.jobDone && todayOf(r.jobDone) === t && (r.press === P)) done.push(row);
      continue;
    }
    if(a && a !== P) continue;
    if(sd === t) today.push(row);
    else if(isDateDay(sd) && sd < t) carry.push(row);
  }
  active.sort(function(a, b){ return (recRO(b.id).setupStart || 0) - (recRO(a.id).setupStart || 0); });
  carry = sortDay("", carry).sort(function(a, b){ return a._day < b._day ? -1 : a._day > b._day ? 1 : 0; });

function tilesFor(row){
  var r = recRO(row.id) || {}, t = [], s = status(r);

        '<div class="rundd"><span class="stbadge ' + s + '" onclick="openJob(\'' + x.id + '\')">' + ({idle:"NOT STARTED", setup:"SETTING UP", print:"PRINTING", pause:"STOPPED", done:"DONE"})[s] + '</span>';
      if(EDITOR){
        h += '<div class="runed"><button onclick="nudge(\'' + x.id + '\',-1)">▲</button><button onclick="nudge(\'' + x.id + '\',1)">▼</button>' +
          '<button onclick="cyclePress(\'' + x.id + '\')">' + (vget("prs_" + x.id) ? esc(vget("prs_" + x.id).p.replace("Press ", "P")) : "ANY") + '</button>' +
          '<button onclick="moveRun(\'' + x.id + '\')">DAY</button><button onclick="openEditCard(\'' + x.id + '\')">EDIT</button></div>';
      }
      h += '</div></div>';
    });
    h += '</div>';
  });
  if(!rows.length) h += '<div class="empty"><h2>' + (searchQuery ? 'NO <span>MATCH</span>' : 'NO <span>CARDS</span>') + '</h2><p>' + (searchQuery ? 'Nothing this week matches “' + esc(searchQuery) + '”.' : 'Nothing on the board for ' + esc(dayLabel(WEEKDAY)) + '.') + '</p></div>';
  h += '<div class="wfoot"><button class="btn sm" onclick="showExport()">END OF DAY EXPORT (BACKUP)</button><button class="btn sm" onclick="changePress()">THIS iPAD: ' + esc((PRESS || "NOT SET").toUpperCase()) + '</button>' +
    (isPressIpad() && operator() ? '<button class="btn sm" onclick="openOperator()">DONE FOR TODAY…</button>' : '') + '<button class="btn sm" onclick="location.reload()">RELOAD</button></div>';
  h += '<div class="hint" style="text-align:center">Press Board v' + APP_V + ' · week of ' + esc(WEEKID) + '</div></div>';
  el.innerHTML = h;
}
function showExport(){ VIEW = "export"; render(); document.getElementById("exporttext").textContent = buildExport(); }

// ---------- EDITOR: order / press / move / edit / add / photos ----------
function nudge(id, dir){
  var row = findRow(id); if(!row) return;
  var day = WEEKDAY;
  var list = sortDay(day, rowsShownOn(day)).map(function(r){ return r.id; });
  var i = list.indexOf(id), j = i + dir;
  if(i < 0 || j < 0 || j >= list.length) return;
  list.splice(i, 1); list.splice(j, 0, id);
  vset("ord_" + day, {o:list, at:now()});
  render();
}
function cyclePress(id){
  var cur = vget("prs_" + id), nx;
  if(!cur) nx = {p:"Press 1"}; else if(cur.p === "Press 1") nx = {p:"Press 2"}; else nx = null;
  vset("prs_" + id, nx); render();
}
// day moves reuse the v3 jobday_ records; this is just the picker
var MV = {rows:[], title:""};
function openMove(ids, title){
  MV.rows = ids.map(findRow).filter(function(r){ return r && !r._virtual; });
  if(!MV.rows.length) return;
  var cur = showDay(MV.rows[0]), home = MV.rows[0]._day;
  openMd("move", '<h3>Move ' + esc(title) + '</h3><p class="s">CHANGES WHICH DAY THE CARD SHOWS UNDER. TAPS ALREADY LOGGED STAY WITH IT.</p><div class="opts">' +
    DAYSARR.map(function(d){ return '<button class="opt ' + (d === cur ? "on" : "") + '" onclick="applyMove(\'' + d + '\')">' + dayLabel(d) + (dayNum(d) ? ' ' + dayNum(d) : '') + (d === home ? '<small>board day</small>' : '') + '</button>'; }).join("") +
    '</div><div class="row2"><button onclick="closeMd()">CANCEL</button></div>');
}
function applyMove(day){
  MV.rows.forEach(function(row){ writeJobDay(row, day === row._day ? null : day); });
  try{ syncPush(); }catch(e){}
  closeMd(); toast("Moved to " + dayLabel(day) + (dayNum(day) ? " " + dayNum(day) : ""));
}
function moveJob(idsCsv, job){ var ids = String(idsCsv).split(",").filter(Boolean); openMove(ids, "job #" + job + " (" + ids.length + " run" + (ids.length === 1 ? "" : "s") + ")"); }
function moveRun(id){ var r = findRow(id); if(r) openMove([id], "#" + r.job + " " + shortLoc(r)); }
var NE = {day:null, job:null};
function editJobNotes(day, job){
  var rows = (ROWSBY[day] || []).filter(function(r){ return String(r.job) === String(job); });
  var bn = "", ba = "", i;
  for(i = 0; i < rows.length; i++) if(rows[i].note){ bn = rows[i].note; break; }
  for(i = 0; i < rows.length; i++) if(rows[i].alert){ ba = rows[i].alert; break; }
  var ov = jobNoteOverride(day, job);
  NE.day = day; NE.job = job;
  openMd("notes", '<h3>Notes — #' + esc(job) + '</h3><p class="s">SHOWS ON EVERY iPAD WITHIN A MINUTE. EMPTY = HIDE IT.</p>' +
    '<div class="fld"><label>MUST-READ (AMBER)</label><textarea id="ne_alert">' + esc((ov && ov.a !== undefined) ? ov.a : ba) + '</textarea></div>' +
    '<div class="fld"><label>JOB NOTE (GREEN)</label><textarea id="ne_note">' + esc((ov && ov.n !== undefined) ? ov.n : bn) + '</textarea></div>' +
    '<div class="row2"><button onclick="closeMd()">CANCEL</button><button onclick="writeJobNotes(NE.day,NE.job,\'\')">RESET</button><button class="y" onclick="submitJobNotes()">SAVE</button></div>');
}
function submitJobNotes(){
  var n = document.getElementById("ne_note").value.replace(/\s+$/, ""), a = document.getElementById("ne_alert").value.replace(/\s+$/, "");
  writeJobNotes(NE.day, NE.job, JSON.stringify({n:n, a:a, at:now()}));
}
function inksToText(inks){ return (inks || []).map(function(k){ return (k.n || k.name || "") + (k.hex ? " " + k.hex : ""); }).join(", "); }
function textToInks(s){
  return String(s || "").split(",").map(function(x){ x = x.trim(); if(!x) return null; var m = x.match(/#([0-9a-f]{6}|[0-9a-f]{3})\b/i); return {n: x.replace(/#([0-9a-f]{6}|[0-9a-f]{3})\b/i, "").trim(), hex: m ? m[0] : guessHex(x)}; }).filter(Boolean);
}
var INKHEX = {white:"#ffffff", black:"#111111", red:"#d62828", navy:"#1b2a4a", royal:"#1f4fbf", blue:"#1f4fbf", gold:"#f2b705", yellow:"#ffd400", orange:"#ff6a13", green:"#1f8a3b", kelly:"#1f8a3b", maroon:"#6d1a2b", purple:"#5b2a86", pink:"#f07aa8", grey:"#8a8d8f", gray:"#8a8d8f", silver:"#b8bcbf", brown:"#5a3a22", tan:"#c8a97a", cream:"#f3e9d2", olive:"#6b6b2e", teal:"#12877f", "cool gray 11":"#53565a", "cool grey 11":"#53565a"};
function guessHex(x){ x = x.toLowerCase(); var best = "#777777", bl = 0; for(var k in INKHEX) if(x.indexOf(k) > -1 && k.length > bl){ best = INKHEX[k]; bl = k.length; } return best; }
var EC = {id:null, img:null};
function openEditCard(id){
  var row = findRow(id); if(!row) return;
  var e = vget("edt_" + id) || {};
  EC.id = id; EC.img = e.img || null; EC.add = null;
  var o = row._orig || row;
  openMd("edit", '<h3>Edit card — #' + esc(row.job) + '</h3><p class="s">CHANGES GO LIVE ON EVERY iPAD WITHIN A MINUTE. BLANK = USE THE BOARD&#39;S VALUE.</p>' +
    '<div class="fld"><label>LOCATION / WHAT&#39;S PRINTING</label><textarea id="ec-loc" placeholder="' + esc(o.location || "") + '">' + esc(e.location || "") + '</textarea></div>' +
    '<div class="fgrid"><div class="fld"><label>PIECES</label><input id="ec-qty" type="number" inputmode="numeric" placeholder="' + esc(o.qty) + '" value="' + esc(e.qty || "") + '"></div>' +
    '<div class="fld"><label>SCREENS</label><input id="ec-scr" type="number" inputmode="numeric" placeholder="' + esc(o.screens) + '" value="' + esc(e.screens || "") + '"></div>' +
    '<div class="fld"><label>DUE DATE</label><input id="ec-due" type="date" value="' + esc(e.due || o.due || "") + '"></div>' +
    '<div class="fld"><label>BLANKS ARRIVED</label><input id="ec-arr" type="date" value="' + esc(e.arrived || o.arrived || "") + '"></div></div>' +
    '<div class="fld"><label>INKS — COMMA SEPARATED, HEX OPTIONAL (e.g. Cool Gray 11 #53565A, White)</label><input id="ec-inks" value="' + esc(inksToText(e.inks || o.inks)) + '"></div>' +
    '<div class="fld"><label>TAGS — COMMA SEPARATED (e.g. CUST-SUPPLIED, REPEAT, RUSH)</label><input id="ec-tags" value="' + esc((e.tags || o.tags || []).join(", ")) + '"></div>' +
    photoFieldHtml(imgOf(row)) +
    '<div class="row2"><button onclick="closeMd()">CANCEL</button><button class="r" onclick="hideCard()">' + (row.hidden ? "UNHIDE" : "HIDE CARD") + '</button><button onclick="resetCard()">RESET</button><button class="y" onclick="saveCard()">SAVE</button></div>', id);
}
function photoFieldHtml(cur){
  return '<div class="fld"><label>MOCKUP PHOTO</label><div style="display:flex;gap:12px;align-items:center">' +
    '<img id="ec-prev" src="' + esc(EC.img || cur || "") + '" style="width:96px;height:96px;object-fit:contain;background:#fff;border-radius:8px;' + ((EC.img || cur) ? '' : 'display:none') + '">' +
    '<button class="btn sm" onclick="pickPhoto()">📷 ' + ((EC.img || cur) ? "REPLACE" : "ADD") + ' PHOTO</button><span id="ec-up" class="hint"></span></div></div>';
}
function valOf(id){ var el = document.getElementById(id); return el ? el.value.trim() : ""; }
function saveCard(){
  var e = {};
  if(valOf("ec-loc")) e.location = valOf("ec-loc");
  if(valOf("ec-qty")) e.qty = Number(valOf("ec-qty"));
  if(valOf("ec-scr")) e.screens = Number(valOf("ec-scr"));
  if(valOf("ec-due")) e.due = valOf("ec-due");
  if(valOf("ec-arr")) e.arrived = valOf("ec-arr");
  if(valOf("ec-inks")) e.inks = textToInks(valOf("ec-inks"));
  if(valOf("ec-tags")) e.tags = valOf("ec-tags").split(",").map(function(x){ return x.trim().toUpperCase(); }).filter(Boolean);
  if(EC.img) e.img = EC.img;
  var old = vget("edt_" + EC.id); if(old && old.hidden) e.hidden = true;
  e.at = now();
  vset("edt_" + EC.id, e); applyEdits(); closeMd(); toast("Card updated");
}
function resetCard(){ vset("edt_" + EC.id, null); applyEdits(); closeMd(); toast("Card reset to the board"); }
function hideCard(){ var e = vget("edt_" + EC.id) || {}; e.hidden = !e.hidden; e.at = now(); vset("edt_" + EC.id, e); applyEdits(); closeMd(); toast(e.hidden ? "Card hidden" : "Card back"); }
function openAddCard(day){
  EC.id = null; EC.img = null; EC.add = day;
  openMd("add", '<h3>Add a card — ' + dayLabel(day) + ' ' + dayNum(day) + '</h3><p class="s">ONE CARD = ONE PRESS RUN (ONE SETUP). FRONT + BACK = TWO CARDS.</p>' +
    '<div class="fgrid"><div class="fld"><label>JOB #</label><input id="ac-job" inputmode="numeric"></div><div class="fld"><label>CUSTOMER</label><input id="ac-cust"></div></div>' +
    '<div class="fld"><label>LOCATION / WHAT&#39;S PRINTING</label><textarea id="ac-loc" placeholder="Full back — 2c white + red — G500 black"></textarea></div>' +
    '<div class="fgrid"><div class="fld"><label>PIECES</label><input id="ac-qty" type="number" inputmode="numeric"></div><div class="fld"><label>COLORS / SCREENS</label><input id="ac-col" type="number" inputmode="numeric" value="1"></div>' +
    '<div class="fld"><label>DUE DATE</label><input id="ac-due" type="date"></div><div class="fld"><label>PRESS</label><select id="ac-press"><option value="">Either press</option><option>Press 1</option><option>Press 2</option></select></div></div>' +
    '<div class="fld"><label>NOTE FOR THE PRINTERS</label><input id="ac-note"></div>' +
    '<div class="fld"><label>PRINTAVO LINK (OPTIONAL)</label><input id="ac-url" placeholder="https://www.printavo.com/invoices/…"></div>' +
    photoFieldHtml("") +
    '<div class="row2"><button onclick="closeMd()">CANCEL</button><button class="y" onclick="saveAddCard()">ADD CARD</button></div>');
}
function saveAddCard(){
  var job = valOf("ac-job"), loc = valOf("ac-loc");
  if(!job || !loc){ toast("Job # and location are required"); return; }
  var a = vget(addId()) || {cards:[]};
  var id = job + "-add" + String(now()).slice(-6);
  var col = Number(valOf("ac-col")) || 1;
  a.cards = (a.cards || []).concat([{id:id, day:EC.add, job:job, customer:valOf("ac-cust"), location:loc, qty:Number(valOf("ac-qty")) || 0, colors:col, screens:col, note:valOf("ac-note"), url:valOf("ac-url"), img:EC.img || ""}]);
  a.at = now();
  vset(addId(), a);
  refreshOverrides();
  if(valOf("ac-due")) vset("edt_" + id, {due:valOf("ac-due"), at:now()});
  if(valOf("ac-press")) vset("prs_" + id, {p:valOf("ac-press")});
  applyEdits(); closeMd(); toast("Card added");
}
// photos: resized on the device to 1600px/q85 and committed to the repo by the editor's own key
function openSettings(){
  var k = lsGet("mayhem_ghkey");
  openMd("settings", '<h3>Editor settings</h3><p class="s">THIS DEVICE ONLY. NEVER PUT THE KEY ANYWHERE ELSE.</p>' +
    '<div class="fld"><label>GITHUB KEY (FOR PHOTO UPLOADS)</label><input id="gh-key" type="password" placeholder="' + (k ? "saved — paste a new one to replace" : "github_pat_…") + '"></div>' +
    '<div class="hint">Photos you add from the board are saved to the site (data/uploads/) with this key, so they show on every iPad.</div>' +
    '<div class="row2"><button onclick="closeMd()">CLOSE</button>' + (k ? '<button class="r" onclick="lsSet(\'mayhem_ghkey\',null);closeMd();toast(\'Key removed\')">REMOVE KEY</button>' : '') + '<button class="y" onclick="saveGhKey()">SAVE</button></div>');
}
function saveGhKey(){ var v = valOf("gh-key"); if(v) lsSet("mayhem_ghkey", v); closeMd(); toast(v ? "Key saved on this device" : "No change"); }
function pickPhoto(){
  if(!lsGet("mayhem_ghkey")){ toast("Add your GitHub key in Editor settings first"); return; }
  var fp = document.getElementById("filepick"); fp.value = ""; fp.click();
}
document.getElementById("filepick").addEventListener("change", function(ev){
  var f = ev.target.files && ev.target.files[0]; if(!f) return;
  var up = document.getElementById("ec-up"); if(up) up.textContent = "Uploading…";
  var rd = new FileReader();
  rd.onload = function(){
    var im = new Image();
    im.onload = function(){
      var sc = Math.min(1, 1600 / Math.max(im.width, im.height));
      var cv = document.createElement("canvas"); cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
      var cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height);
      var b64 = cv.toDataURL("image/jpeg", 0.85).split(",")[1];
      var path = "data/uploads/" + WEEKID + "/" + (EC.id || "new") .replace(/[^a-z0-9\-]/gi, "") + "-" + now() + ".jpg";
      fetch("https://api.github.com/repos/mayhemink/mayhemink.github.io/contents/" + path, {
        method:"PUT", headers:{"Authorization":"Bearer " + lsGet("mayhem_ghkey"), "Accept":"application/vnd.github+json"},
        body: JSON.stringify({message:"board photo " + path, content:b64})
      }).then(function(r){ if(!r.ok) throw new Error("GitHub said " + r.status); return r.json(); })
        .then(function(){
          EC.img = "https://raw.githubusercontent.com/mayhemink/mayhemink.github.io/main/" + path;
          var pv = document.getElementById("ec-prev"); if(pv){ pv.src = cv.toDataURL("image/jpeg", 0.6); pv.style.display = "block"; }
          if(up) up.textContent = "✓ Uploaded — tap SAVE";
        })["catch"](function(e){ if(up) up.textContent = "Upload failed: " + e.message; });
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
});

// ---------- lightbox ----------
var lbW = 96, lbPinchD0 = 0, lbPinchW0 = 96, lbLastTap = 0;
function showLightbox(src){ var im = document.getElementById("lbimg"); im.src = src; lbW = 96; im.style.width = "96%"; document.getElementById("lightbox").style.display = "block"; }
function hideLightbox(){ document.getElementById("lightbox").style.display = "none"; }
(function(){
  var lb = document.getElementById("lightbox"), im = document.getElementById("lbimg");
  function d(e){ var a = e.touches[0], b = e.touches[1]; return Math.hypot(a.pageX - b.pageX, a.pageY - b.pageY); }
  lb.addEventListener("touchstart", function(e){ if(e.touches.length === 2){ lbPinchD0 = d(e); lbPinchW0 = lbW; } }, {passive:true});
  lb.addEventListener("touchmove", function(e){ if(e.touches.length === 2 && lbPinchD0 > 0){ e.preventDefault(); lbW = Math.min(500, Math.max(60, lbPinchW0 * d(e) / lbPinchD0)); im.style.width = lbW + "%"; } }, {passive:false});
  lb.addEventListener("touchend", function(e){ if(e.touches.length < 2) lbPinchD0 = 0; }, {passive:true});
  im.addEventListener("click", function(){ var n = Date.now(); if(n - lbLastTap < 350){ lbW = (lbW <= 100) ? 250 : 96; im.style.width = lbW + "%"; } lbLastTap = n; });
})();

// ---------- tickers ----------
function tick(){
  var c = document.getElementById("clk"); if(c) c.textContent = fmt(now()).replace(/ (AM|PM)/, "");
  var row = currentRow && !currentRow._virtual ? currentRow : null;
  if(row){
    var t = hm(phaseMs(row));
    var a = document.getElementById("livetm"); if(a) a.textContent = t;
    var b = document.querySelectorAll(".big .lt"); for(var i = 0; i < b.length; i++) b[i].textContent = t;
  }
  var lt = document.getElementById("lunchtm");
  if(lt){ var L = lunchState(); if(L && L.open){ var l = L.k.lunches[L.k.lunches.length - 1]; lt.textContent = hm(now() - l.start); } }
}
setInterval(tick, 5000);
var _lastMin = -1;
setInterval(function(){
  var m = new Date().getMinutes();
  if(m !== _lastMin){ _lastMin = m; var ae = document.activeElement; if(!busy() && WEEKID && !(ae && ae.tagName === "INPUT")) render(); }   // banners (lunch at 11), day rollover, float lanes
}, 20000);

var editingField = null, emailing = false;
function rowsShownOn(day){ var out = []; for(var i = 0; i < ALLROWS.length; i++) if(showDay(ALLROWS[i]) === day) out.push(ALLROWS[i]); return out; }
if(SYNC_ON && typeof fetch === "function"){
  setTimeout(function(){ try{ syncTick(); syncPresence(); }catch(e){} }, 2500);
  setInterval(function(){ try{ syncTick(); }catch(e){} }, 15000);
  setInterval(function(){ try{ syncPresence(); }catch(e){} }, 45000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden){ try{ syncTick(); syncPresence(); }catch(e){} } });
  window.addEventListener("focus", function(){ try{ syncTick(); }catch(e){} });
}

render();
loadWeek();
