<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Mayhem Ink — Crew Hub (WEEK)</title>
<style>
  :root{
    --ink:#111111; --red:#469BEB; --bg:#f4f4f5; --card:#ffffff;
    --green:#1a9c4b; --amber:#e08a00; --blue:#2264c7; --gray:#8a8a8e;
    --line:#e3e3e6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-user-select:none; user-select:none;
  }
  header{
    background:var(--ink); color:#fff; padding:8px 18px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:10;
  }
  header .brand{font-weight:800; font-size:20px; letter-spacing:.5px;}
  header .brand span{color:var(--red);}
  header .date{font-size:14px; color:#bbb; font-weight:600;}
  .wrap{max-width:820px; margin:0 auto; padding:16px 14px 90px;}

  /* ---- day tabs (v3) ---- */
  .daytabs{display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .daytab{
    flex:1; min-width:88px; background:var(--card); border-radius:12px; padding:8px 4px;
    text-align:center; cursor:pointer; border:2px solid transparent;
    box-shadow:0 1px 3px rgba(0,0,0,.07);
  }
  .daytab b{display:block; font-size:15px;}
  .daytab small{font-size:11px; color:var(--gray); font-weight:700;}
  .daytab.on{border-color:var(--ink);}
  .daytab.istoday b{color:var(--red);}
  .daytab.alldone{opacity:.55;}

  /* ---- search (v3) ---- */
  .searchrow{margin-bottom:12px;}
  .searchrow input{
    width:100%; padding:13px 16px; border:2px solid var(--line); border-radius:12px;
    font-size:16px; font-weight:600; background:var(--card);
    -webkit-user-select:text; user-select:text;
  }
  .dayhint{font-size:12px; font-weight:800; color:var(--red); letter-spacing:.5px; text-transform:uppercase; margin:2px 4px 6px;}

  /* ---- crew clock (v3) ---- */
  .clockcard{background:var(--card); border-radius:14px; padding:12px 14px; box-shadow:0 1px 3px rgba(0,0,0,.07); margin-bottom:12px;}
  .clockcard h3{font-size:12px; color:var(--gray); font-weight:800; letter-spacing:.5px; text-transform:uppercase; margin-bottom:8px;}
  .clockrow{display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--line);}
  .clockrow:first-of-type{border-top:none;}
  .clockrow .cname{font-size:15px; font-weight:800; flex:0 0 74px;}
  .clockrow .ctimes{flex:1; font-size:12px; color:var(--gray); font-weight:600; line-height:1.4;}
  .cbtn{
    padding:9px 12px; border:none; border-radius:9px; font-size:13px; font-weight:800;
    cursor:pointer; background:#ececee; color:var(--gray); white-space:nowrap;
  }
  .cbtn.go{background:var(--green); color:#fff;}
  .cbtn.lunch{background:#fdf0dd; color:var(--amber);}
  .cbtn.out{background:var(--ink); color:#fff;}

  /* ---- between-jobs strip + run estimate (v3.1) ---- */
  .gaprow{background:#f7f7f8; border-radius:10px; padding:10px 12px; margin:6px 0 2px;}
  .gaphead{font-size:13px; font-weight:700; color:var(--ink);}
  .gaphead b{font-weight:800;}
  .gapreason{color:var(--gray); font-weight:600;}
  .gapask{font-size:12px; color:var(--gray); font-weight:600; margin:6px 0 8px; line-height:1.45;}
  .gapchips{display:flex; flex-wrap:wrap; gap:6px;}
  .gapchip{background:#fff; border:2px solid var(--line); border-radius:999px; padding:8px 12px;
           font-size:13px; font-weight:700; cursor:pointer;}
  .gapchip:active{background:var(--ink); color:#fff;}
  .est{color:var(--gray); font-weight:700;}
  .esthead{margin-top:10px; padding-top:10px; border-top:1px solid var(--line);
           font-size:13px; font-weight:600; color:var(--gray); line-height:1.5;}
  .esthead b{color:var(--ink); font-weight:800;}
  .esthead small{display:block; font-size:11px; color:var(--gray); margin-top:3px; font-weight:600;}

  /* ---- summary strip ---- */
  .strip{
    display:flex; gap:10px; margin-bottom:16px;
  }
  .strip .pill{
    flex:1; background:var(--card); border-radius:12px; padding:10px 6px;
    text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.07);
  }
  .strip .pill b{display:block; font-size:22px;}
  .strip .pill small{color:var(--gray); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;}

  /* ---- job cards ---- */
  .jobgroup{margin-bottom:14px;}
  .jobgroup h2{
    font-size:13px; color:var(--gray); font-weight:800; letter-spacing:.5px;
    margin:4px 4px 8px; text-transform:uppercase;
  }
  .card{
    background:var(--card); border-radius:14px; padding:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.07); margin-bottom:10px;
    display:flex; align-items:center; gap:14px; cursor:pointer;
    border-left:6px solid var(--line);
  }
  .card.st-setup{border-left-color:var(--amber);}
  .card.st-print{border-left-color:var(--blue);}
  .card.st-pause{border-left-color:var(--red);}
  .card.st-done{border-left-color:var(--green); opacity:.75;}
  .card .loc{flex:1;}
  .card .loc .l1{font-size:18px; font-weight:800;}
  .card .loc .l2{font-size:13px; color:var(--gray); margin-top:3px; font-weight:600;}
  .card .stat{text-align:right;}
  .badge{
    display:inline-block; font-size:12px; font-weight:800; letter-spacing:.4px;
    padding:5px 11px; border-radius:999px; text-transform:uppercase;
    background:#ececee; color:var(--gray);
  }
  .badge.setup{background:#fdf0dd; color:var(--amber);}
  .badge.print{background:#e2ecfb; color:var(--blue);}
  .badge.pause{background:#e2f0fc; color:var(--red);}
  .badge.done{background:#e0f3e7; color:var(--green);}
  .card .who{font-size:12px; color:var(--gray); margin-top:5px; font-weight:600;}

  /* ---- detail view ---- */
  #detail{display:none;}
  .back{
    display:inline-flex; align-items:center; gap:6px;
    font-size:16px; font-weight:700; color:var(--red);
    background:none; border:none; padding:10px 4px; cursor:pointer;
  }
  .dhead{background:var(--card); border-radius:14px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.07); margin-bottom:14px;}
  .dhead .jn{font-size:14px; font-weight:800; color:var(--red); letter-spacing:.5px;}
  .dhead .cu{font-size:24px; font-weight:800; margin:2px 0 6px;}
  .dhead .meta{font-size:14px; color:var(--gray); font-weight:600;}

  .field{background:var(--card); border-radius:14px; padding:14px 16px; box-shadow:0 1px 3px rgba(0,0,0,.07); margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:800; color:var(--gray); text-transform:uppercase; letter-spacing:.5px; margin-bottom:9px;}
  .segs{display:flex; gap:8px; flex-wrap:wrap;}
  .seg{
    flex:1; min-width:70px; padding:13px 8px; border-radius:10px; border:2px solid var(--line);
    background:#fafafa; font-size:16px; font-weight:700; text-align:center; cursor:pointer;
  }
  .seg.on{background:var(--ink); color:#fff; border-color:var(--ink);}

  .steps{margin-bottom:12px;}
  .step{
    background:var(--card); border-radius:14px; box-shadow:0 1px 3px rgba(0,0,0,.07);
    margin-bottom:10px; padding:16px; display:flex; align-items:center; gap:14px;
  }
  .step .num{
    width:34px; height:34px; border-radius:50%; background:#ececee; color:var(--gray);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex-shrink:0;
  }
  .step.done .num{background:var(--green); color:#fff;}
  .step .info{flex:1;}
  .step .info b{font-size:17px; display:block;}
  .step .info small{color:var(--gray); font-size:12px; font-weight:600;}
  .step .time{font-size:18px; font-weight:800; min-width:86px; text-align:right;}
  .step .time input{
    font-size:16px; font-weight:700; width:110px; padding:6px; border:2px solid var(--line); border-radius:8px;
  }
  .bigbtn{
    width:100%; padding:20px; border:none; border-radius:14px;
    font-size:20px; font-weight:800; color:#fff; cursor:pointer;
    letter-spacing:.3px; box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .bigbtn:active{transform:scale(.985);}
  .bigbtn.b-setup{background:var(--amber);}
  .bigbtn.b-print{background:var(--blue);}
  .bigbtn.b-done{background:var(--green);}
  .bigbtn.b-resume{background:var(--green);}
  .bigbtn:disabled{background:#c9c9cd; box-shadow:none;}
  .btnrow{display:flex; gap:10px; margin-bottom:12px;}
  .btnrow .bigbtn{flex:1;}
  .pausebtn{
    flex:0 0 130px; padding:20px 10px; border:2px solid var(--red); background:#fff; color:var(--red);
    border-radius:14px; font-size:16px; font-weight:800; cursor:pointer;
  }
  .donebanner{
    background:var(--green); color:#fff; border-radius:14px; padding:18px; text-align:center;
    font-size:18px; font-weight:800; margin-bottom:12px;
  }
  .donebanner small{display:block; font-weight:600; font-size:14px; opacity:.9; margin-top:4px;}
  textarea{
    width:100%; border:2px solid var(--line); border-radius:10px; padding:12px;
    font-size:16px; font-family:inherit; min-height:64px; resize:vertical;
    -webkit-user-select:text; user-select:text;
  }
  .pauselog{font-size:13px; color:var(--gray); font-weight:600; margin-top:8px; line-height:1.6;}
  .pauselog b{color:var(--red);}

  /* ---- end of day ---- */
  .eod{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); padding:12px 14px;
    display:flex; gap:10px; z-index:10;
  }
  .eod button{
    flex:1; padding:15px; border:none; border-radius:12px; font-size:16px; font-weight:800; cursor:pointer;
  }
  .eod .export{background:var(--ink); color:#fff;}
  .eod .export.nag{background:#c0392b; color:#fff;}
  #exportview{display:none;}
  #exportview pre{
    background:var(--card); border-radius:14px; padding:16px; font-size:13px;
    white-space:pre-wrap; word-break:break-word; box-shadow:0 1px 3px rgba(0,0,0,.07);
    -webkit-user-select:text; user-select:text; line-height:1.5;
  }
  .copybtn{
    width:100%; padding:18px; border:none; border-radius:14px; background:var(--red); color:#fff;
    font-size:18px; font-weight:800; cursor:pointer; margin-bottom:12px;
  }
  .toast{
    position:fixed; top:70px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 22px; border-radius:999px;
    font-weight:700; font-size:15px; z-index:99; display:none;
  }

  /* ---- crew hub additions ---- */
  .flagbar{display:flex; gap:0; margin-bottom:10px; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.07);}
  .flagbar .tag{background:var(--red); color:#fff; font-weight:800; font-size:11px; letter-spacing:.5px; padding:12px 10px; display:flex; align-items:center; flex:0 0 108px; justify-content:center; text-transform:uppercase;}
  .flagbar .txt{background:#eaf4fd; color:var(--ink); font-size:13px; font-weight:600; padding:10px 12px; flex:1; line-height:1.45;}
  .flagbar.warn .tag{background:#c0392b;}
  .flagbar.warn .txt{background:#fdeaea;}
  .jobhead{background:var(--card); border-radius:14px 14px 0 0; padding:14px 16px 10px; box-shadow:0 1px 3px rgba(0,0,0,.07); margin-bottom:2px;}
  .jobhead .jrow{display:flex; align-items:baseline; gap:10px;}
  .jobhead .jnum{font-size:19px; font-weight:800;}
  .jobhead .jnum span{color:var(--red);}
  .jobhead .jcust{font-size:14px; color:var(--gray); font-weight:700; flex:1;}
  .jobhead .jscreens{font-size:13px; font-weight:800; color:var(--red); white-space:nowrap;}
  .jobnote{background:#2ee84e; color:#093313; font-weight:800; font-size:14px; letter-spacing:.3px; padding:8px 12px; border-radius:8px; margin-top:8px; text-transform:uppercase;}
  .mockstrip{display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:10px 0 4px;}
  .mockstrip img{height:92px; border-radius:8px; background:#fff; border:1px solid var(--line); flex-shrink:0;}
  .dmock{text-align:center; margin-bottom:12px;}
  .dmock img{max-width:100%; max-height:230px; border-radius:12px; border:1px solid var(--line); background:#fff;}

  /* ---- mockup lightbox ---- */
  .jlink{color:inherit;text-decoration:underline dotted;}
  .mockstrip img, .dmock img{cursor:pointer;}
  #lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:9999;overflow:auto;-webkit-overflow-scrolling:touch;}
  #lbimg{display:block;margin:40px auto;width:96%;max-width:none;}
  #lbclose{position:fixed;top:10px;right:14px;z-index:10000;font-size:34px;color:#fff;background:rgba(0,0,0,.5);border:none;border-radius:8px;padding:2px 14px;}
  #lbhint{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#bbb;font-size:13px;z-index:10000;pointer-events:none;}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:12px"><img id="crewlogo" style="height:60px;display:none;border-radius:8px" alt=""><div class="brand">MAYHEM <span>INK</span> <span style="color:#bbb;font-size:13px;font-weight:700;letter-spacing:1px">SKELETON CREW</span></div></div>
  <div class="date" id="hdrdate"></div>
</header>

<div class="wrap">

  <!-- LIST VIEW -->
  <div id="list">
    <div class="daytabs" id="daytabs"></div>
    <div class="searchrow"><input id="q" placeholder="Find a job — # / customer / location" oninput="setSearch(this.value)"></div>
    <div id="nag"></div>
    <div id="clock"></div>
    <div class="strip">
      <div class="pill"><b id="s-total">0</b><small>Cards</small></div>
      <div class="pill"><b id="s-active">0</b><small>Running</small></div>
      <div class="pill"><b id="s-done">0</b><small>Done</small></div>
      <div class="pill"><b id="s-pieces">0</b><small>Pieces</small></div>
    </div>
    <div id="flags"></div>
    <div id="groups"></div>
  </div>

  <!-- DETAIL VIEW -->
  <div id="detail"></div>

  <!-- EXPORT VIEW -->
  <div id="exportview">
    <button class="back" onclick="showList()">&#8592; Back to jobs</button>
    <button class="copybtn" onclick="copyExport()">Copy — send to Kolton</button>
    <pre id="exporttext"></pre>
  </div>

</div>

<div class="eod" id="eodbar">
  <button class="export" id="eodbtn" onclick="showExport()">End of Day — Export Week-to-Date</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================== CREW HUB v3 — WEEKLY BOARD ==============================
// The app never changes week to week. The week's cards live in ONE json file (DATA_URL) —
// pushing a new week = replacing that file. A bad data push can't brick this app; worst
// case the NO DATA bar shows. (Managed by the mayhem-timecards skill.)
// v3 adds: Mon–Fri day tabs, week-wide job search, per-printer floor clock (start/lunch/
// end day), a press picker on each card, week-to-date export, and an unexported-times nag.
var DATA_URL = "data/week.json"; // ROOT app (cutover 2026-08-16). Old test page /v3/ now redirects here.

var WEEKID = "", PRINTERS = [], COUNTS = [1,2,3,4,5,6], DAYSARR = [], IMG = {};
var ALLROWS = [];            // every row across the week, each with ._day attached
var FLAGSBY = {};            // day -> flags
var ROWSBY = {};             // day -> rows
var STATES = {};             // day -> { rowId: rec }  (persisted per-day, same keys as v2)
var CLOCKS = {};             // day -> { printer: {in, out, lunches:[{start,end}]} }
var curDay = "";             // selected day tab
var searchQuery = "";
var currentRow = null;
var ticker = null;
var PRESSES = ["Press 1","Press 2"];
// Shop averages from the Press Stats sheet, shipped in week.json so the estimate
// recalculates when a printer corrects colors/screens on the card. Fallback only.
var STATS = {pph:{1:118,2:70,3:59,4:52,5:42,6:32}, setup:{1:4.2,2:4.9,3:6.2,4:8.5,5:7.0,6:5.7}};

// ---------- run-time estimate (v3.1) ----------
// This is INFORMATION, not a target: what a run like this usually takes, so a printer can
// tell a quick job from an all-afternoon one. Never scored, never colored red. Rows built
// with "noest":true (puff, heavy ink changes, color counts with no logged runs) show
// nothing — a visibly wrong estimate teaches the crew to ignore all of them.
function estFor(row, r){
  if(row.noest) return null;
  var c = (r && r.colors != null) ? r.colors : row.colors;
  var s = (r && r.screens != null) ? r.screens : row.screens;
  var pph = STATS.pph[c], sm = STATS.setup[c];
  if(!pph || !sm || !row.qty) return null;
  return {setup: Math.round(s*sm), print: Math.round(row.qty/pph*60)};
}
function fmtDur(m){
  if(m == null) return "";
  if(m < 60) return m + "m";
  var h = Math.floor(m/60), mm = m%60;
  return h + "h" + (mm ? " " + mm + "m" : "");
}

function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function boot(data){
  WEEKID = data.week;
  PRINTERS = data.printers || PRINTERS;
  COUNTS = data.counts || COUNTS;
  IMG = data.img || {};
  if(data.stats && data.stats.pph && data.stats.setup) STATS = data.stats;
  DAYSARR = []; ALLROWS = []; ROWSBY = {}; FLAGSBY = {}; STATES = {}; CLOCKS = {};
  var days = data.days || [];
  for(var i = 0; i < days.length; i++){
    var d = days[i];
    DAYSARR.push(d.day);
    ROWSBY[d.day] = d.rows || [];
    FLAGSBY[d.day] = d.flags || [];
    for(var j = 0; j < ROWSBY[d.day].length; j++){
      ROWSBY[d.day][j]._day = d.day;
      ALLROWS.push(ROWSBY[d.day][j]);
    }
    STATES[d.day] = loadState(d.day);
    CLOCKS[d.day] = loadClock(d.day);
  }
  currentRow = null;
  searchQuery = "";
  var t = todayStr();
  curDay = DAYSARR.indexOf(t) > -1 ? t : (DAYSARR.length ? DAYSARR[0] : "");
  var lg = document.getElementById("crewlogo");
  if(IMG.logo){ lg.src = IMG.logo; lg.style.display = "block"; } else { lg.style.display = "none"; }
  updateHdr();
  showList();
}
function updateHdr(){
  var el = document.getElementById("hdrdate");
  if(curDay) el.textContent = new Date(curDay + "T12:00:00").toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"});
  else el.textContent = "";
}
function loadWeek(){
  fetch(DATA_URL + "?v=" + Date.now(), {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(boot)
    .catch(function(e){
      document.getElementById("groups").innerHTML =
        '<div class="flagbar"><div class="tag">NO DATA</div><div class="txt">Couldn&#39;t load this week&#39;s cards (' + esc(e.message) + '). Check wifi and reload — if it keeps happening, tell Kolton.</div></div>';
    });
}
// Wake-up: pull fresh data; if it's a new week, reboot. If it's a new day inside the same
// week, flip the tab to today (only when nobody is inside a card).
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState !== "visible") return;
  if(currentRow) return;
  fetch(DATA_URL + "?v=" + Date.now(), {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if(!d) return;
      if(d.week !== WEEKID){ boot(d); return; }
      var t = todayStr();
      if(curDay !== t && DAYSARR.indexOf(t) > -1 && !searchQuery){ curDay = t; updateHdr(); showList(); }
      else if(document.getElementById("list").style.display !== "none"){ renderList(); }
    })
    .catch(function(){});
});

// ---------- persistence (same per-day keys as v2, so nothing already logged is lost) ----------
function loadState(day){
  try{ return JSON.parse(localStorage.getItem("mayhem_timing_" + day)) || {}; }catch(e){ return {}; }
}
function saveStateFor(day){
  try{ localStorage.setItem("mayhem_timing_" + day, JSON.stringify(STATES[day])); }catch(e){}
}
function loadClock(day){
  try{ return JSON.parse(localStorage.getItem("mayhem_clock_" + day)) || {}; }catch(e){ return {}; }
}
function saveClock(day){
  try{ localStorage.setItem("mayhem_clock_" + day, JSON.stringify(CLOCKS[day])); }catch(e){}
}
function findRow(id){
  for(var i = 0; i < ALLROWS.length; i++) if(ALLROWS[i].id === id) return ALLROWS[i];
  return null;
}
function stateFor(row){ return STATES[row._day] || (STATES[row._day] = {}); }
function save(){
  if(currentRow) saveStateFor(currentRow._day);
}
function rec(id){
  var row = findRow(id);
  var st = stateFor(row);
  if(!st[id]) st[id] = {printer:null, press:null, setupBy:null, printBy:null, colors:row.colors, screens:row.screens, setupStart:null, setupDone:null, jobDone:null, emailedAt:null, emailConfirmed:false, pauses:[], handoffs:[], notes:""};
  if(!st[id].pauses) st[id].pauses = [];
  if(!st[id].handoffs) st[id].handoffs = [];
  if(st[id].colors == null) st[id].colors = row.colors;
  if(st[id].screens == null) st[id].screens = row.screens;
  return st[id];
}

// ---------- time helpers ----------
function now(){ return Date.now(); }
function fmt(ts){
  if(!ts) return "";
  var d = new Date(ts);
  var h = d.getHours(), m = d.getMinutes();
  var ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return h + ":" + String(m).padStart(2,"0") + " " + ap;
}
function toHM(ts){
  var d = new Date(ts);
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function fromHM(hm, refTs){
  var d = new Date(refTs || now());
  var p = hm.split(":");
  d.setHours(Number(p[0]), Number(p[1]), 0, 0);
  return d.getTime();
}
function mins(ms){ return Math.round(ms/60000); }
function isPaused(r){ var p = r.pauses[r.pauses.length-1]; return p && !p.end; }
function pausedMsBetween(r, a, b){
  var t = 0;
  for(var i = 0; i < r.pauses.length; i++){
    var p = r.pauses[i];
    var s = Math.max(p.start, a), e = Math.min(p.end || now(), b);
    if(e > s) t += e - s;
  }
  return t;
}
// ---------- handoffs (v3) ----------
// A run can change hands mid-job. Each handoff stamps the time, who took over, and the
// CUMULATIVE piece count at that moment — that's what lets each printer get an honest
// pcs/hr instead of one guy eating the whole run. Skipping the count is allowed; the run
// still totals correctly, it just can't be split per printer.
function printHandoffs(r){
  return (r.handoffs || []).filter(function(h){ return h.phase === "print"; });
}
function setupHandoffs(r){
  return (r.handoffs || []).filter(function(h){ return h.phase === "setup"; });
}
function priorCum(r){
  var hs = printHandoffs(r);
  for(var i = hs.length-1; i >= 0; i--){ if(hs[i].pieces != null) return hs[i].pieces; }
  return 0;
}
function crewStr(r){
  if(!r) return "?";
  var names = [];
  if(r.printBy) names.push(r.printBy);
  else if(r.printer) names.push(r.printer);
  var hs = printHandoffs(r);
  for(var i = 0; i < hs.length; i++){ if(names.indexOf(hs[i].to) === -1 || names[names.length-1] !== hs[i].to) names.push(hs[i].to); }
  return names.length ? names.join(" → ") : (r.printer || "?");
}
// Split the print phase into per-printer segments, pauses removed from each.
function printSegments(row){
  var r = STATES[row._day][row.id] || {};
  if(!r.setupDone) return [];
  var hs = printHandoffs(r);
  var endTs = r.jobDone || now();
  var pts = [];
  var who = r.printBy || r.printer || "?";
  var t0 = r.setupDone, cum0 = 0;
  for(var i = 0; i < hs.length; i++){
    pts.push({printer: who, start: t0, end: hs[i].at, cumFrom: cum0, cumTo: hs[i].pieces});
    who = hs[i].to; t0 = hs[i].at; cum0 = hs[i].pieces;
  }
  pts.push({printer: who, start: t0, end: endTs, cumFrom: cum0, cumTo: r.jobDone ? row.qty : null});
  var out = [];
  for(var j = 0; j < pts.length; j++){
    var p = pts[j];
    var ms = (p.end - p.start) - pausedMsBetween(r, p.start, p.end);
    var pieces = (p.cumTo != null && p.cumFrom != null) ? (p.cumTo - p.cumFrom) : null;
    out.push({
      printer: p.printer, start: p.start, end: p.end, min: mins(ms), pieces: pieces,
      pph: (pieces != null && ms > 0) ? Math.round(pieces / (ms/3600000)) : null,
      open: !r.jobDone && j === pts.length - 1
    });
  }
  return out;
}

function status(r){
  if(!r) return "idle";
  if(r.jobDone) return "done";
  if(isPaused(r)) return "pause";
  if(r.setupDone) return "print";
  if(r.setupStart) return "setup";
  return "idle";
}

// ---------- CREW CLOCK (v3) ----------
// One tap per event: IN when you hit the floor, LUNCH out/in, OUT when you leave.
// This is the denominator for utilization — press time ÷ floor time.
function clockFor(day, p){
  var c = CLOCKS[day] || (CLOCKS[day] = {});
  if(!c[p]) c[p] = {in:null, out:null, lunches:[], gaps:[]};
  if(!c[p].lunches) c[p].lunches = [];
  if(!c[p].gaps) c[p].gaps = [];
  return c[p];
}
function lunchOpen(k){ var l = k.lunches[k.lunches.length-1]; return l && !l.end; }

// ---------- between-jobs time (v3.1) ----------
// The clock starts when a job is finished and stops when the next setup starts. Teardown,
// reclaiming, staging and a breather are all real work-day time — the point isn't to
// eliminate the gap, it's to know WHY it happened. A 40-minute wait on screens is a process
// problem; a 40-minute gap with no reason is worth a conversation. Lunch is subtracted, not
// counted. Nothing here is scored on the iPad.
var GAP_REASONS = ["Teardown","Reclaiming screens","Staging next job","Waiting on screens","Waiting on art/approval","Cleanup","Break","Other"];
var GAP_ASK_MIN = 15;   // under this it's just teardown; don't nag
function gapOpen(k){ var g = k.gaps[k.gaps.length-1]; return g && !g.end; }
function lunchMsBetween(k, a, b){
  var t = 0;
  for(var i = 0; i < k.lunches.length; i++){
    var l = k.lunches[i];
    var s = Math.max(l.start, a), e = Math.min(l.end || now(), b);
    if(e > s) t += e - s;
  }
  return t;
}
function gapMins(k, g){
  var end = g.end || now();
  return mins((end - g.start) - lunchMsBetween(k, g.start, end));
}
function startGap(printer, day){
  if(!printer) return;
  var k = clockFor(day, printer);
  if(gapOpen(k)) return;
  k.gaps.push({start: now(), end: null, reason: null});
  saveClock(day);
}
function endGap(printer, day){
  if(!printer) return;
  var k = clockFor(day, printer);
  var g = k.gaps[k.gaps.length-1];
  if(g && !g.end){ g.end = now(); saveClock(day); }
}
function setGapReason(p, reason){
  var k = clockFor(curDay, p);
  var g = k.gaps[k.gaps.length-1];
  if(g) g.reason = reason;
  saveClock(curDay); renderClock();
  toast("Logged: " + reason);
}
function renderClock(){
  if(searchQuery || curDay !== todayStr()){ document.getElementById("clock").innerHTML = ""; return; }
  var html = '<div class="clockcard"><h3>Crew clock — tap IN when you hit the floor</h3>';
  for(var i = 0; i < PRINTERS.length; i++){
    var p = PRINTERS[i];
    var k = clockFor(curDay, p);
    var bits = [];
    if(k.in) bits.push("In " + fmt(k.in));
    for(var j = 0; j < k.lunches.length; j++){
      var l = k.lunches[j];
      bits.push("Lunch " + fmt(l.start) + (l.end ? "–" + fmt(l.end) : "–…"));
    }
    if(k.out) bits.push("Out " + fmt(k.out));
    var btns = "";
    if(!k.in){
      btns = '<button class="cbtn go" onclick="clockIn(\'' + p + '\')">IN</button>';
    } else if(!k.out){
      btns = '<button class="cbtn lunch" onclick="clockLunch(\'' + p + '\')">' + (lunchOpen(k) ? "BACK" : "LUNCH") + '</button>' +
             '<button class="cbtn out" onclick="clockOut(\'' + p + '\')">OUT</button>';
    } else {
      btns = '<button class="cbtn" onclick="clockUndoOut(\'' + p + '\')">BACK IN</button>';
    }
    html += '<div class="clockrow"><div class="cname">' + esc(p) + '</div><div class="ctimes">' +
      (bits.length ? bits.join(" · ") : "Not clocked in") + '</div>' + btns + '</div>';
    // between-jobs strip — only while a gap is actually open
    if(k.in && !k.out && gapOpen(k) && !lunchOpen(k)){
      var g = k.gaps[k.gaps.length-1];
      var gm = gapMins(k, g);
      html += '<div class="gaprow"><div class="gaphead"><b>Between jobs — ' + gm + ' min</b>' +
        (g.reason ? ' <span class="gapreason">' + esc(g.reason) + '</span>' : '') + '</div>';
      if(gm >= GAP_ASK_MIN && !g.reason){
        html += '<div class="gapask">What&#39;s going on? One tap — it&#39;s how we spot what actually slows the floor down.</div><div class="gapchips">' +
          GAP_REASONS.map(function(x){ return '<span class="gapchip" onclick="setGapReason(\'' + p + '\',\'' + x + '\')">' + x + '</span>'; }).join("") +
          '</div>';
      }
      html += '</div>';
    }
  }
  html += '</div>';
  document.getElementById("clock").innerHTML = html;
}
function clockIn(p){
  var k = clockFor(curDay, p);
  if(!k.in) k.in = now();
  saveClock(curDay); renderClock();
  toast(p + " on the floor " + fmt(now()));
}
function clockLunch(p){
  var k = clockFor(curDay, p);
  if(lunchOpen(k)){ k.lunches[k.lunches.length-1].end = now(); toast(p + " back from lunch"); }
  else { k.lunches.push({start: now(), end: null}); toast(p + " at lunch"); }
  saveClock(curDay); renderClock();
}
function clockOut(p){
  var k = clockFor(curDay, p);
  if(lunchOpen(k)) k.lunches[k.lunches.length-1].end = now();
  if(gapOpen(k)) k.gaps[k.gaps.length-1].end = now();   // don't let a gap run overnight
  k.out = now();
  saveClock(curDay); renderClock();
  toast(p + " off the floor " + fmt(now()));
}
function clockUndoOut(p){
  var k = clockFor(curDay, p);
  k.out = null;
  saveClock(curDay); renderClock();
  toast(p + " back on the floor");
}

// ---------- EXPORT NAG (v3) ----------
function dayHasTaps(day){
  var st = STATES[day] || {};
  for(var id in st){ if(st[id].setupStart) return true; }
  var c = CLOCKS[day] || {};
  for(var p in c){ if(c[p].in) return true; }
  return false;
}
function lastExportTs(){
  try{ return Number(localStorage.getItem("mayhem_lastexport")) || 0; }catch(e){ return 0; }
}
function markExported(){
  try{ localStorage.setItem("mayhem_lastexport", String(now())); }catch(e){}
}
function nagDue(){
  var t = todayStr();
  if(DAYSARR.indexOf(t) === -1) return false;
  if(!dayHasTaps(t)) return false;
  var d = new Date();
  if(d.getHours() < 15 || (d.getHours() === 15 && d.getMinutes() < 30)) return false;
  var cutoff = new Date(); cutoff.setHours(15, 0, 0, 0);
  return lastExportTs() < cutoff.getTime();
}
function renderNag(){
  var el = document.getElementById("nag");
  var btn = document.getElementById("eodbtn");
  if(nagDue()){
    el.innerHTML = '<div class="flagbar warn"><div class="tag">EXPORT!</div><div class="txt">Today&#39;s times haven&#39;t been sent yet — tap <b>End of Day</b> below and copy them to Kolton before you leave.</div></div>';
    if(btn) btn.className = "export nag";
  } else {
    el.innerHTML = "";
    if(btn) btn.className = "export";
  }
}

  }

  // handoff log

      html += '<div style="margin-top:10px;font-size:13px;font-weight:700;color:var(--gray)">';

          (s.open ? ' <span style="color:var(--blue)">(running)</span>' : '') + '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }

  // stops (pause log) — editable
  if(r.setupStart && !pausePicking){
    html += '<div class="field"><label>Stops</label>';
    r.pauses.forEach(function(p, i){
      if(editingPause === i){

        html += '<div class="pauselog" onclick="editPause(' + i + ')" style="cursor:pointer;padding:7px 0;border-bottom:1px solid var(--line)">' +
          '<b>' + fmt(p.start) + (p.end ? ' – ' + fmt(p.end) + '</b> (' + mins(p.end - p.start) + ' min)' : ' – now</b>') +
          (p.reason ? ' · ' + esc(p.reason) : '') +
          ((p.added || p.edited) ? ' <span style="color:var(--amber);font-weight:800">&#9998; edited</span>' : '') +
          ' <span style="color:var(--gray);font-size:11px">&nbsp;tap to fix</span></div>';
      }
    });
    if(editingPause === NEW_PAUSE) html += pauseEditor();
    if(editingPause === null){
      html += '<button onclick="addPause()" style="margin-top:10px;padding:11px 16px;border:2px dashed var(--line);background:none;border-radius:10px;font-weight:700;color:var(--gray);cursor:pointer;font-size:14px">+ Add a stop we forgot to log</button>';
    }
    html += '</div>';

  // notes

    '<textarea placeholder="Anything weird about this run..." onblur="setNotes(this.value)">' + esc(r.notes||"") + '</textarea></div>';

  html += '<button class="bigbtn" style="background:var(--ink);margin-bottom:10px" onclick="saveAndFinish()">&#10003; SAVE &amp; FINISH</button>';

  document.getElementById("detail").innerHTML = html;
  updateLive();
}

// ---------- JOB DONE -> office email (added 2026-08-26) ----------
// The office lost its "paper work order turned in" signal when the board went
// digital. A printer taps EMAIL THE OFFICE on a finished card and a Google
// Apps Script running under info@mayhemink.net sends the mail — no mail app
// needed on the iPad. The send is stamped on the card so the office can see
// which finished jobs actually went out.
var MAILER_URL = "https://script.google.com/macros/s/AKfycbxvp-HJ8o9wgaclA0o-ug_P7KhHefiPvdUfmkYbNCNQAJUEAQk-94bf43QssAnvElcQ/exec";
var MAILER_KEY = "CXjqc070PNwyzPFP6dkd-9L5";
var emailing = false;

function emailBtnHtml(r){
  if(emailing){
    return '<button class="bigbtn" disabled style="background:var(--gray);margin-bottom:12px">SENDING&#8230;</button>';
  }
  if(r.emailedAt){
    return '<div style="background:#eaf6ee;border:2px solid var(--green);border-radius:14px;padding:14px;text-align:center;margin-bottom:12px">' +
      '<div style="font-size:16px;font-weight:800;color:var(--green)">&#10003; OFFICE EMAILED ' + fmt(r.emailedAt) +
      (r.emailConfirmed ? '' : ' <span style="font-weight:700;color:var(--gray)">(unconfirmed)</span>') + '</div>' +
      '<div onclick="emailOffice()" style="margin-top:8px;font-size:13px;font-weight:800;color:var(--gray);cursor:pointer;text-decoration:underline">send again</div>' +
      '</div>';
  }
  return '<button class="bigbtn" onclick="emailOffice()" style="background:var(--blue);margin-bottom:12px">&#9993; EMAIL THE OFFICE</button>';
}

function emailOffice(){
  if(emailing || !currentRow) return;
  var row = currentRow, r = rec(row.id);
  emailing = true; renderDetail();
  var payload = JSON.stringify({
    key: MAILER_KEY,
    job: row.job,
    customer: row.customer || "",
    nickname: row.nickname || "",
    location: row.location || "",
    qty: row.qty || "",
    printer: r.printBy || r.printer || "",
    url: row.url || ""
  });
  function finish(confirmed){
    emailing = false;
    r.emailedAt = now();
    r.emailConfirmed = !!confirmed;
    save(); renderDetail();
    toast("Office emailed.");
  }
  function fail(){
    emailing = false; renderDetail();
    toast("Email didn't go — check the wifi and tap again.");
  }
  var opts = {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:payload};
  try{
    fetch(MAILER_URL, opts).then(function(res){
      finish(!!(res && res.ok));
    })["catch"](function(){
      // Some iPad/Safari setups won't let us read the Apps Script redirect.
      // Fire and forget rather than leave the printer stuck, but label it
      // unconfirmed so nobody assumes it landed.
      var o2 = {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:payload};
      fetch(MAILER_URL, o2).then(function(){ finish(false); })["catch"](fail);
    });
  }catch(e){ fail(); }
}

function stamp(field){
  var r = rec(currentRow.id);
  if(field === "setupDone" && r.setupStart && (now() - r.setupStart) < 120000){
    if(!confirm("Setup was under 2 minutes — mis-tap? Press OK only if setup really is done.")) return;
  }
  if(field === "jobDone" && r.setupDone && (now() - r.setupDone) < 120000){
    if(!confirm("Print ran under 2 minutes — is the job really done?")) return;
  }
  r[field] = now();
  // whoever finishes setup owns the setup minutes; whoever starts printing owns the print
  // minutes from here until a handoff says otherwise
  if(field === "setupDone"){
    if(!r.setupBy) r.setupBy = r.printer;
    if(!r.printBy) r.printBy = r.printer;
  }
  // between-jobs clock: stops when work starts again, starts when a job finishes
  if(field === "setupStart") endGap(r.printer, currentRow._day);
  if(field === "jobDone") startGap(r.printer, currentRow._day);
  save(); renderDetail();
  toast(field === "jobDone" ? "Job done — nice." : "Time logged " + fmt(now()));
}

function confirmHandoff(){
  var r = rec(currentRow.id);
  if(!handoffDraft.to){ toast("Pick who's taking over"); return; }
  var el = document.getElementById("hopieces");
  var pieces = null;
  if(el && el.value !== "" && !isNaN(Number(el.value))) pieces = Math.round(Number(el.value));
  else if(handoffDraft.pieces != null) pieces = handoffDraft.pieces;
  var phase = r.setupDone ? "print" : "setup";
  if(phase === "print" && pieces != null){
    var prev = priorCum(r);
    if(pieces <= prev || pieces > currentRow.qty){
      if(!confirm("Pieces so far (" + pieces + ") looks off — it should be between " + (prev+1) + " and " + currentRow.qty + " for the whole run. Save it anyway?")) return;

  r.handoffs = r.handoffs || [];
  r.handoffs.push({at: now(), from: r.printer, to: handoffDraft.to, pieces: (phase === "print" ? pieces : null), phase: phase});
  r.printer = handoffDraft.to;
  handoffPicking = false; handoffDraft = {to:null, pieces:null};
  save(); renderDetail();
  toast("Handed off to " + r.printer);

// ---------- math ----------
function calcRow(row){
  var r = STATES[row._day][row.id] || {};
  var out = {setupMin:null, printMin:null, pph:null, pauseMin:0};
  if(r.setupStart && r.setupDone){
    out.setupMin = mins((r.setupDone - r.setupStart) - pausedMsBetween(r, r.setupStart, r.setupDone));
  }
  if(r.setupDone && r.jobDone){
    var printMs = (r.jobDone - r.setupDone) - pausedMsBetween(r, r.setupDone, r.jobDone);
    out.printMin = mins(printMs);
    if(printMs > 0) out.pph = Math.round(row.qty / (printMs/3600000));
  }
  out.pauseMin = mins((r.pauses||[]).reduce(function(a,p){ return a + ((p.end||now()) - p.start); }, 0));
  return out;
}

// ---------- export (v3 — whole week to date) ----------
function buildExport(){
  var anyEdits = false;
  var t = "MAYHEM INK — WEEK TIMING (week of " + WEEKID + ", exported " + todayStr() + ")\n";
  t += "=============================================\n";
  var exportDays = [];
  for(var di = 0; di < DAYSARR.length; di++){
    var day = DAYSARR[di];
    var hasData = dayHasTaps(day);
    if(day > todayStr() && !hasData) continue;   // future days with no taps: nothing to say yet
    var rows = ROWSBY[day];
    exportDays.push(day);
    t += "\n########  " + dayLabel(day) + " " + day + (hasData ? "" : "  — NO TAPS LOGGED") + "  ########\n";
    // crew clock summary
    var c = CLOCKS[day] || {};
    for(var pi = 0; pi < PRINTERS.length; pi++){
      var pn = PRINTERS[pi];
      var k = c[pn];
      if(k && k.in){
        var lun = (k.lunches||[]).map(function(l){
          var lm = l.end ? mins(l.end - l.start) : null;
          return fmt(l.start) + "-" + (l.end?fmt(l.end):"?") + (lm!=null ? " (" + lm + "m)" : "");
        }).join(", ");
        t += "CLOCK " + pn + ": in " + fmt(k.in) + (lun ? " · lunch " + lun : " · NO LUNCH LOGGED") + (k.out ? " · out " + fmt(k.out) : " · STILL ON FLOOR") + "\n";
        var gs = k.gaps || [];
        if(gs.length){
          var gtot = 0;
          for(var gi = 0; gi < gs.length; gi++) gtot += gapMins(k, gs[gi]);
          t += "  BETWEEN JOBS " + pn + ": " + gtot + "m total across " + gs.length + " gap(s)\n";
          for(var gj = 0; gj < gs.length; gj++){
            var g = gs[gj];
            t += "    " + fmt(g.start) + "-" + (g.end?fmt(g.end):"still open") +
              " (" + gapMins(k, g) + "m)" + (g.reason ? ": " + g.reason : ": NO REASON GIVEN") + "\n";
          }
        }
      }
    }
    var byJob = {};
    var jobOrder = [];
    for(var ri = 0; ri < rows.length; ri++){
      var row = rows[ri];
      if(!byJob[row.job]){ byJob[row.job] = []; jobOrder.push(row.job); }
      byJob[row.job].push(row);
    }
    for(var ji = 0; ji < jobOrder.length; ji++){
      var job = jobOrder[ji];
      var jrows = byJob[job];
      t += "\n#" + job + " " + jrows[0].customer + "\n";
      for(var ri2 = 0; ri2 < jrows.length; ri2++){
        var row2 = jrows[ri2];
        var r = STATES[day][row2.id] || {};
        var m = calcRow(row2);
        var cc = r.colors != null ? r.colors : row2.colors;
        var ss = r.screens != null ? r.screens : row2.screens;
        t += "  " + row2.location + " (" + cc + "c/" + ss + "s, " + row2.qty + " pcs)";
        if(cc !== row2.colors || ss !== row2.screens) t += " [order said " + row2.colors + "c/" + row2.screens + "s]";
        if(!r.setupStart){ t += " — NOT RUN\n"; continue; }
        var ed = r.edits || {};
        var mk = function(f){ return ed[f] ? "*" : ""; };
        if(Object.keys(ed).length) anyEdits = true;
        var sHand = setupHandoffs(r);
        t += "\n    " + crewStr(r) + (r.press ? " on " + r.press : "") +
          " · setup " + fmt(r.setupStart) + mk("setupStart") + "–" + (r.setupDone?fmt(r.setupDone)+mk("setupDone"):"?") +
          (m.setupMin!=null ? " (" + m.setupMin + "m" + (r.setupBy ? ", " + r.setupBy : "") + ")" : "") +
          " · done " + (r.jobDone?fmt(r.jobDone)+mk("jobDone"):"NOT FINISHED") +
          (m.printMin!=null ? " (" + m.printMin + "m print, " + m.pph + " pcs/hr)" : "") + "\n";
        for(var shi = 0; shi < sHand.length; shi++){
          t += "    SETUP HANDOFF " + fmt(sHand[shi].at) + ": " + (sHand[shi].from||"?") + " -> " + sHand[shi].to + " (setup time is shared)\n";
        }
        var psegs = printHandoffs(r).length ? printSegments(row2) : [];
        if(psegs.length > 1){
          t += "    HANDOFF RUN — print split:\n";
          for(var pi2 = 0; pi2 < psegs.length; pi2++){
            var sg = psegs[pi2];
            t += "      " + sg.printer + " " + fmt(sg.start) + "–" + (sg.open ? "still running" : fmt(sg.end)) +
              " (" + sg.min + "m" +
              (sg.pieces != null ? ", " + sg.pieces + " pcs, " + sg.pph + " pcs/hr" : ", PIECES NOT COUNTED — don't split this one") + ")\n";
          }
        }
        if((r.pauses||[]).length){
          for(var qi = 0; qi < r.pauses.length; qi++){
            var p = r.pauses[qi];
            t += "    STOPPED " + fmt(p.start) + "–" + (p.end?fmt(p.end):"?") +
              " (" + mins((p.end||now())-p.start) + "m)" + (p.reason ? ": " + p.reason : "") +
              (p.added ? " *added by hand" : (p.edited ? " *edited" : "")) + "\n";
          }
        }
        if(r.notes) t += "    NOTE: " + r.notes + "\n";
        if((r.audit||[]).length){
          for(var ai = 0; ai < r.audit.length; ai++){
            var a = r.audit[ai];
            t += "    EDIT LOG: " + a.field + " " + (typeof a.old === "number" ? fmt(a.old) : (a.old==null?"—":a.old)) +
              " -> " + (typeof a.new === "number" ? fmt(a.new) : (a.new==null?"—":a.new)) + " (changed at " + fmt(a.at) + ")\n";
          }
        }
      }
    }
  }
  if(anyEdits) t += "\n* = time was entered or changed by hand, not live-tapped\n";
  t += "\n--- raw data (for Claude) ---\n";
  var raw = {week: WEEKID, days: []};
  for(var di2 = 0; di2 < exportDays.length; di2++){
    var d2 = exportDays[di2];
    raw.days.push({day: d2, rows: ROWSBY[d2], times: STATES[d2], clock: CLOCKS[d2] || {}});
  }
  t += JSON.stringify(raw);
  return t;
}
function showExport(){
  document.getElementById("list").style.display = "none";
  document.getElementById("detail").style.display = "none";
  document.getElementById("eodbar").style.display = "none";
  document.getElementById("exportview").style.display = "block";
  document.getElementById("exporttext").textContent = buildExport();
}
function copyExport(){
  var txt = buildExport();
  markExported();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast("Copied — paste it to Kolton"); }, function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta);
  ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
  toast("Copied — paste it to Kolton");
}

// ---------- misc ----------
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
var toastTimer = null;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.style.display = "none"; }, 2200);
}
// re-check the export nag every 5 minutes so it appears without a reload
setInterval(function(){
  if(!currentRow && document.getElementById("list").style.display !== "none") renderNag();
}, 300000);

loadWeek();
</script>

<div id="lightbox" onclick="if(event.target===this)hideLightbox()">
  <button id="lbclose" onclick="hideLightbox()">&times;</button>
  <img id="lbimg" alt="">
  <div id="lbhint">pinch or double-tap to zoom &middot; tap outside to close</div>
</div>
<script>
var lbW = 96, lbPinchD0 = 0, lbPinchW0 = 96, lbLastTap = 0;
function showLightbox(src){
  var im = document.getElementById('lbimg');
  im.src = src; lbW = 96; im.style.width = '96%';
  document.getElementById('lightbox').style.display = 'block';
  document.body.style.overflow = 'hidden';
}
function hideLightbox(){
  document.getElementById('lightbox').style.display = 'none';
  document.body.style.overflow = '';
}
(function(){
  var lb = document.getElementById('lightbox');
  var im = document.getElementById('lbimg');
  function d(e){var a=e.touches[0],b=e.touches[1];return Math.hypot(a.pageX-b.pageX,a.pageY-b.pageY);}
  lb.addEventListener('touchstart', function(e){
    if(e.touches.length===2){ lbPinchD0 = d(e); lbPinchW0 = lbW; }
  }, {passive:true});
  lb.addEventListener('touchmove', function(e){
    if(e.touches.length===2 && lbPinchD0 > 0){
      e.preventDefault();
      lbW = Math.min(500, Math.max(60, lbPinchW0 * d(e)/lbPinchD0));
      im.style.width = lbW + '%';
    }
  }, {passive:false});
  lb.addEventListener('touchend', function(e){ if(e.touches.length<2) lbPinchD0 = 0; }, {passive:true});
  im.addEventListener('click', function(){
    var now = Date.now();
    if(now - lbLastTap < 350){
      lbW = (lbW <= 100) ? 250 : 96;
      im.style.width = lbW + '%';
    }
    lbLastTap = now;
  });
})();
</script>
