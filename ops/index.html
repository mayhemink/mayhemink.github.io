<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mayhem Ops</title>
<meta name="robots" content="noindex">
<style>
/* ============ MAYHEM OPS — dark liquid glass, Carolina blue ============ */
/* iMac-only. No mobile breakpoints by design. Never restyle after ship.  */
:root{
  --bg0:#0b0f14; --bg1:#101823;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.2);
  --txt:#e8eef5; --dim:#8fa1b3; --dim2:#5c6b7a;
  --blue:#4B9CD3; --blue2:#7cc0ea;
  --amber:#e8a13c; --red:#e05252; --green:#3dd68c;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg0)}
body{
  min-height:100vh;color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  background:
    radial-gradient(900px 600px at 12% -10%, rgba(75,156,211,.16), transparent 60%),
    radial-gradient(1100px 700px at 105% 15%, rgba(75,156,211,.10), transparent 55%),
    radial-gradient(800px 900px at 50% 120%, rgba(35,80,120,.18), transparent 60%),
    linear-gradient(180deg,var(--bg0),var(--bg1) 60%,var(--bg0));
  background-attachment:fixed;
  padding:34px 44px 90px;
}
.wrap{max-width:1480px;margin:0 auto}

/* header */
header{display:flex;align-items:baseline;gap:22px;margin-bottom:26px;flex-wrap:wrap}
h1{font-size:30px;font-weight:800;letter-spacing:.14em}
h1 b{color:var(--blue);font-weight:800}
.built{color:var(--dim);font-size:13px}
.pills{display:flex;gap:10px;margin-left:auto}
.pill{
  background:var(--glass);border:1px solid var(--line);border-radius:999px;
  padding:6px 16px;font-size:13px;color:var(--dim);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
}
.pill b{color:var(--txt);font-weight:700;font-size:15px}
.pill.warn b{color:var(--red)}

/* must-do strip */
#must{
  border-radius:var(--r);padding:18px 22px;margin-bottom:26px;
  background:linear-gradient(120deg, rgba(224,82,82,.10), rgba(232,161,60,.06) 55%, var(--glass));
  border:1px solid rgba(224,82,82,.28);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
}
#must.clear{background:linear-gradient(120deg, rgba(61,214,140,.09), var(--glass));border-color:rgba(61,214,140,.3)}
#must h2{font-size:12px;letter-spacing:.22em;color:var(--dim);margin-bottom:12px;font-weight:700}
#must.clear .zero{color:var(--green);font-size:17px;font-weight:600}
.mrow{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid rgba(255,255,255,.05);font-size:14px}
.mrow:first-of-type{border-top:none}
.mrow .lane{font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 9px;border-radius:6px;background:rgba(75,156,211,.16);color:var(--blue2)}
.mrow .due{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.u-red{color:var(--red)} .u-amber{color:var(--amber)} .u-ok{color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.red{background:var(--red);box-shadow:0 0 10px rgba(224,82,82,.7)}
.dot.amber{background:var(--amber);box-shadow:0 0 10px rgba(232,161,60,.6)}

/* tabs */
nav{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
nav button{
  font:inherit;font-size:14px;font-weight:600;color:var(--dim);cursor:pointer;
  background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 20px;
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  transition:all .18s;
}
nav button:hover{color:var(--txt);border-color:var(--line2)}
nav button.on{
  color:#fff;background:linear-gradient(140deg, rgba(75,156,211,.30), rgba(75,156,211,.12));
  border-color:rgba(75,156,211,.55);box-shadow:0 0 22px rgba(75,156,211,.18);
}
nav .n{display:inline-block;min-width:21px;margin-left:8px;padding:1px 7px;border-radius:999px;
  font-size:12px;background:rgba(255,255,255,.1);color:var(--txt)}
nav button.on .n{background:rgba(75,156,211,.4)}

/* glass card */
.card{
  background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 18px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
}
@supports not (backdrop-filter:blur(1px)){ .card,#must,nav button,.pill{background:#151d28} }

/* lane rows */
.lanewrap{display:flex;flex-direction:column;gap:12px}
.lanehead{color:var(--dim);font-size:13px;margin:2px 4px 6px}
.lanehead b{color:var(--txt)}
.row{display:flex;align-items:center;gap:16px;padding:15px 20px;transition:opacity .3s, transform .3s}
.row .v a{color:var(--blue2);text-decoration:none;font-weight:800;font-variant-numeric:tabular-nums}
.row .v a:hover{text-decoration:underline}
.row .meat{flex:1;min-width:0}
.row .job{font-weight:650}
.row .sub{color:var(--dim);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .due{font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap;text-align:right}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;
  border-radius:6px;padding:2.5px 8px;margin-left:8px;vertical-align:1px}
.b-strong{background:rgba(75,156,211,.2);color:var(--blue2);border:1px solid rgba(75,156,211,.4)}
.b-standing{background:rgba(61,214,140,.14);color:var(--green);border:1px solid rgba(61,214,140,.35)}
.b-weak{background:rgba(255,255,255,.07);color:var(--dim);border:1px solid var(--line)}
.b-new{background:rgba(124,192,234,.16);color:var(--blue2);border:1px solid rgba(124,192,234,.4)}
.b-hold{background:rgba(232,161,60,.14);color:var(--amber);border:1px solid rgba(232,161,60,.35)}
.b-flag{background:rgba(255,255,255,.07);color:var(--dim);border:1px solid var(--line)}
.qty{color:var(--dim);font-size:13px;white-space:nowrap}
.acts{display:flex;gap:8px}
.acts button{
  font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.05em;cursor:pointer;
  color:var(--blue2);background:rgba(75,156,211,.10);border:1px solid rgba(75,156,211,.35);
  border-radius:9px;padding:7px 14px;transition:all .15s;white-space:nowrap;
}
.acts button:hover{background:rgba(75,156,211,.25);color:#fff;box-shadow:0 0 14px rgba(75,156,211,.25)}
.row.done{opacity:.45}
.row.done .job{text-decoration:line-through;text-decoration-color:rgba(61,214,140,.6)}
.stamp{font-size:12.5px;color:var(--green);white-space:nowrap;cursor:pointer}
.stamp:hover{text-decoration:line-through;text-decoration-color:var(--red)}
.row.sent{opacity:.7}
.sentnote{font-size:12.5px;color:var(--amber);white-space:nowrap}
.tally{color:var(--dim);font-size:13px;margin:10px 6px 0}
.tally b{color:var(--green)}
.donehead{color:var(--dim2);font-size:12px;font-weight:700;letter-spacing:.18em;
  margin:20px 6px 10px;display:flex;align-items:center;gap:12px}
.donehead::after{content:"";flex:1;height:1px;background:var(--line)}

/* all-jobs grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:16px}
.jcard{padding:18px 20px}
.jcard .top{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.jcard .nick{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jcard .cust{color:var(--dim);font-size:13px}
.jcard .chips{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:6px;
  background:rgba(75,156,211,.13);color:var(--blue2);border:1px solid rgba(75,156,211,.3)}
.jcard ul{list-style:none;margin-top:8px}
.jcard li{font-size:13px;color:var(--dim);padding:3px 0;display:flex;gap:8px;align-items:center}
.jcard li.tdone{color:var(--dim2);text-decoration:line-through}
.tick{width:14px;height:14px;border-radius:4px;border:1px solid var(--line2);flex:none;display:inline-block}
.tdone .tick{background:rgba(61,214,140,.25);border-color:var(--green)}
.jcard .due{margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.overduecard{border-color:rgba(224,82,82,.4)}

/* pending */
#pendtiles{display:flex;gap:14px;margin-bottom:16px}
.tile{flex:1;padding:18px 22px;text-align:left}
.tile .big{font-size:34px;font-weight:250;letter-spacing:.02em}
.tile .big.money{color:var(--amber)}
.tile .lbl{color:var(--dim);font-size:12.5px;letter-spacing:.1em;margin-top:2px}
.prow{padding:14px 20px}
.prow .line{display:flex;align-items:center;gap:14px;cursor:pointer}
.prow .amt{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--dim);white-space:nowrap}
.prow .amt b{color:var(--amber)}
.prow .age{color:var(--dim2);font-size:12.5px;white-space:nowrap}
.paidrow{border-left:3px solid var(--amber)}
.adminrow{border-left:3px solid var(--blue)}
.admin{font-size:12.5px;color:var(--blue2)}
.draft{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.prow.open .draft{display:block}
.draft pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;color:var(--txt);
  background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:14px;margin:8px 0}
.draft .db{display:flex;gap:10px}
.gone{color:var(--dim2);font-size:13px;text-align:center;padding:40px 0}

/* mockup thumbs + lightbox */
.thumb{width:52px;height:52px;object-fit:contain;border-radius:8px;background:#fff;
  border:1px solid var(--line);cursor:zoom-in;flex:none;transition:transform .15s}
.thumb:hover{transform:scale(1.06);border-color:rgba(75,156,211,.5)}
.thumb.none{background:rgba(255,255,255,.04);cursor:default}
.thumb.big{width:74px;height:74px}
.jrow{display:flex;gap:14px;align-items:flex-start}
#lightbox{display:none;position:fixed;inset:0;z-index:60;background:rgba(5,8,12,.85);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  align-items:center;justify-content:center;cursor:zoom-out}
#lightbox img{max-width:88vw;max-height:88vh;border-radius:14px;background:#fff;
  box-shadow:0 30px 90px rgba(0,0,0,.6)}

/* move control + menu */
.movebtn{font:inherit;font-size:15px;color:var(--dim2);background:none;border:1px solid transparent;
  border-radius:8px;padding:4px 8px;cursor:pointer;flex:none}
.movebtn:hover{color:var(--blue2);border-color:rgba(75,156,211,.35);background:rgba(75,156,211,.08)}
.movemenu{position:absolute;z-index:50;min-width:170px;padding:8px;display:flex;flex-direction:column;gap:4px}
.movemenu .mm-title{font-size:11px;letter-spacing:.14em;color:var(--dim);padding:2px 8px 6px}
.movemenu button{font:inherit;font-size:13.5px;font-weight:600;text-align:left;color:var(--txt);
  background:none;border:none;border-radius:8px;padding:8px 12px;cursor:pointer}
.movemenu button:hover{background:rgba(75,156,211,.18);color:#fff}
.movemenu .mm-reset{color:var(--amber)}
#err{display:none;margin-bottom:18px;padding:12px 18px;border-radius:12px;font-size:13.5px;
  background:rgba(224,82,82,.12);border:1px solid rgba(224,82,82,.4);color:#f2b8b8}
.copyok{color:var(--green) !important;border-color:rgba(61,214,140,.5) !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MAYHEM <b>OPS</b></h1>
    <span class="built" id="built">loading…</span>
    <div class="pills" id="pills"></div>
  </header>
  <div id="err"></div>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="lightbox" onclick="this.style.display='none'"><img src="" alt=""></div>

<script>
"use strict";
/* ===== config ===== */
const WORKER = "https://mayhem-ops-state.autumn-mountain-14c6.workers.dev";
const DATA_URL = "data/ops.json";
const LANES = {FILMS:"Films", WVN:"Woven", DTF:"DTF", LASER:"Laser", DIGI:"Digitizing", OUTSOURCE:"Outsource"};
const ACT_LABEL = {onfile:"ON FILE", made:"MADE", ordered:"ORDERED", printed:"PRINTED",
                   sent:"SENT OUT", received:"RECEIVED"};
// per-lane relabels: outsourced work is "ordered" out, then "received" back in
const ACT_LABEL_LANE = {OUTSOURCE:{sent:"ORDERED"}};
const LANE_ACTIONS = {FILMS:["onfile","made"], WVN:["ordered"], DTF:["printed","ordered"],
                      LASER:["made"], DIGI:["onfile","sent","received"], OUTSOURCE:["sent","received"]};
const LANE_SUB = {FILMS:"burn films & screens — knock off the repeats first",
  WVN:"order woven patches — longest lead time in the shop",
  DTF:"transfers to print (or order out)",
  LASER:"leather patches, engraving & UV — batch a day",
  DIGI:"embroidery digitizing — send early, it round-trips",
  OUTSOURCE:"ordered out (China etc.) — waiting on goods"};

/* ===== identity: #k=KEY&who=joe from the bookmark, remembered per machine =====
   First keyed visit stores the key (+who) in localStorage, so the hub's plain
   /ops/#who=joe|kolton buttons — and even a bare /ops/ — keep working after that.
   The key itself never appears in the repo or the hub page. */
const hashP = new URLSearchParams(location.hash.slice(1));
let KEY = hashP.get("k") || "";
let WHO = (hashP.get("who") || "").toLowerCase();
try{
  if (KEY) localStorage.setItem("mo-key", KEY);
  else     KEY = localStorage.getItem("mo-key") || "";
  if (WHO) localStorage.setItem("mo-who", WHO);
  else     WHO = localStorage.getItem("mo-who") || "";
}catch(e){}
if (!WHO) WHO = "shop";
/* pasting the full #k= URL into an already-open tab only changes the hash (no reload) —
   adopt it live so the unlock still happens */
window.addEventListener("hashchange", async () => {
  const p = new URLSearchParams(location.hash.slice(1));
  const k = p.get("k") || "", who = (p.get("who") || "").toLowerCase();
  let changed = false;
  if (k && k !== KEY){ KEY = k; try{ localStorage.setItem("mo-key", k); }catch(e){} changed = true; }
  if (who && who !== WHO){ WHO = who; try{ localStorage.setItem("mo-who", who); }catch(e){} changed = true; }
  if (changed && OPS){ hideErr(); await loadState(); render(); }
});

let OPS = null, STATE = {}, OV = {}, tab = sessionStorage.getItem("mo-tab") || "MUST";
let V2IMG = {};   // visualId -> mockup path

/* effective lanes after user moves (overrides live in KV, keyed by taskId).
   The taskId NEVER changes on a move — check-off state follows the row. */
function effLanes(){
  const out = {}; for (const k of Object.keys(LANES)) out[k] = [];
  for (const [k, rows] of Object.entries(OPS.lanes))
    for (const r of rows){
      const target = (OV[r.id] && LANES[OV[r.id].lane]) ? OV[r.id].lane : k;
      const row = (target === k) ? r : {...r, actions: LANE_ACTIONS[target], moved: k};
      out[target].push(row);
    }
  for (const l of Object.values(out)) l.sort((a,b) => a.due < b.due ? -1 : 1);
  return out;
}
function effLaneOf(id){
  if (OV[id] && LANES[OV[id].lane]) return OV[id].lane;
  const suf = id.split(":")[1];
  return {films:"FILMS", woven:"WVN", dtf:"DTF", laser:"LASER", digi:"DIGI"}[suf] || "FILMS";
}

/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function dueTxt(days, due){
  const d = new Date(due + "T12:00:00");
  const day = d.toLocaleDateString("en-US",{weekday:"short", month:"numeric", day:"numeric"});
  if (days < 0)  return `${day} · ${-days}d LATE`;
  if (days === 0) return `${day} · TODAY`;
  if (days === 1) return `${day} · tomorrow`;
  return `${day} · in ${days}d`;
}
const uCls = u => "u-" + u;
function stampTxt(st){
  const t = new Date(st.ts);
  const hm = t.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}).toLowerCase().replace(" ","");
  return `✓ ${st.how ? ACT_LABEL[st.how] || st.how : "done"} · ${st.who} · ${hm}`;
}

/* ===== data ===== */
async function loadOps(){
  if (window.__PREVIEW_OPS){ OPS = window.__PREVIEW_OPS; return; }  // file:// preview hook
  const r = await fetch(DATA_URL + "?cb=" + Date.now());
  if (!r.ok) throw new Error("ops.json " + r.status);
  OPS = await r.json();
}
async function loadState(){
  if (!KEY) return;
  try{
    const r = await fetch(WORKER + "/state?k=" + encodeURIComponent(KEY));
    if (r.ok){ const d = await r.json(); STATE = d.states || {}; OV = d.overrides || {}; }
  }catch(e){ /* keep last known state */ }
}
async function setOverride(id, lane){
  const prev = OV[id];
  if (lane) OV[id] = {lane, who:WHO, ts:new Date().toISOString()}; else delete OV[id];
  render();
  try{
    const r = await fetch(WORKER + "/override", {method:"POST",
      headers:{"Content-Type":"application/json","X-Ops-Key":KEY},
      body:JSON.stringify({taskId:id, lane:lane||"", who:WHO})});
    if (!r.ok) throw new Error(r.status);
  }catch(e){
    if (prev) OV[id] = prev; else delete OV[id];
    showErr("Couldn't save that move — it was undone."); render();
  }
}
async function setCheck(id, done, how){
  const prev = STATE[id];
  if (done) STATE[id] = {done:true, who:WHO, how:how||"", ts:new Date().toISOString()};
  else delete STATE[id];
  render();                       // optimistic
  try{
    const r = await fetch(WORKER + "/check", {method:"POST",
      headers:{"Content-Type":"application/json","X-Ops-Key":KEY},
      body:JSON.stringify({taskId:id, done, who:WHO, how:how||""})});
    if (!r.ok) throw new Error(r.status);
  }catch(e){
    if (prev) STATE[id] = prev; else delete STATE[id];   // roll back
    showErr("Couldn't save that check — network or key problem. It was undone.");
    render();
  }
}
function showErr(msg, sticky){ const e = $("#err"); e.textContent = msg; e.style.display = "block";
  clearTimeout(showErr._t); if (!sticky) showErr._t = setTimeout(()=>e.style.display="none", 6000); }
function hideErr(){ clearTimeout(showErr._t); $("#err").style.display = "none"; }

/* ===== header ===== */
function renderHeader(){
  const open = Object.values(effLanes()).flat().filter(r => !isCleared(r)).length;
  const over = OPS.jobs.filter(j => j.overdue).length;
  $("#built").textContent = "built " + new Date(OPS.built).toLocaleString("en-US",
    {weekday:"short", hour:"numeric", minute:"2-digit"}).toLowerCase();
  $("#pills").innerHTML =
    `<span class="pill"><b>${OPS.jobs.length}</b> jobs</span>` +
    `<span class="pill"><b>${open}</b> open items</span>` +
    (over ? `<span class="pill warn"><b>${over}</b> overdue</span>` : "") +
    `<span class="pill">${esc(WHO)}${KEY ? "" : " · VIEW ONLY"}</span>`;
}

/* state semantics: done rows disappear from lanes; DIGI "sent" stays dimmed until "received" */
const isCleared = r => { const st = STATE[r.id]; return !!st && st.how !== "sent"; };
const isSent    = r => { const st = STATE[r.id]; return !!st && st.how === "sent"; };
/* completed rows drop to a "COMPLETED TODAY" section at the bottom of the lane;
   anything cleared on a previous shop day (Denver) is hidden — the section empties itself daily */
const denverDay = ts => new Date(ts).toLocaleDateString("en-CA", {timeZone:"America/Denver"});
const clearedToday = r => { const st = STATE[r.id]; return !st.ts || denverDay(st.ts) === denverDay(Date.now()); };

function jobId(v){ const j = OPS.jobs.find(x => x.visualId === v); return j ? j.id : ""; }

/* ===== tabs ===== */
function renderTabs(){
  const eff = effLanes();
  const t = [["MUST","Board"],["ALL","All Jobs"]];
  for (const [k, label] of Object.entries(LANES)){
    if (!eff[k].length) continue;
    t.push([k, label, eff[k].filter(r => !isCleared(r)).length]);
  }
  if (KEY) t.push(["PEND","Pending Quotes", OPS.pendingCount]);
  $("#tabs").innerHTML = t.map(([k,label,n]) =>
    `<button data-t="${k}" class="${tab===k?"on":""}">${label}${n!=null?`<span class="n">${n}</span>`:""}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b =>
    b.onclick = () => { tab = b.dataset.t; sessionStorage.setItem("mo-tab", tab); render(); });
}

/* ===== lane view ===== */
function laneView(k){
  const rows = effLanes()[k];
  const openRows = rows.filter(r => !isCleared(r));
  const clearedN = rows.length - openRows.length;
  let tallies = "";
  if (k === "FILMS"){
    const on = rows.filter(r => STATE[r.id]?.how === "onfile").length;
    const md = rows.filter(r => STATE[r.id]?.how === "made").length;
    tallies = `<div class="tally"><b>${on}</b> on file · <b>${md}</b> made · ${openRows.length} to go</div>`;
  } else if (clearedN){
    tallies = `<div class="tally"><b>${clearedN}</b> cleared · ${openRows.length} to go</div>`;
  }
  const doneToday = rows.filter(r => isCleared(r) && clearedToday(r));
  const list = openRows.map(r => laneRow(k, r)).join("");
  const empty = doneToday.length
    ? `<div class="gone">All done here today. 🤘</div>`
    : `<div class="gone">Lane's empty. Nothing to do here.</div>`;
  const doneSec = doneToday.length
    ? `<div class="donehead">COMPLETED TODAY — ${doneToday.length}</div>
       <div class="lanewrap">${doneToday.map(r => laneRow(k, r)).join("")}</div>`
    : "";
  return `<div class="lanehead"><b>${LANES[k]}</b> — ${LANE_SUB[k]}</div>
          <div class="lanewrap">${list || empty}</div>${doneSec}${tallies}`;
}
function actLbl(k, a){ return (ACT_LABEL_LANE[k] && ACT_LABEL_LANE[k][a]) || ACT_LABEL[a]; }
function laneRow(k, r){
  const st = STATE[r.id];
  const cleared = isCleared(r), sent = isSent(r);
  let right;
  if (cleared){
    right = `<span class="stamp" title="click to un-check" data-un="${r.id}">${stampTxt(st)}</span>`;
  } else if (sent){
    const lbl = k === "OUTSOURCE" ? "ordered" : "out";
    right = `<span class="sentnote">${lbl} @ ${new Date(st.ts).toLocaleDateString("en-US",{month:"numeric",day:"numeric"})} · ${esc(st.who)}</span>
             <div class="acts"><button data-act="received" data-id="${r.id}">RECEIVED</button></div>`;
  } else {
    right = `<div class="acts">` + r.actions.filter(a => a !== "received").map(a =>
      `<button data-act="${a}" data-id="${r.id}">${actLbl(k, a)}</button>`).join("") + `</div>`;
  }
  // move control: every row can be re-laned; taskId (and its check state) never changes
  right += `<button class="movebtn" data-move="${r.id}" title="move to another lane">⇄</button>`;
  let badge = "";
  if (r.repeat){
    const cls = {strong:"b-strong", standing:"b-standing", weak:"b-weak"}[r.repeat.conf] || "b-weak";
    const lbl = r.repeat.conf === "standing" ? "SCREENS STANDING" : r.repeat.conf === "strong" ? "REPEAT?" : "repeat cust";
    badge = `<span class="badge ${cls}" title="${esc(r.repeat.why)}">${lbl}${r.repeat.prior ? " #"+r.repeat.prior : ""}</span>`;
  }
  if (r.hint) badge += `<span class="badge b-standing" title="${esc(r.hint)}">DST on file?</span>`;
  if (r.moved) badge += `<span class="badge b-flag" title="moved by ${esc((OV[r.id]||{}).who||"?")} — click ⇄ to move back">was ${LANES[r.moved]}</span>`;
  const sub = [r.locs && r.locs.length ? esc(r.locs.join(" · ")) : "", r.what ? esc(r.what) : ""].filter(Boolean).join(" · ");
  const img = V2IMG[r.v];
  const thumb = img ? `<img class="thumb" src="${img}" loading="lazy" data-zoom="${img}" alt="">`
                    : `<span class="thumb none"></span>`;
  return `<div class="row card ${cleared?"done":""} ${sent?"sent":""}">
    ${thumb}
    <span class="v"><a href="https://www.printavo.com/invoices/${jobId(r.v)}" target="_blank">#${r.v}</a></span>
    <div class="meat"><div class="job">${esc(r.job)}${badge}</div>
      <div class="sub">${esc(r.cust)}${sub ? " — " + sub : ""}</div></div>
    ${r.qty ? `<span class="qty">${r.qty} pc</span>` : ""}
    <span class="due ${uCls(r.urgency)}">${dueTxt(r.days, r.due)}</span>
    ${right}</div>`;
}

/* ===== all jobs ===== */
function allView(){
  const flat = Object.values(effLanes()).flat();
  const cards = OPS.jobs.map(j => ({j, rows: flat.filter(r => r.v === j.visualId)}));
  const jobDone = c => c.rows.length > 0 && c.rows.every(r => isCleared(r));
  const open = cards.filter(c => !jobDone(c));
  const doneToday = cards.filter(c => jobDone(c) && c.rows.some(r => clearedToday(r)));
  let html = `<div class="grid">` + open.map(c => jobCard(c.j, c.rows, false)).join("") + `</div>`;
  if (!open.length) html = `<div class="card clear"><div class="zero">Every job's prep is done. 🤘</div></div>`;
  if (doneToday.length)
    html += `<div class="donehead">ALL PREP DONE TODAY — ${doneToday.length}</div>` +
            `<div class="grid">` + doneToday.map(c => jobCard(c.j, c.rows, true)).join("") + `</div>`;
  return html;
}
function jobCard(j, laneRows, dim){
  {
    const items = laneRows.map(r => {
      const done = isCleared(r);
      return `<li class="${done?"tdone":""}" data-tick="${r.id}" style="cursor:pointer" title="${done?"click to un-check":"click to mark done"}"><span class="tick"></span>${LANES[effLaneOf(r.id)]}: ${esc(laneLabel(r))}${done ? ` <span style="color:var(--green)">${esc(STATE[r.id].who)}</span>`:""}</li>`;
    }).join("");
    const img = V2IMG[j.visualId];
    const cardThumb = img ? `<img class="thumb big" src="${img}" loading="lazy" data-zoom="${img}" alt="">` : "";
    const badges =
      (j.new ? `<span class="badge b-new">NEW</span>` : "") +
      (j.onHold ? `<span class="badge b-hold">ON HOLD</span>` : "") +
      j.flags.filter(f => f !== "ON HOLD").map(f => `<span class="badge b-flag">${esc(f)}</span>`).join("");
    return `<div class="card jcard ${j.overdue?"overduecard":""}"${dim?' style="opacity:.55"':''}>
      <div class="jrow">
        ${cardThumb}
        <div style="flex:1;min-width:0">
          <div class="top"><span class="v"><a style="color:var(--blue2);text-decoration:none;font-weight:800" href="${j.url}" target="_blank">#${j.visualId}</a></span>
            <span class="nick">${esc(j.nickname || j.customer)}</span>
            <span class="due ${j.overdue?"u-red":j.days<=2?"u-amber":"u-ok"}">${dueTxt(j.days, j.due)}</span></div>
          <div class="cust">${esc(j.customer)} · ${j.qty} pcs · ${esc(j.status)}</div>
          <div class="chips">${j.services.map(s=>`<span class="chip">${s}</span>`).join("")}${badges}</div>
          <ul>${items}</ul>
        </div>
      </div></div>`;
  }
}
function laneLabel(r){ return r.what || (r.locs && r.locs.length ? r.locs.join(", ") : (r.qty ? r.qty + " pc" : "task")); }

/* ===== pending ===== */
let PEND = null;
async function pendView(){
  if (!PEND){
    try{
      const r = await fetch(WORKER + "/pending?k=" + encodeURIComponent(KEY));
      PEND = r.ok ? await r.json() : {quotes:[]};
    }catch(e){ PEND = {quotes:[]}; }
  }
  return pendHtml();
}
function pendHtml(){
  const q = PEND.quotes || [];
  const paid = q.filter(x => x.paid > 0 && !x.adminFlag);
  const paidSum = paid.reduce((s,x) => s + x.paid, 0);
  const tiles = `<div id="pendtiles">
    <div class="card tile"><div class="big">${q.length}</div><div class="lbl">QUOTES PENDING APPROVAL</div></div>
    <div class="card tile"><div class="big money">$${paidSum.toFixed(0)}</div><div class="lbl">PAID &amp; SITTING UNAPPROVED (${paid.length})</div></div>
  </div>`;
  return tiles + `<div class="lanewrap">` + q.map((x,i) => {
    const cls = x.adminFlag ? "adminrow" : (x.paid > 0 ? "paidrow" : "");
    const right = x.adminFlag
      ? `<span class="admin">${esc(x.adminFlag)}</span>`
      : `<span class="age">sent ${x.ageDays}d ago</span>`;
    const draft = x.draft ? `<div class="draft">
        <div style="color:var(--dim);font-size:12.5px">To: ${esc(x.email || "(no email on file)")} — ${esc(x.contact)} ${x.phone?("· "+esc(x.phone)):""}</div>
        <pre>${esc(x.draft.subject)}\n\n${esc(x.draft.body)}</pre>
        <div class="db acts">
          <button data-copy="${i}">COPY EMAIL</button>
          ${x.email ? `<button data-mail="${i}">OPEN IN MAIL</button>` : ""}
        </div></div>` : "";
    return `<div class="row card prow ${cls}" data-p="${i}">
      <div style="flex:1"><div class="line">
        <span class="v"><a href="${x.url}" target="_blank" onclick="event.stopPropagation()">#${x.v}</a></span>
        <div class="meat"><div class="job">${esc(x.nick || x.customer)}</div>
          <div class="sub">${esc(x.customer)} · ${esc(x.status)}</div></div>
        <span class="amt">${x.paid > 0 ? `<b>$${x.paid.toFixed(0)}</b> of ` : ""}$${x.total.toFixed(0)}</span>
        <span class="due u-ok">${esc(x.due.slice(5).replace("-","/"))}</span>
        ${right}</div>${draft}</div></div>`;
  }).join("") + `</div>`;
}
function wirePend(){
  document.querySelectorAll(".prow").forEach(p => p.querySelector(".line").onclick = () => p.classList.toggle("open"));
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const x = PEND.quotes[+b.dataset.copy];
    navigator.clipboard.writeText(`Subject: ${x.draft.subject}\n\n${x.draft.body}`);
    b.textContent = "COPIED ✓"; b.classList.add("copyok");
    setTimeout(() => { b.textContent = "COPY EMAIL"; b.classList.remove("copyok"); }, 2000);
  });
  document.querySelectorAll("[data-mail]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const x = PEND.quotes[+b.dataset.mail];
    location.href = `mailto:${encodeURIComponent(x.email)}?subject=${encodeURIComponent(x.draft.subject)}&body=${encodeURIComponent(x.draft.body)}`;
  });
}

/* ===== render ===== */
async function render(){
  renderHeader(); renderTabs();
  const v = $("#view");
  if (tab === "MUST" || tab === "ALL") v.innerHTML = allView();
  else if (tab === "PEND") v.innerHTML = await pendView();
  else if (LANES[tab]) v.innerHTML = laneView(tab);
  else { tab = "MUST"; v.innerHTML = allView(); }
  // wire lane actions
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = () =>
    setCheck(b.dataset.id, true, b.dataset.act));
  document.querySelectorAll("[data-un]").forEach(s => s.onclick = () =>
    setCheck(s.dataset.un, false, ""));
  // clickable ticks on job cards (Board / All Jobs)
  document.querySelectorAll("[data-tick]").forEach(li => li.onclick = ev => {
    ev.stopPropagation();
    const id = li.dataset.tick, st = STATE[id];
    setCheck(id, !(st && st.how !== "sent"), "");
  });
  // move menu
  document.querySelectorAll("[data-move]").forEach(b => b.onclick = ev => {
    ev.stopPropagation(); closeMenu();
    const id = b.dataset.move, cur = effLaneOf(id);
    const m = document.createElement("div"); m.className = "movemenu card";
    m.innerHTML = `<div class="mm-title">Move to…</div>` +
      Object.entries(LANES).filter(([k]) => k !== cur)
        .map(([k, l]) => `<button data-l="${k}">${l}</button>`).join("") +
      (OV[id] ? `<button data-l="" class="mm-reset">↩ back to auto</button>` : "");
    document.body.appendChild(m);
    const r = b.getBoundingClientRect();
    m.style.top = (r.bottom + scrollY + 6) + "px";
    m.style.left = Math.min(r.left + scrollX, innerWidth - 190) + "px";
    m.querySelectorAll("button").forEach(x => x.onclick = e => {
      e.stopPropagation(); setOverride(id, x.dataset.l); closeMenu(); });
  });
  // mockup zoom
  document.querySelectorAll("[data-zoom]").forEach(i => i.onclick = ev => {
    ev.stopPropagation();
    const lb = $("#lightbox"); lb.querySelector("img").src = i.dataset.zoom; lb.style.display = "flex";
  });
  if (tab === "PEND") wirePend();
}
function closeMenu(){ document.querySelectorAll(".movemenu").forEach(m => m.remove()); }
document.addEventListener("click", closeMenu);

/* ===== boot ===== */
(async function(){
  try{ await loadOps(); }
  catch(e){ $("#built").textContent = ""; showErr("Couldn't load the board data (" + e.message + "). Check the publish."); return; }
  V2IMG = {}; OPS.jobs.forEach(j => { if (j.img) V2IMG[j.visualId] = j.img; });
  if (!KEY) showErr("VIEW ONLY — this browser isn't unlocked. Paste your full bookmarked link (the one with #k=) into the address bar and hit Enter; it unlocks this machine for good.", true);
  await loadState();
  render();
  setInterval(async () => { await loadState(); render(); }, 60000);   // two-iMac sync
})();
</script>
