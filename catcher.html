 if(!practice)sharedHooks?.prepare(next,db);next.version=db.version+1;try{localStorage.setItem(key,JSON.stringify(next));}catch(e){throw Error('Could not save on this device. Your previous counts are safe. Free some space and try again.');}db=next;$('save-status').textContent=(practice?'Example counts':'Saved')+' on this device · '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});if(!practice)sharedHooks?.afterSave();
}
function change(fn){try{const next=JSON.parse(JSON.stringify(db));fn(next);persist(next);render();return true;}catch(e){tell(e.message);return false;}}
function actor(){const name=$('catcher-name').value.trim();if(!name){$('catcher-name').focus();throw Error('Enter the catcher’s name at the top first.');}return name;}
function cardAt(lane){return cards.find(c=>c.runId===db.lanes[lane]);}
function record(card){return db.records[card.runId]||C.blank(card);}
function blocked(card){if(card.blocked)return card.blocked;if(db.conflicts?.[card.runId])return 'Another device saved a different count. Use Connect / review to compare before continuing.';const r=db.records[card.runId];if(r&&r.fingerprint!==C.fingerprint(card))return 'Order sizes changed after counting began. Keep the saved count and ask the office to review this run.';return '';}
function render(){
 const scroll=[...$('lanes').children].map(el=>el.scrollTop);
 $('reset-practice').hidden=!practice;$('load-test').hidden=practice||!manifest.testPreset;
 $('practice').textContent=practice?'Back to scheduled jobs':'Try example jobs';$('week-label').textContent=practice?'Practice · made-up counts':(db.testFocus&&manifest.testPreset?'#6385 · Classic Orange + ST460LS':'Week of '+manifest.week);$('source-date').textContent=practice?'Practice counts are kept separate.':'Order sizes loaded '+new Date(manifest.generatedAt).toLocaleDateString();
 $('lanes').innerHTML=[0,1].map(lane=>{
 const card=cardAt(lane),letter='AB'[lane];if(!card)return `<section class="lane empty" aria-label="Card ${letter}"><span class="eyebrow">CARD ${letter}</span><div class="empty-symbol">＋</div><h2>Ready for a run.</h2><p>Choose a job and the exact location coming down the belt.</p><button class="primary" data-action="choose" data-lane="${lane}">Choose location ${letter}</button></section>`;
 const r=record(card),s=C.summary(card,r),lock=blocked(card);const state=r.finishedAt?(s.exact?'Location matched':'Finished · differences'):s.checked?'Counting':'Ready to count';
 return `<section class="lane" aria-label="Card ${letter}: ${esc(card.customer)}"><div class="lane-top"><span class="eyebrow">CARD ${letter} · #${esc(card.job)}</span><button data-action="choose" data-lane="${lane}">Change job</button></div><div class="intro"><div class="identity"><h2>${esc(card.customer)}</h2><p class="location">${esc(card.location)}</p><span class="chip">${state}</span></div>
 ${card.image?`<button class="art" data-action="art" data-lane="${lane}" aria-label="View artwork for ${esc(card.customer)}"><img src="${esc(card.image)}" alt="Artwork for ${esc(card.customer)}" loading="lazy"><span class="art-copy"><strong>View artwork ↗</strong><span>${esc(card.artworkLabel||'Print location reference')}</span></span></button>`:''}</div>${!card.image&&!practice?'<div class="art-missing">Artwork not attached. Ask the printer for the reference.</div>':''}
 <div class="stats"><strong>${s.total}</strong><span>/ ${card.expected} good pieces caught</span></div><div class="progress" aria-label="${s.checked} of ${C.cells(card).length} sizes counted"><i style="width:${C.cells(card).length?s.checked/C.cells(card).length*100:0}%"></i></div><div class="statusline"><span>${s.checked} / ${C.cells(card).length} sizes counted</span><span class="${s.short||s.over?'warning':''}">${s.short?s.short+' short':''}${s.short&&s.over?' · ':''}${s.over?s.over+' extra':''}${!s.short&&!s.over?(s.complete?'All sizes match':'Count each size below'):''}</span></div>
 ${lock?`<p class="warning">${esc(lock)}</p>`:''}
 ${card.groups.map(g=>`<section class="group"><h3>${esc(g.style)}</h3><p>${esc(g.color)}</p><div class="sizes">${g.sizes.map(cell=>{const n=r.counts[cell.id],counted=n!==undefined&&n!==null,exact=counted&&n===cell.expected;return `<div class="size ${exact?'exact':counted?'diff':''}"><button class="size-main" data-action="count" data-lane="${lane}" data-cell="${esc(cell.id)}" ${lock?'disabled':''} aria-label="${esc(g.style+' '+g.color+' '+cell.label)}, expected ${cell.expected}, ${counted?'caught '+n:'not counted'}"><span class="size-label">${exact?'✓ ':''}${esc(cell.label)}</span><span class="size-expected">Expected ${cell.expected}</span><span class="size-actual">${counted?(exact?n+' caught':n+' caught · '+Math.abs(cell.expected-n)+(n<cell.expected?' short':' extra')):'Enter count'}</span></button><button class="size-quick" data-action="exact" data-lane="${lane}" data-cell="${esc(cell.id)}" ${lock?'disabled':''} aria-label="${esc(cell.label)}: confirm all ${cell.expected} caught">${exact?'✓ Count confirmed':'✓ All '+cell.expected+' caught'}</button></div>`;}).join('')}</div></section>`).join('')}
 <div class="actions"><button data-action="issue" data-lane="${lane}" ${lock?'disabled':''}>Flag a problem${r.issues.length?' ('+r.issues.length+')':''}</button><button data-action="history" data-lane="${lane}">History</button></div><button class="primary wide" data-action="finish" data-lane="${lane}" ${lock||!s.complete||r.finishedAt?'disabled':''}>${r.finishedAt?'Location finished ✓':!s.complete?'Count '+s.remaining+' more size'+(s.remaining===1?'':'s'):s.exact?'Finish this location':'Finish with differences'}</button><p class="finish-label">${r.finishedAt?'Saved by '+esc(r.owner)+'. Tap a size to correct a count.':'Counts stay saved when you change jobs.'}</p></section>`;
 }).join('');
 [...$('lanes').children].forEach((el,i)=>{if(renderedIds[i]===db.lanes[i])el.scrollTop=scroll[i]||0;});renderedIds=[...db.lanes];
 $('lanes').querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{img.hidden=true;img.nextElementSibling.lastChild.textContent=' Image unavailable — tap to retry.';},{once:true}));
}
function openPicker(lane){pickerLane=lane;$('picker-title').textContent='Choose location for card '+'AB'[lane];$('search').value='';$('scope').hidden=practice||!manifest.testPreset;$('scope').value=!practice&&db.testFocus?'test':'all';const days=[...new Set(cards.map(c=>c.day).filter(Boolean))];$('day').innerHTML='<option value="">All scheduled days</option>'+days.map(d=>`<option>${esc(d)}</option>`).join('');listJobs();$('picker').showModal();}
function listJobs(){const q=$('search').value.toLowerCase(),day=$('day').value;const testOnly=!practice&&$('scope').value==='test';$('day').hidden=testOnly;const matches=cards.filter(c=>(!testOnly||manifest.testPreset?.runIds.includes(c.runId))&&(testOnly||!day||c.day===day)&&[c.job,c.customer,c.location,...c.groups.map(g=>g.style+' '+g.color)].join(' ').toLowerCase().includes(q));$('job-list').innerHTML=matches.length?matches.map(c=>{const assigned=db.lanes[1-pickerLane]===c.runId;return `<button class="job" data-run="${esc(c.runId)}" ${assigned?'disabled':''}><strong>#${esc(c.job)} · ${esc(c.customer)}</strong><span>${esc(c.location)}</span><span>${c.expected} pieces · ${esc(testOnly?'Invoice 6385 test':c.day||'Example')} ${record(c).finishedAt?'· Location finished':''}</span>${assigned?'<em>Already on the other card</em>':blocked(c)?`<em>${esc(blocked(c))}</em>`:''}</button>`;}).join(''):'<p>No matching locations.</p>';}
function openCount(lane,cellId,fill){const card=cardAt(lane),cell=C.cells(card).find(c=>c.id===cellId),group=card.groups.find(g=>g.sizes.includes(cell)),r=record(card);selection={lane,cellId};$('count-context').textContent='#'+card.job+' · '+card.location;$('count-title').textContent=cell.label+' · '+group.style;$('count-expected').textContent=group.color+' · Expected '+cell.expected;$('actual').value=fill??r.counts[cellId]??'';$('reason').value='';$('correction').hidden=r.counts[cellId]===null||r.counts[cellId]===undefined;$('uncount').hidden=$('correction').hidden;$('count-error').textContent='';$('count-dialog').showModal();}
function saveCount(value,method='actual'){try{const card=cardAt(selection.lane),name=actor(),nextRecord=C.edit(card,record(card),{cellId:selection.cellId,value,actor:name,reason:$('reason').value,method});if(change(next=>{next.actor=name;next.records[card.runId]=nextRecord;}))$('count-dialog').close();}catch(e){$('count-error').textContent=e.message;}}
function exact(lane,cellId){try{const card=cardAt(lane),r=record(card),cell=C.cells(card).find(s=>s.id===cellId);if(r.counts[cellId]===cell.expected){openCount(lane,cellId);return;}if(r.counts[cellId]!==undefined&&r.counts[cellId]!==null){openCount(lane,cellId,cell.expected);return;}const name=actor(),updated=C.edit(card,r,{cellId,value:cell.expected,actor:name,method:'size-check'});change(next=>{next.actor=name;next.records[card.runId]=updated;});}catch(e){tell(e.message);}}
function detail(title,body){$('detail-title').textContent=title;$('detail-body').innerHTML=body;$('detail-dialog').showModal();}
function history(lane){const card=cardAt(lane),r=record(card);detail('#'+card.job+' · Count history',`<p>${esc(card.location)}</p>${r.issues.map(i=>`<div class="history-row warning">${esc(i.type)} · ${i.quantity} ${esc(i.label)}<p>${esc(i.note)}</p><small>${esc(i.actor)} · ${new Date(i.at).toLocaleString()}</small><button data-resolve="${esc(i.id)}" data-lane="${lane}">Resolve problem</button></div>`).join('')}${[...r.history].reverse().map(h=>{const cell=C.cells(card).find(c=>c.id===h.cellId),g=card.groups.find(g=>g.sizes.includes(cell));return `<div class="history-row">${h.type==='count'?esc((g?.style||'')+' '+(g?.color||'')+' '+(cell?.label||'')+': '+(h.from??'uncounted')+' → '+(h.to??'uncounted')):esc(h.type==='finish'?'Finished location · '+h.result:h.type==='issue'?'Problem flagged: '+h.problem:h.type==='resolve'?'Problem resolved':h.type==='reconcile'?'Conflicting counts reviewed':'Catcher handoff')}${h.reason?'<p>'+esc(h.reason)+'</p>':''}<small>${esc(h.actor)} · ${new Date(h.at).toLocaleString()}</small></div>`;}).join('')||'<p>No counts entered yet.</p>'}`);}
function openIssue(lane){issueLane=lane;const card=cardAt(lane);$('issue-context').textContent='#'+card.job+' · '+card.location;$('issue-size').innerHTML=card.groups.flatMap(g=>g.sizes.map(s=>`<option value="${esc(s.id)}">${esc(g.style+' · '+g.color+' · '+s.label)}</option>`)).join('');$('issue-qty').value='1';$('issue-note').value='';$('issue-error').textContent='';$('issue-dialog').showModal();}
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
$('lanes').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const lane=Number(b.dataset.lane),card=cardAt(lane);switch(b.dataset.action){case'choose':openPicker(lane);break;case'count':openCount(lane,b.dataset.cell);break;case'exact':exact(lane,b.dataset.cell);break;case'issue':openIssue(lane);break;case'history':history(lane);break;case'art':detail('#'+card.job+' · Artwork',`<p>${esc(card.location)}</p><p class="muted">${esc(card.artworkLabel)}</p><img class="big-art" src="${esc(card.image)}" alt="${esc(card.location)}">`);break;case'finish':try{const name=actor(),finished=C.finish(card,record(card),name);change(next=>{next.actor=name;next.records[card.runId]=finished;});}catch(e){tell(e.message);}break;}});
$('job-list').addEventListener('click',e=>{const b=e.target.closest('button[data-run]');if(!b)return;if(change(next=>next.lanes[pickerLane]=b.dataset.run))$('picker').close();});
$('search').addEventListener('input',listJobs);$('day').addEventListener('change',listJobs);$('scope').addEventListener('change',listJobs);
$('load-test').addEventListener('click',()=>{if(practice||!manifest.testPreset)return;if(change(next=>{next.lanes=[...manifest.testPreset.lanes];next.testFocus=true;}))tell('Invoice 6385 loaded: 3600M Classic Orange and ST460LS fronts. Use Change job to choose the back or sleeve. Any earlier counts stay saved.');});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));
$('count-form').addEventListener('submit',e=>{e.preventDefault();saveCount($('actual').value);});$('uncount').addEventListener('click',()=>saveCount(null,'clear'));
document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>{const i=$('actual'),v=b.dataset.digit;i.value=v==='clear'?'':v==='back'?i.value.slice(0,-1):(i.value+b.dataset.digit).slice(0,6);$('count-error').textContent='';}));
function updateCatcher(){const name=$('catcher-name').value.trim();if(name===db.actor)return;change(next=>{if(name){for(const id of next.lanes){const r=next.records[id];if(r&&!r.finishedAt){r.history.push({type:'handoff',at:new Date().toISOString(),actor:name,reason:'Taking over from '+(next.actor||'previous catcher')});r.owner=name;r.revision++;}}}next.actor=name;});}
$('catcher-name').addEventListener('change',updateCatcher);$('catcher-name').addEventListener('blur',updateCatcher);
$('issue-form').addEventListener('submit',e=>{e.preventDefault();try{const name=actor(),quantity=C.integer($('issue-qty').value);if(!quantity)throw Error('Enter at least one affected piece.');const card=cardAt(issueLane),cell=C.cells(card).find(s=>s.id===$('issue-size').value),group=card.groups.find(g=>g.sizes.includes(cell));const issue={id:crypto.randomUUID(),cellId:cell.id,label:group.style+' '+group.color+' '+cell.label,type:$('issue-type').value,quantity,note:$('issue-note').value.trim(),actor:name,at:new Date().toISOString()};if(change(next=>{const r=next.records[card.runId]||C.blank(card);r.issues.push(issue);r.history.push({type:'issue',at:issue.at,actor:name,problem:issue.type,reason:issue.note});r.revision++;r.finishedAt=null;next.records[card.runId]=r;next.actor=name;}))$('issue-dialog').close();}catch(err){$('issue-error').textContent=err.message;}});
$('detail-body').addEventListener('click',e=>{const b=e.target.closest('[data-resolve]');if(!b)return;try{const name=actor(),card=cardAt(Number(b.dataset.lane));const issue=record(card).issues.find(i=>i.id===b.dataset.resolve);detail('Resolve problem',`<p>${esc(issue.type+' · '+issue.label)}</p><label for="resolution">What was done?</label><input id="resolution" maxlength="180" placeholder="Reprinted, replaced, or recounted…"><button id="save-resolution" class="primary wide">Save resolution</button>`);$('save-resolution').onclick=()=>{const reason=$('resolution').value.trim();if(!reason){$('resolution').focus();return;}if(change(next=>{const r=next.records[card.runId];r.issues=r.issues.filter(i=>i.id!==issue.id);r.history.push({type:'resolve',actor:name,at:new Date().toISOString(),reason,issueId:issue.id});r.finishedAt=null;r.revision++;}))$('detail-dialog').close();};}catch(err){tell(err.message);}});
$('export').addEventListener('click',()=>{const saved=storageBlocked?localStorage.getItem(key):JSON.stringify({format:'mayhem-catcher-backup',exportedAt:new Date().toISOString(),practice,manifest,db},null,2);download('mayhem-catcher'+(practice?'-practice':'')+'-'+new Date().toISOString().slice(0,10)+'.json',saved||'No saved data','application/json');});
$('practice').addEventListener('click',()=>{practice=!practice;key=practice?DEMO:STORE;cards=practice?examples:manifest.cards;load();render();tell(practice?'Practice mode: these are example jobs. Your scheduled-job counts are kept separate.':'');});
$('reset-practice').addEventListener('click',()=>{if(!practice)return;if(change(next=>{next.archivedPractice??=[];next.archivedPractice.push({at:new Date().toISOString(),records:next.records});next.records={};next.lanes=examples.map(c=>c.runId);next.actor='';})){$('catcher-name').value='';tell('Fresh example jobs. Scheduled-job counts are unchanged.');}});
$('help').addEventListener('click',()=>detail('Catch. Count. Confirm.',`<ol class="help-list"><li>Enter your name and choose up to two print locations.</li><li>Count the bundle by size. Tap <strong>✓ All caught</strong> when it matches, or tap the size to enter the actual total.</li><li>Enter <strong>0</strong> when you counted none. An empty size means it has not been counted yet.</li><li>Flag damaged blanks or print problems separately. Good-piece counts do not include those pieces.</li><li>Finish each location when every size is counted. Short or extra counts stay flagged.</li><li>Changing jobs keeps your counts. Changing the catcher’s name records a handoff.</li></ol><p><strong>This trial saves on this device only.</strong> Use one tab and keep a backup. Shared saves and office comparison with Printavo receiving are not connected yet.</p><p>The order sizes are a dated snapshot. Printer completion and receiving status are not changed by this app.</p>`));
addEventListener('storage',e=>{if(e.key!==key)return;storageBlocked=true;tell('Another tab changed these counts. Reload this tab before entering more; your edits have not been overwritten.');});
async function init(){try{const r={ok:true,json:async()=>JSON.parse($('catcher-data').textContent)};if(!r.ok)throw Error('Could not load catcher cards.');manifest=await r.json();cards=manifest.cards;load();render();try{const w=await fetch('../data/week.json',{cache:'no-store'});if(w.ok){const latest=await w.json(),rows=C.scheduleRows(latest),map=new Map(rows.map(r=>[r.id,r]));for(const card of cards){const live=map.get(card.scheduleRowId||card.id);if(!live)card.blocked='This location is no longer on the current schedule. Review it before continuing.';else if(live.scheduleSignature!==card.scheduleSignature)card.blocked='This run changed on the schedule. Its size breakdown needs a refresh.';else card.day=live.day;}if(latest.week!==manifest.week){for(const card of cards)card.blocked='A new schedule week is available. Refresh the order-size data before counting.';tell('The schedule has changed weeks. Saved counts are preserved; order sizes need refreshing.');}render();}}catch(e){tell('Schedule could not be checked. Showing the saved order-size snapshot.');}}catch(e){tell(e.message+' Reload when connected.');}}
init();
</script></body></html>
