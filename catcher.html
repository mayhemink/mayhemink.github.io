<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catcher">
<meta name="theme-color" content="#0c0d0f">
<title>Mayhem Ink — Catcher</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* CATCHER v2 — same system as the Press Board v4. Two lanes = the two presses. Each lane follows
   whatever is printing on that press (from the shared press state) unless the catcher pins a card. */
:root{--bg:#0c0d0f;--bg2:#0f1113;--panel:#16191c;--panel2:#1a1d21;--line:#23272c;--hard:#353b42;--sub:#aab1b7;--mut:#8a9096;--dim:#5d646b;
 --lime:#c6ff3d;--limeD:#1a2210;--red:#ff5a36;--redD:#2a1511;--amber:#ffb020;--green:#3ddc84;--greenD:#12301f;
 --bc:'Barlow Condensed','Avenir Next Condensed','Arial Narrow',Arial,sans-serif;--in:Inter,-apple-system,'Helvetica Neue',Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#f2f2f2;overflow:hidden}
body{font-family:var(--in);-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;-webkit-user-select:text;user-select:text}
img{display:block}.hide{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#top{height:62px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.badge{font:800 28px/1 var(--bc);letter-spacing:.04em;background:#fff;color:var(--bg);padding:5px 12px 4px;border-radius:8px}
.pb{font:800 24px/1 var(--bc);letter-spacing:.03em;background:var(--lime);color:var(--bg);padding:4px 10px 3px;border-radius:7px}
.chip{font:700 15px var(--in);padding:8px 13px;border-radius:99px;background:var(--panel2);display:flex;gap:7px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--lime)}.chip.none{color:var(--mut)}.chip.none i{background:var(--dim)}
.tabs{display:flex;gap:4px;margin-left:6px}.tab{font:800 19px var(--bc);letter-spacing:.07em;color:var(--mut);padding:7px 13px;border-radius:8px}.tab.on{background:#1f2327;color:#fff}
.clock{margin-left:auto;font:700 25px var(--mono)}.dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}
#main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}.view.on{display:flex}
/* belt */
#v-belt{display:none}#v-belt.on{display:grid;grid-template-columns:1fr 1fr}
.lane{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}.lane:last-child{border-right:0}
.lh{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.lh .mode{font:800 15px var(--bc);letter-spacing:.12em;color:var(--mut)}.lh .mode.pin{color:var(--amber)}
.lh .sw{margin-left:auto;font:800 16px var(--bc);letter-spacing:.08em;color:var(--lime);border:1.5px solid #c6ff3d55;border-radius:7px;padding:6px 10px}
.lbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 20px;display:flex;flex-direction:column;gap:10px}
.idc{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start}
.idc .th{width:120px;height:120px;object-fit:contain;background:#fff;border-radius:8px}
.idc .th.none{background:var(--panel2);display:flex;align-items:center;justify-content:center;font:800 13px var(--bc);color:var(--dim);letter-spacing:.1em}
.st{font:800 15px var(--bc);letter-spacing:.12em;color:var(--lime)}.st.setup{color:var(--amber)}.st.idle{color:var(--mut)}.st.done{color:var(--green)}.st.pause{color:var(--red)}
.jn{font:800 44px/.95 var(--bc)}.jn span{font:700 17px var(--bc);color:var(--mut);letter-spacing:.04em;margin-left:6px;text-transform:uppercase}
.loc{font:800 25px/1.02 var(--bc);text-transform:uppercase;margin-top:3px}
.cust{font:600 13px var(--in);color:var(--sub);margin-top:3px}
.tot{display:flex;align-items:baseline;gap:10px}
.tot b{font:800 58px/1 var(--bc)}.tot span{font:800 22px var(--bc);color:var(--mut);letter-spacing:.04em}
.tot .flag{margin-left:auto;font:800 18px var(--bc);letter-spacing:.08em}
.bar{height:10px;background:var(--hard);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime)}
.grp{border:3px solid var(--hard);border-radius:6px;overflow:hidden}
.grp h4{font:800 17px var(--bc);letter-spacing:.08em;padding:6px 10px;background:var(--panel2);display:flex;gap:8px}
.grp h4 small{color:var(--mut);font-weight:700;margin-left:auto}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:3px;background:var(--hard)}
.sz{background:var(--panel);display:flex;flex-direction:column;align-items:center;padding:8px 4px 0;min-width:0}
.sz .l{font:800 26px/1 var(--bc)}.sz .e{font:700 12px var(--bc);letter-spacing:.1em;color:var(--mut);margin-top:2px}
.sz .n{margin:6px 0 6px;min-width:78%;padding:6px 4px;border-radius:7px;background:var(--bg2);border:2px solid var(--hard);font:800 30px/1 var(--bc);text-align:center}
.sz .n.empty{color:var(--dim);font-size:16px;padding:12px 4px}
.sz .all{width:100%;padding:9px 2px;font:800 15px var(--bc);letter-spacing:.06em;color:var(--lime);background:var(--limeD);border-top:2px solid var(--hard)}
.sz.ok{background:var(--greenD)}.sz.ok .n{border-color:var(--green);color:var(--green)}.sz.ok .all{color:var(--green);background:#0f2718}
.sz.off .n{border-color:var(--amber);color:var(--amber)}
.checks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ck{padding:12px 4px;border-radius:8px;background:var(--panel);border:2px solid var(--hard);font:800 15px/1.05 var(--bc);letter-spacing:.06em;text-align:center;color:var(--sub)}
.ck.on{border-color:var(--green);color:var(--green);background:var(--greenD)}
.ck.photo{border-color:var(--amber);color:var(--amber)}.ck.photo.on{border-color:var(--green);color:var(--green)}
.note{border-left:5px solid var(--lime);background:var(--limeD);color:#e6f7c9;border-radius:4px;padding:7px 11px;font:700 16px/1.15 var(--bc);text-transform:uppercase}
.issues{font:700 14px var(--in);color:#ffd4c8;background:var(--redD);border-left:5px solid var(--red);border-radius:4px;padding:8px 10px}
.row{display:flex;gap:8px}
.lbody>.btn{flex:none}
.btn{flex:1;padding:14px 10px;min-height:56px;border-radius:10px;background:var(--panel2);border:2px solid var(--line);font:800 20px var(--bc);letter-spacing:.06em;color:#dfe3e6}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--bg)}.btn.done{background:var(--greenD);border-color:var(--green);color:var(--green)}
.btn:disabled{opacity:.4}.btn.red{color:var(--red);border-color:#ff5a3666}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px}
.empty h2{font:800 48px/.95 var(--bc)}.empty h2 span{color:var(--lime)}.empty p{font:600 16px/1.5 var(--in);color:var(--sub);max-width:420px}
/* week */
#v-week{flex-direction:column}
.wt{flex:none;padding:12px 16px 8px;display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.day{flex:1;min-width:92px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:7px 6px;text-align:center;font:800 20px var(--bc)}
.day small{display:block;font:700 12px var(--in);color:var(--mut)}.day.on{border-color:#fff;background:#1f2327}
.wb{flex:1;overflow-y:auto;padding:12px 16px 30px}
.wr{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;width:100%;text-align:left}
.wr img,.wr .th{width:64px;height:64px;border-radius:6px;object-fit:cover;background:#fff}.wr .th{background:var(--panel2)}
.wr b{font:800 22px/1 var(--bc);display:block}.wr p{font:600 13px var(--in);color:var(--sub);margin-top:3px}
.pill{font:800 14px var(--bc);letter-spacing:.1em;padding:5px 10px;border-radius:5px;background:var(--panel2);color:var(--mut);white-space:nowrap}
.pill.go{background:var(--amber);color:#111}.pill.ok{background:var(--greenD);color:var(--green)}.pill.diff{background:var(--red);color:#fff}
/* modal */
.md{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:#050607d9;padding:16px}.md.on{display:flex}
.sheet{width:min(560px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:3px solid var(--hard);border-radius:16px;padding:22px}
.sheet h3{font:800 40px/1 var(--bc);text-transform:uppercase}.sheet p.s{font:700 16px var(--bc);letter-spacing:.06em;color:var(--mut);margin:6px 0 12px}
.num{width:100%;background:#fff;color:#111;border-radius:10px;border:0;font:800 56px var(--bc);text-align:center;padding:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pad button{padding:16px 0;border-radius:10px;background:var(--bg2);border:2px solid var(--hard);font:800 32px var(--bc)}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opt{flex:1 1 30%;min-width:130px;padding:14px 8px;border-radius:10px;background:var(--bg2);border:3px solid var(--hard);font:800 22px var(--bc);text-align:center}
.opt.on{border-color:var(--lime);color:var(--lime)}.opt small{display:block;font:700 12px var(--in);color:var(--mut)}
.fld{display:flex;flex-direction:column;gap:5px;margin:10px 0}.fld label{font:800 14px var(--bc);letter-spacing:.14em;color:var(--mut)}
.fld input,.fld select{background:var(--bg2);border:2px solid var(--hard);border-radius:8px;color:#fff;padding:10px 12px;font:600 18px var(--in)}
.row2{display:flex;gap:10px;margin-top:14px}.row2 button{flex:1;height:70px;border-radius:12px;font:800 28px var(--bc);letter-spacing:.04em;background:#23272c}.row2 .y{background:var(--lime);color:var(--bg)}
.ov{position:fixed;inset:0;z-index:50;display:none;background:#050607f5}.ov.on{display:flex}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 30%,#1a1f14,transparent 60%)}
.center h2{font:800 96px/.88 var(--bc);margin:14px 0 8px}.center h2 span{color:var(--lime)}.center .sub{font:800 20px var(--bc);letter-spacing:.08em;color:var(--mut)}
.names{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:26px 0;max-width:900px}
.nm{min-width:170px;height:110px;padding:0 20px;border-radius:14px;background:var(--panel);border:3px solid var(--hard);font:800 34px var(--bc)}
#toast{position:fixed;top:72px;right:18px;background:#fff;color:#111;padding:12px 22px;border-radius:99px;font:800 17px var(--in);z-index:99;display:none;box-shadow:0 8px 30px #000a}
#lightbox{display:none;position:fixed;inset:0;background:#000f;z-index:90;overflow:auto}#lightbox img{display:block;margin:40px auto;width:96%;background:#fff}
#lightbox button{position:fixed;top:12px;right:14px;font:800 22px var(--bc);color:#111;background:var(--lime);border-radius:10px;padding:10px 18px}
@media (orientation:portrait){
 #v-belt.on{grid-template-columns:1fr}
 .lane.hideP{display:none}
 .lane{border-right:0}
 .tclock{display:none}
}
</style>
</head>
<body>
<div id="app"><div id="top"></div><div id="main">
 <div class="view" id="v-belt"></div>
 <div class="view" id="v-week"></div>
</div></div>
<div class="ov" id="ov-name"></div>
<div class="md" id="md" onclick="if(event.target===this)closeMd()"><div class="sheet" id="mdbox"></div></div>
<div id="toast"></div>
<div id="lightbox" onclick="this.style.display='none'"><button>CLOSE</button><img id="lbimg" alt=""></div>
<script>
"use strict";
// ============================== CATCHER v2 ==============================
// Sizes come from /data/catcher.json (built every weekend with the press board, same commit
// as /data/week.json). Live press status + shared catcher records ride the press-state worker:
// each location's catch is a virtual record "cat_<rowId>" (notes = JSON, last write wins), so
// the press board and the office can see counts, and nothing is trapped on one iPad.
var APP_V = "2.0.0";
var SYNC_URL = "https://mayhem-press-state.autumn-mountain-14c6.workers.dev", SYNC_KEY = "wVUsmD1WhcoLlb_wDMuDDlXCZx2QsnT0";
var PRESSES = ["Press 1","Press 2"];
var MAN = null, WEEK = null, CARDS = [], BYID = {}, ROWS = {}, IMG = {}, REMOTE = {}, LASTOK = 0, LASTMAN = "", LASTWK = "";
var VIEW = "belt", WDAY = "", PLANE = 0;   // PLANE = lane shown in portrait
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ if(v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
function now(){ return Date.now(); }
function today(){ var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function fmt(ts){ var d = new Date(ts), h = d.getHours(), m = d.getMinutes(); return (h % 12 || 12) + ":" + String(m).padStart(2,"0") + (h >= 12 ? " PM" : " AM"); }
function hm(ms){ var m = Math.max(0, Math.floor(ms/60000)); return Math.floor(m/60) + ":" + String(m%60).padStart(2,"0"); }
function toast(t){ var e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(function(){ e.style.display = "none"; }, 2400); }
function dow(d){ return new Date(d + "T12:00:00").toLocaleDateString("en-US", {weekday:"short"}).toUpperCase(); }
function md(d){ var x = new Date(d + "T12:00:00"); return (x.getMonth()+1) + "/" + x.getDate(); }

// ---------- catcher name ----------
function catcher(){ var n = lsGet("catcher_name_" + today()); return n || null; }
function setCatcher(n){ lsSet("catcher_name_" + today(), n); var r = JSON.parse(lsGet("catcher_recent") || "[]").filter(function(x){ return x !== n; }); r.unshift(n); lsSet("catcher_recent", JSON.stringify(r.slice(0, 8))); render(); }
function renderName(){
  var el = $("ov-name");
  if(catcher() || !MAN){ el.classList.remove("on"); return; }
  var names = JSON.parse(lsGet("catcher_recent") || "[]");
  (WEEK && WEEK.printers || []).forEach(function(p){ if(names.indexOf(p) === -1) names.push(p); });
  el.innerHTML = '<div class="center"><div class="badge">CATCHER</div><h2>WHO&#39;S <span>CATCHING?</span></h2><div class="sub">TAP YOUR NAME — IT GOES ON EVERY COUNT TODAY</div><div class="names">' +
    names.map(function(n){ return '<button class="nm" onclick="setCatcher(\'' + esc(n).replace(/'/g, "\\'") + '\')">' + esc(n.toUpperCase()) + '</button>'; }).join("") +
    '<button class="nm" style="color:var(--lime)" onclick="askName()">+ SOMEONE ELSE</button></div></div>';
  el.classList.add("on");
}
function askName(){
  openMd('<h3>Your name</h3><div class="fld"><input id="nm-in" maxlength="40" placeholder="First name"></div><div class="row2"><button onclick="closeMd()">CANCEL</button><button class="y" onclick="var v=$(\'nm-in\').value.trim();if(v){closeMd();setCatcher(v);}">SAVE</button></div>');
  setTimeout(function(){ var i = $("nm-in"); if(i) i.focus(); }, 50);
}

// ---------- records (local first, synced) ----------
function recKey(){ return "catcher_v2_" + (MAN ? MAN.week : "x"); }
var LOCAL = {};
function loadLocal(){ try{ LOCAL = JSON.parse(lsGet(recKey()) || "{}"); }catch(e){ LOCAL = {}; } }
function saveLocal(){ lsSet(recKey(), JSON.stringify(LOCAL)); }
function fp(card){ return JSON.stringify(card.groups.map(function(g){ return g.sizes.map(function(s){ return [s.id, s.expected]; }); })); }
function rec(card){
  var id = card.id, L = LOCAL[id], R = REMOTE[id];
  var r = (R && (!L || (R.at || 0) > (L.at || 0))) ? R : L;
  if(!r) r = {counts:{}, checks:{}, issues:[], hist:[], finishedAt:null, by:"", at:0, fp:fp(card)};
  r.counts = r.counts || {}; r.checks = r.checks || {}; r.issues = r.issues || []; r.hist = r.hist || [];
  return r;
}
var DIRTY = {};
function write(card, r, what){
  r.at = now(); r.by = catcher() || r.by || "";
  r.fp = r.fp || fp(card);
  if(what) r.hist = r.hist.concat([{at:r.at, by:r.by, w:what}]).slice(-40);
  LOCAL[card.id] = JSON.parse(JSON.stringify(r)); saveLocal();
  DIRTY[card.id] = 1; push();
  render();
}
function sumOf(card, r){
  var cells = [], total = 0, counted = 0, short = 0, over = 0;
  card.groups.forEach(function(g){ g.sizes.forEach(function(s){ cells.push(s); var n = r.counts[s.id]; if(n != null){ counted++; total += n; short += Math.max(0, s.expected - n); over += Math.max(0, n - s.expected); } }); });
  var mis = r.issues.reduce(function(a, i){ return a + (i.qty || 0); }, 0);
  return {cells:cells.length, counted:counted, total:total, short:short, over:over, complete:cells.length > 0 && counted === cells.length, exact:counted === cells.length && !short && !over, mis:mis};
}
function checksReady(card, r){ var q = r.checks; return !!(q.photo && q.spell && q.print && (q.mock || !card.image)); }

// ---------- network ----------
function sf(path, opts){ opts = opts || {}; opts.headers = {"Content-Type":"application/json", "X-Press-Key":SYNC_KEY}; return fetch(SYNC_URL + path, opts).then(function(r){ return r.json(); }); }
function devId(){ var d = lsGet("catcher_device"); if(!d){ d = "catcher-" + Math.random().toString(36).slice(2, 9); lsSet("catcher_device", d); } return d; }
var PULLING = false;
function pull(){
  if(!MAN || PULLING) return; PULLING = true;
  sf("/state?week=" + encodeURIComponent(MAN.week) + "&k=" + SYNC_KEY, {method:"GET"}).then(function(j){
    PULLING = false;
    if(!j || !j.ok || !j.state) return;
    ROWS = j.state.rows || {}; LASTOK = now();
    var changed = false;
    for(var id in ROWS){
      if(id.indexOf("cat_") !== 0) continue;
      var x = ROWS[id]; if(!x || !x.notes) continue;
      try{ var o = JSON.parse(x.notes); var k = id.slice(4); if(!REMOTE[k] || REMOTE[k].at !== o.at){ REMOTE[k] = o; changed = true; } }catch(e){}
    }
    if(!busy()) render(); else renderTop();
  })["catch"](function(){ PULLING = false; renderTop(); });
}
function push(){
  Object.keys(DIRTY).forEach(function(id){
    var r = LOCAL[id]; if(!r){ delete DIRTY[id]; return; }
    var t = now();
    var row = {id:"cat_" + id, printer:null, pauses:[], handoffs:[], notes:JSON.stringify(r), _mt:{notes:t}};
    sf("/tap", {method:"POST", body:JSON.stringify({week:MAN.week, deviceId:devId(), press:"Catcher", row:row})})
      .then(function(j){ if(j && j.ok){ delete DIRTY[id]; REMOTE[id] = r; } })["catch"](function(){});
  });
}
setInterval(function(){ pull(); push(); }, 12000);

// ---------- press status for a row ----------
function pstat(rowId){
  var x = ROWS[rowId]; if(!x) return {s:"idle"};
  var pz = x.pauses || [], open = null, base = {};
  pz.forEach(function(p){ if(p && p.at && p.k != null){ base[p.k] = base[p.k] || {}; if(p.end !== undefined) base[p.k].end = p.end; if(p.deleted) base[p.k].del = 1; } });
  pz.forEach(function(p){ if(p && p.start && !(p.k != null && p.at)){ var b = base[p.start] || {}; var end = b.end !== undefined ? b.end : p.end; if(!end && !b.del) open = p; } });
  var who = x.printBy || x.printer || "";
  if(x.jobDone) return {s:"done", who:who, press:x.press, at:x.jobDone};
  if(open) return {s:"pause", who:who, press:x.press, reason:open.reason};
  if(x.setupDone) return {s:"print", who:who, press:x.press, at:x.setupDone};
  if(x.setupStart) return {s:"setup", who:who, press:x.press, at:x.setupStart};
  return {s:"idle"};
}
// what the lane shows: pinned card, else what's printing on that press, else the last one it followed
function laneCard(i){
  var P = PRESSES[i], pin = lsGet("catcher_pin_" + i);
  if(pin && BYID[pin]) return {card:BYID[pin], pinned:true};
  var best = null, bt = 0;
  CARDS.forEach(function(c){ var p = pstat(c.id); if(p.press === P && (p.s === "print" || p.s === "pause" || p.s === "setup")){ var t = p.at || 1; if(t > bt){ bt = t; best = c; } } });
  if(best){ lsSet("catcher_last_" + i, best.id); return {card:best, pinned:false}; }
  var last = lsGet("catcher_last_" + i);
  if(last && BYID[last]){ var r = rec(BYID[last]); if(!r.finishedAt) return {card:BYID[last], pinned:false, stale:true}; }
  return {card:null};
}

// ---------- load ----------
function load(first){
  Promise.all([
    fetch("/data/catcher.json?v=" + now(), {cache:"no-store"}).then(function(r){ if(!r.ok) throw Error("HTTP " + r.status); return r.text(); }),
    fetch("/data/week.json?v=" + now(), {cache:"no-store"}).then(function(r){ return r.ok ? r.text() : ""; })["catch"](function(){ return ""; })
  ]).then(function(t){
    if(t[0] === LASTMAN && t[1] === LASTWK) return;
    LASTMAN = t[0]; LASTWK = t[1];
    MAN = JSON.parse(t[0]); WEEK = t[1] ? JSON.parse(t[1]) : null;
    if(WEEK && WEEK.week !== MAN.week) WEEK = null;
    IMG = {}; var rows = {};
    if(WEEK){ IMG = WEEK.img || {}; WEEK.days.forEach(function(d){ d.rows.forEach(function(r){ rows[r.id] = r; }); }); }
    CARDS = MAN.cards.map(function(c){ var x = JSON.parse(JSON.stringify(c)); var w = rows[c.id]; if(w){ x.day = x.day || w._day; x.inks = w.inks || null; x.alert = w.alert || ""; } return x; });
    BYID = {}; CARDS.forEach(function(c){ BYID[c.id] = c; });
    loadLocal(); migrate();
    var t0 = today(); if(!WDAY || !MAN.days.some(function(d){ return d.day === WDAY; })) WDAY = MAN.days.some(function(d){ return d.day === t0; }) ? t0 : MAN.days[0].day;
    if(!first) toast("Cards updated");
    pull(); render();
  })["catch"](function(e){ if(first) $("main").innerHTML = '<div class="empty"><h2>NO <span>CARDS</span></h2><p>Couldn&#39;t load the catcher cards (' + esc(e.message) + '). Check the wifi — it retries on its own.</p></div>'; });
}
// bring over counts from the v1 catcher (same runIds for carried-over cards)
function migrate(){
  if(lsGet("catcher_migrated_" + MAN.week)) return;
  try{
    var old = JSON.parse(lsGet("mayhem-catcher-v1") || "null");
    if(old && old.records){
      CARDS.forEach(function(c){
        var o = old.records[c.runId]; if(!o || LOCAL[c.id]) return;
        if(!Object.keys(o.counts || {}).length) return;
        LOCAL[c.id] = {counts:o.counts, checks:{photo:!!(o.checks||{}).photo, spell:!!(o.checks||{}).spelling, mock:!!(o.checks||{}).mockup, print:!!(o.checks||{}).print}, issues:(o.issues||[]).map(function(i){ return {cell:i.cellId, type:i.type, qty:i.quantity, note:i.note, by:i.actor, at:Date.parse(i.at) || 0}; }), hist:[], finishedAt:o.finishedAt ? Date.parse(o.finishedAt) : null, by:o.owner || "", at:1, fp:fp(c)};
      });
      saveLocal();
    }
  }catch(e){}
  lsSet("catcher_migrated_" + MAN.week, "1");
}
setInterval(function(){ if(!busy()) load(false); }, 60000);
setInterval(function(){ fetch("/data/app-catcher.json?v=" + now(), {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){ if(j && j.v && j.v !== APP_V && !busy()) location.reload(); })["catch"](function(){}); }, 300000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden){ load(false); pull(); wake(); } });
var WL = null;
function wake(){ try{ if(WL || !navigator.wakeLock) return; navigator.wakeLock.request("screen").then(function(l){ WL = l; l.addEventListener("release", function(){ WL = null; }); })["catch"](function(){}); }catch(e){} }
document.addEventListener("pointerdown", wake, {passive:true});

// ---------- render ----------
function busy(){ return $("md").classList.contains("on") || $("lightbox").style.display === "block"; }
function render(){
  if(!MAN) return;
  renderTop();
  $("v-belt").classList.toggle("on", VIEW === "belt"); $("v-week").classList.toggle("on", VIEW === "week");
  if(VIEW === "belt") renderBelt(); else renderWeek();
  renderName();
}
function renderTop(){
  var c = catcher();
  var h = '<div class="badge">CATCHER</div><button class="chip ' + (c ? "" : "none") + '" onclick="lsSet(\'catcher_name_\'+today(),null);render()"><i></i>' + esc(c || "Tap in") + '</button>' +
    '<div class="tabs"><button class="tab ' + (VIEW === "belt" ? "on" : "") + '" onclick="VIEW=\'belt\';render()">ON THE BELT</button><button class="tab ' + (VIEW === "week" ? "on" : "") + '" onclick="VIEW=\'week\';render()">WEEK</button></div>' +
    '<div class="clock tclock">' + fmt(now()).replace(/ (AM|PM)/, "") + '</div><div class="dot ' + (LASTOK && now() - LASTOK < 60000 ? "ok" : (LASTOK ? "bad" : "")) + '"></div>';
  $("top").innerHTML = h;
}
function renderBelt(){
  var el = $("v-belt"), keep = [].map.call(el.querySelectorAll(".lbody"), function(b){ return b.scrollTop; });
  var h = "";
  [0,1].forEach(function(i){
    var L = laneCard(i), P = PRESSES[i];
    h += '<div class="lane' + (PLANE !== i ? " hideP" : "") + '"><div class="lh"><div class="pb">' + P.toUpperCase() + '</div>' +
      '<span class="mode ' + (L.pinned ? "pin" : "") + '">' + (L.pinned ? "PINNED" : (L.card ? (L.stale ? "LAST RUN ON THIS PRESS" : "FOLLOWING THE PRESS") : "")) + '</span>' +
      '<button class="sw" onclick="PLANE=' + (1 - i) + ';render()" style="display:none" data-p>' + PRESSES[1-i].toUpperCase() + ' →</button>' +
      (L.pinned ? '<button class="sw" onclick="lsSet(\'catcher_pin_' + i + '\',null);render()">FOLLOW PRESS</button>' : '<button class="sw" onclick="pickFor(' + i + ')">PICK A CARD</button>') + '</div>';
    h += '<div class="lbody">' + (L.card ? laneHtml(L.card, i) : '<div class="empty"><h2>WAITING ON <span>' + P.toUpperCase() + '</span></h2><p>When the printer taps SETUP DONE on ' + P + ', that run shows up here on its own. Or pick a card.</p><button class="btn lime" style="flex:none;padding:14px 24px" onclick="pickFor(' + i + ')">PICK A CARD</button></div>') + '</div></div>';
  });
  el.innerHTML = h;
  if(window.matchMedia("(orientation:portrait)").matches) [].forEach.call(el.querySelectorAll("[data-p]"), function(b){ b.style.display = "block"; });
  [].forEach.call(el.querySelectorAll(".lbody"), function(b, i){ b.scrollTop = keep[i] || 0; });
}
function laneHtml(c, lane){
  var r = rec(c), s = sumOf(c, r), p = pstat(c.id), img = c.image || "";
  var stl = {idle:["idle","NOT STARTED ON PRESS"], setup:["setup","SETTING UP"], print:["","● PRINTING"], pause:["pause","❚❚ STOPPED" + (p.reason ? " · " + p.reason.toUpperCase() : "")], done:["done","✓ PRESS DONE"]}[p.s];
  var h = '<div class="idc">' + (img ? '<img class="th" src="' + esc(img) + '" onclick="lb(this.src)">' : '<div class="th none">NO ART</div>') +
    '<div style="min-width:0"><div class="st ' + stl[0] + '">' + stl[1] + (p.who ? " · " + esc(p.who.toUpperCase()) : "") + (p.s === "print" ? " · " + hm(now() - p.at) : "") + '</div>' +
    '<div class="jn">#' + esc(c.job) + '<span>' + esc(c.customer) + '</span></div><div class="loc">' + esc(c.locationLabel || c.location) + '</div>' +
    '<div class="cust">' + esc(c.location) + '</div></div></div>';
  if(c.note) h += '<div class="note">' + esc(c.note) + '</div>';
  var col = s.complete ? (s.exact ? "var(--green)" : "var(--amber)") : "var(--mut)";
  h += '<div class="tot"><b>' + s.total + '</b><span>/ ' + c.expected + ' CAUGHT</span><span class="flag" style="color:' + col + '">' +
    (s.short ? s.short + " SHORT " : "") + (s.over ? s.over + " OVER " : "") + (s.complete && s.exact ? "✓ ALL SIZES MATCH" : (!s.short && !s.over ? (s.cells - s.counted) + " SIZES LEFT" : "")) + '</span></div>' +
    '<div class="bar"><i style="width:' + (c.expected ? Math.min(100, s.total / c.expected * 100) : 0) + '%;background:' + (s.over ? "var(--amber)" : "var(--lime)") + '"></i></div>';
  c.groups.forEach(function(g){
    var gt = g.sizes.reduce(function(a, x){ return a + x.expected; }, 0);
    h += '<div class="grp"><h4>' + esc(g.style) + ' · ' + esc(String(g.color || "").toUpperCase()) + '<small>' + gt + ' PCS</small></h4><div class="sizes">';
    g.sizes.forEach(function(sz){
      var n = r.counts[sz.id], has = n != null, ok = has && n === sz.expected;
      h += '<div class="sz ' + (ok ? "ok" : has ? "off" : "") + '"><div class="l">' + (ok ? "✓ " : "") + esc(sz.label) + '</div><div class="e">EXPECT ' + sz.expected + '</div>' +
        '<button class="n ' + (has ? "" : "empty") + '" onclick="openCount(\'' + c.id + '\',\'' + esc(sz.id) + '\')">' + (has ? n : "TAP TO COUNT") + '</button>' +
        '<button class="all" onclick="allCaught(\'' + c.id + '\',\'' + esc(sz.id) + '\')">' + (ok ? "✓ COUNTED" : "✓ ALL " + sz.expected) + '</button></div>';
    });
    h += '</div></div>';
  });
  var q = r.checks;
  h += '<div class="checks">' +
    '<button class="ck photo ' + (q.photo ? "on" : "") + '" onclick="tog(\'' + c.id + '\',\'photo\')">📷 PICTURE<br>TAKEN</button>' +
    '<button class="ck ' + (q.spell ? "on" : "") + '" onclick="tog(\'' + c.id + '\',\'spell\')">SPELLED<br>RIGHT</button>' +
    (c.image ? '<button class="ck ' + (q.mock ? "on" : "") + '" onclick="tog(\'' + c.id + '\',\'mock\')">MATCHES<br>MOCKUP</button>' : '<div class="ck" style="opacity:.4">NO<br>MOCKUP</div>') +
    '<button class="ck ' + (q.print ? "on" : "") + '" onclick="tog(\'' + c.id + '\',\'print\')">PRINT<br>LOOKS GOOD</button></div>';
  if(r.issues.length) h += '<div class="issues">⚠ ' + r.issues.map(function(i){ return i.qty + " × " + esc(i.type) + (i.label ? " (" + esc(i.label) + ")" : "") + (i.note ? " — " + esc(i.note) : ""); }).join("<br>⚠ ") + '</div>';
  var ready = s.complete && checksReady(c, r);
  h += '<div class="row"><button class="btn red" onclick="openIssue(\'' + c.id + '\')">⚠ MISPRINT / PROBLEM' + (s.mis ? " (" + s.mis + ")" : "") + '</button><button class="btn" onclick="openHist(\'' + c.id + '\')">HISTORY</button></div>';
  if(r.finishedAt) h += '<button class="btn done" onclick="reopen(\'' + c.id + '\')">✓ LOCATION FINISHED ' + fmt(r.finishedAt) + (r.by ? " · " + esc(r.by.toUpperCase()) : "") + '</button>';
  else h += '<button class="btn ' + (ready ? "lime" : "") + '" ' + (ready ? "" : "disabled") + ' onclick="finishLoc(\'' + c.id + '\',' + lane + ')">' +
    (!s.complete ? "COUNT " + (s.cells - s.counted) + " MORE SIZE" + (s.cells - s.counted === 1 ? "" : "S") : !checksReady(c, r) ? "FINISH THE CHECKS ABOVE" : (s.exact ? "FINISH THIS LOCATION ✓" : "FINISH WITH DIFFERENCES")) + '</button>';
  return h;
}
function lb(src){ $("lbimg").src = src; $("lightbox").style.display = "block"; }

// ---------- actions ----------
function need(){ if(!catcher()){ renderName(); toast("Tap your name first"); return false; } return true; }
function tog(id, k){ if(!need()) return; var c = BYID[id], r = rec(c); r.checks[k] = !r.checks[k]; if(!r.checks[k]) r.finishedAt = null; write(c, r, k + (r.checks[k] ? " ✓" : " ✗")); }
function allCaught(id, cell){
  if(!need()) return; var c = BYID[id], r = rec(c), sz = findCell(c, cell);
  if(r.counts[cell] != null && r.counts[cell] !== sz.expected) return openCount(id, cell, sz.expected);
  r.counts[cell] = sz.expected; r.finishedAt = null; write(c, r, sz.label + " = " + sz.expected + " (all)");
}
function findCell(c, cell){ var f = null; c.groups.forEach(function(g){ g.sizes.forEach(function(s){ if(s.id === cell) f = s; }); }); return f; }
var CNT = null;
function openCount(id, cell, prefill){
  if(!need()) return; var c = BYID[id], r = rec(c), sz = findCell(c, cell), g = c.groups.filter(function(x){ return x.sizes.indexOf(sz) > -1; })[0];
  CNT = {id:id, cell:cell, v:String(prefill != null ? prefill : (r.counts[cell] != null ? r.counts[cell] : ""))};
  openMd('<h3>' + esc(sz.label) + ' · ' + esc(g.style) + '</h3><p class="s">' + esc(String(g.color).toUpperCase()) + ' · EXPECT ' + sz.expected + ' · GOOD PIECES ONLY</p>' +
    '<div class="num" id="cnt-v">' + (CNT.v || "&nbsp;") + '</div><div class="pad">' +
    [1,2,3,4,5,6,7,8,9,"CLR",0,"⌫"].map(function(k){ return '<button onclick="padKey(\'' + k + '\')">' + k + '</button>'; }).join("") + '</div>' +
    '<div class="row2"><button onclick="clearCount()">UNCOUNT</button><button class="y" onclick="saveCount()">SAVE</button></div>');
}
function padKey(k){ if(k === "CLR") CNT.v = ""; else if(k === "⌫") CNT.v = CNT.v.slice(0, -1); else CNT.v = (CNT.v + k).replace(/^0+(?=\d)/, "").slice(0, 5); $("cnt-v").innerHTML = CNT.v || "&nbsp;"; }
function saveCount(){ if(CNT.v === ""){ toast("Enter a number — 0 if none"); return; } var c = BYID[CNT.id], r = rec(c), sz = findCell(c, CNT.cell), prev = r.counts[CNT.cell]; r.counts[CNT.cell] = Number(CNT.v); r.finishedAt = null; closeMd(); write(c, r, sz.label + ": " + (prev == null ? "—" : prev) + " → " + CNT.v); }
function clearCount(){ var c = BYID[CNT.id], r = rec(c), sz = findCell(c, CNT.cell); delete r.counts[CNT.cell]; r.finishedAt = null; closeMd(); write(c, r, sz.label + " uncounted"); }
var ISS = null;
function openIssue(id){
  if(!need()) return; var c = BYID[id]; ISS = {id:id, type:"Misprint", qty:1};
  var cells = []; c.groups.forEach(function(g){ g.sizes.forEach(function(s){ cells.push([s.id, g.style + " " + g.color + " " + s.label]); }); });
  openMd('<h3>Flag a problem</h3><p class="s">#' + esc(c.job) + ' · ' + esc(c.locationLabel || c.location) + ' — NOT COUNTED AS GOOD PIECES</p><div class="opts">' +
    ["Misprint","Damaged blank","Missing pieces","Other"].map(function(t){ return '<button class="opt ' + (t === "Misprint" ? "on" : "") + '" onclick="ISS.type=\'' + t + '\';[].forEach.call(this.parentNode.children,function(b){b.classList.remove(\'on\')});this.classList.add(\'on\')">' + t.toUpperCase() + '</button>'; }).join("") + '</div>' +
    '<div class="fld"><label>SIZE</label><select id="is-cell">' + cells.map(function(x){ return '<option value="' + esc(x[0]) + '">' + esc(x[1]) + '</option>'; }).join("") + '</select></div>' +
    '<div class="fld"><label>HOW MANY</label><input id="is-qty" type="number" inputmode="numeric" value="1"></div><div class="fld"><label>NOTE</label><input id="is-note" maxlength="120" placeholder="Smudge on 2 larges, blank had a hole…"></div>' +
    '<div class="row2"><button onclick="closeMd()">CANCEL</button><button class="y" onclick="saveIssue()">SAVE</button></div>');
}
function saveIssue(){
  var c = BYID[ISS.id], r = rec(c), q = Math.max(1, Math.round(Number($("is-qty").value) || 1)), sel = $("is-cell");
  r.issues.push({cell:sel.value, label:sel.options[sel.selectedIndex].text, type:ISS.type, qty:q, note:$("is-note").value.trim(), by:catcher(), at:now()});
  r.finishedAt = null; closeMd(); write(c, r, "problem: " + q + " × " + ISS.type);
}
function finishLoc(id, lane){
  var c = BYID[id], r = rec(c); r.finishedAt = now(); write(c, r, "finished");
  toast("#" + c.job + " " + (c.locationLabel || "") + " finished");
  if(lsGet("catcher_pin_" + lane) === id) lsSet("catcher_pin_" + lane, null);
}
function reopen(id){ var c = BYID[id], r = rec(c); r.finishedAt = null; write(c, r, "reopened"); }
function openHist(id){
  var c = BYID[id], r = rec(c);
  openMd('<h3>History</h3><p class="s">#' + esc(c.job) + ' · ' + esc(c.locationLabel || c.location) + '</p>' +
    (r.hist.slice().reverse().map(function(x){ return '<div style="padding:8px 0;border-top:1px solid var(--line);font:600 15px var(--in)"><b>' + fmt(x.at) + '</b> · ' + esc(x.by) + ' · ' + esc(x.w) + '</div>'; }).join("") || '<p class="s">NOTHING YET</p>') +
    '<div class="row2"><button onclick="closeMd()">CLOSE</button>' + (r.issues.length ? '<button onclick="clearIssues(\'' + id + '\')">CLEAR PROBLEMS</button>' : '') + '</div>');
}
function clearIssues(id){ var c = BYID[id], r = rec(c); r.issues = []; closeMd(); write(c, r, "problems cleared"); }
function pickFor(i){
  var t = today(), list = CARDS.filter(function(c){ return c.day === t; });
  if(!list.length) list = CARDS;
  var others = CARDS.filter(function(c){ return list.indexOf(c) === -1; });
  function item(c){ var r = rec(c), s = sumOf(c, r), p = pstat(c.id); return '<button class="wr" onclick="pin(' + i + ',\'' + c.id + '\')">' + (c.image ? '<img src="' + esc(c.image) + '">' : '<div class="th"></div>') + '<div style="min-width:0"><b>#' + esc(c.job) + ' · ' + esc(String(c.locationLabel || "").toUpperCase()) + '</b><p>' + esc(c.customer) + ' · ' + c.expected + ' pcs' + (p.press ? ' · ' + esc(p.press) : '') + '</p></div>' + pillFor(c, r, s) + '</button>'; }
  openMd('<h3>Pick a card — ' + PRESSES[i] + '</h3><p class="s">TODAY FIRST · THE LANE STAYS PINNED UNTIL YOU FINISH THE LOCATION</p>' + list.map(item).join("") +
    (others.length ? '<p class="s" style="margin-top:14px">REST OF THE WEEK</p>' + others.map(item).join("") : "") + '<div class="row2"><button onclick="closeMd()">CANCEL</button></div>');
}
function pin(i, id){ lsSet("catcher_pin_" + i, id); closeMd(); render(); }
function pillFor(c, r, s){
  if(r.finishedAt) return '<span class="pill ' + (s.exact && !s.mis ? "ok" : "diff") + '">' + (s.exact && !s.mis ? "✓ MATCHED" : "DIFFERENCES") + '</span>';
  if(s.counted) return '<span class="pill go">COUNTING ' + s.total + '/' + c.expected + '</span>';
  return '<span class="pill">NOT CAUGHT</span>';
}
function renderWeek(){
  var h = '<div class="wt">' + MAN.days.map(function(d){ var n = CARDS.filter(function(c){ return c.day === d.day; }), f = n.filter(function(c){ return rec(c).finishedAt; }).length;
    return '<button class="day ' + (d.day === WDAY ? "on" : "") + '" onclick="WDAY=\'' + d.day + '\';render()">' + dow(d.day) + ' ' + md(d.day) + '<small>' + f + '/' + n.length + ' caught</small></button>'; }).join("") + '</div><div class="wb">';
  var list = CARDS.filter(function(c){ return c.day === WDAY; });
  list.forEach(function(c){ var r = rec(c), s = sumOf(c, r), p = pstat(c.id);
    h += '<button class="wr" onclick="VIEW=\'belt\';pin(' + (p.press === "Press 2" ? 1 : 0) + ',\'' + c.id + '\')">' + (c.image ? '<img src="' + esc(c.image) + '">' : '<div class="th"></div>') +
      '<div style="min-width:0"><b>#' + esc(c.job) + ' · ' + esc(String(c.locationLabel || "").toUpperCase()) + '</b><p>' + esc(c.customer) + ' · ' + c.expected + ' pcs · press: ' + ({idle:"not started", setup:"setting up", print:"printing", pause:"stopped", done:"done"})[p.s] + (s.mis ? ' · ' + s.mis + ' flagged' : '') + '</p></div>' + pillFor(c, r, s) + '</button>'; });
  if(!list.length) h += '<div class="empty"><h2>NO <span>CARDS</span></h2></div>';
  h += '<p style="text-align:center;font:600 13px var(--in);color:var(--dim);margin-top:14px">Catcher v' + APP_V + ' · week of ' + esc(MAN.week) + ' · sizes from Printavo ' + esc(new Date(MAN.generatedAt).toLocaleDateString()) + '</p></div>';
  $("v-week").innerHTML = h;
}
function openMd(h){ $("mdbox").innerHTML = h; $("md").classList.add("on"); }
function closeMd(){ $("md").classList.remove("on"); render(); }
setInterval(function(){ if(!busy()) render(); }, 30000);
load(true);
</script>
</body>
