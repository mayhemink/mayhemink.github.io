$('help').addEventListener('click',()=>detail('Catch. Count. Confirm.',`<ol class="help-list"><li>Enter your name. Choose a day above, including Extra cards, then choose up to two print locations. Change job lets you search all scheduled days. The whole week is loaded; no daily card update is needed.</li><li>Count the bundle by size. Tap <strong>✓ All caught</strong> when it matches, or tap the white count box for the number pad and enter the actual total.</li><li>Enter <strong>0</strong> when you counted none. An empty size means it has not been counted yet.</li><li>Flag damaged blanks or print problems separately. Good-piece counts do not include those pieces.</li><li>Check spelling, match to the mockup when available, and print quality on the first shirt at each location. Check off each location printed for these garments. Finish each location when its checks and every size are counted. Short or extra counts stay flagged.</li><li>Take a picture at each print location and check <strong>PICTURE TAKEN???</strong> before changing jobs. The checkbox confirms you took the photo; it does not upload it. Changing jobs keeps your counts. Changing the catcher’s name records a handoff.</li></ol><p><strong>This trial saves on this device only.</strong> Use one tab and keep a backup. Shared saves and office comparison with Printavo receiving are not connected yet.</p><p>Order sizes come from the weekly timecards board and update on their own when jobs are added or changed. Counts from earlier days stay saved on this device. Printer completion and receiving status are not changed by this app.</p>`));
addEventListener('storage',e=>{if(e.key!==key)return;storageBlocked=true;tell('Another tab changed these counts. Reload this tab before entering more; your edits have not been overwritten.');});
// Order sizes are published by the weekly timecards build as /data/catcher.json, in the same
// commit as /data/week.json. Nothing here may clear or rewrite saved counts.
const MANIFEST_URL='/data/catcher.json',SCHEDULE_URL='/data/week.json',CACHE='mayhem-catcher-manifest-cache-v1',REFRESH_MS=180000;
let liveCards=[],lastStamp='',pendingRender=false,refreshing=false;
function savedLanes(){try{const s=JSON.parse(localStorage.getItem(STORE)||'null');return Array.isArray(s?.lanes)?s.lanes:[];}catch(e){return[];}}
function applySchedule(next,latest){
 let notice='';const rows=C.scheduleRows(latest),map=new Map(rows.map(r=>[r.id,r]));
 for(const card of next.cards){const live=map.get(card.scheduleRowId||card.id);if(!live)card.blocked='This location is no longer on the current schedule. Review it before continuing.';else if(live.scheduleSignature!==card.scheduleSignature)card.blocked='This run changed on the schedule. Its size breakdown needs a refresh.';else card.day=live.day;}
 if(latest.week!==next.week){for(const card of next.cards)card.blocked='A new schedule week is available. Refresh the order-size data before counting.';notice='The schedule has changed weeks. Saved counts are preserved; order sizes need refreshing.';}
 else if(rows.some(r=>!next.cards.some(c=>(c.scheduleRowId||c.id)===r.id)))notice='The timecards board has locations that are not in the catcher yet. Ask the office to refresh it.';
 return notice;
}
// A run that is on a card but was replaced or removed stays visible and locked, never silently dropped.
function withSelectedArchived(next){const have=new Set(next.cards.map(c=>c.runId)),extra=[];for(const id of new Set([...savedLanes(),...(practice?[]:db.lanes||[])])){if(!id||have.has(id))continue;const old=[...(next.archivedCards||[])].reverse().find(c=>c.runId===id);if(old){extra.push({...old,blocked:'This location was changed or removed on the schedule. Saved counts are kept. Ask the office to review it.'});have.add(id);}}return next.cards.concat(extra);}
function anyDialogOpen(){return !!document.querySelector('dialog[open]');}
function repaint(){if($('picker').open)listJobs();if(anyDialogOpen()&&!$('picker').open){pendingRender=true;return;}pendingRender=false;render();}
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('close',()=>{if(pendingRender&&!anyDialogOpen()){pendingRender=false;render();}}));
async function refresh(first){
 if(refreshing)return;refreshing=true;
 try{
  let text=null,offline=false;
  try{const r=await fetch(MANIFEST_URL,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);text=await r.text();JSON.parse(text);}catch(e){offline=true;text=null;}
  if(text===null){if(!first)return;try{text=localStorage.getItem(CACHE);}catch(e){}if(!text){tell('Could not load catcher cards. Reload when connected.');return;}}
  else{try{localStorage.setItem(CACHE,text);}catch(e){}}
  const next=JSON.parse(text);if(next.schema!==1||!Array.isArray(next.cards)||!Array.isArray(next.days)||!next.days.length)throw Error('Catcher cards did not load correctly.');
  let notice=offline?'Working from the last saved order sizes. Schedule could not be checked.':'',weekText='';
  if(!offline){try{const w=await fetch(SCHEDULE_URL,{cache:'no-store'});if(!w.ok)throw Error('HTTP '+w.status);weekText=await w.text();notice=applySchedule(next,JSON.parse(weekText));}catch(e){notice='Schedule could not be checked. Showing the saved order-size snapshot.';}}
  const stamp=text.length+':'+next.generatedAt+'|'+weekText.length+':'+notice;if(!first&&stamp===lastStamp)return;
  const before=new Set(liveCards.map(c=>c.runId)),weekChanged=!first&&manifest&&manifest.week!==next.week;
  lastStamp=stamp;manifest=next;liveCards=withSelectedArchived(next);if(!practice)cards=liveCards;
  if(first||(weekChanged&&!practice))load();
  const added=first?0:liveCards.filter(c=>!before.has(c.runId)&&!c.blocked).length;
  if(notice)tell(notice);else if(added)tell(added+' new location'+(added===1?'':'s')+' added from the timecards board. Cards and counts on this iPad were not changed.');
  if(first)render();else repaint();
 }catch(e){if(first)tell(e.message+' Reload when connected.');}
 finally{refreshing=false;}
}
function init(){return refresh(true);}
setInterval(()=>{if(!document.hidden)refresh(false);},REFRESH_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(false);});
init();
</script></body></html>
